<svg xmlns="http://www.w3.org/2000/svg" width="640" height="1326" viewBox="0 0 640 1326" role="img" aria-labelledby="title desc"><title id="title">Move evidence without losing its history</title><desc id="desc">Receipt of a sample is not permission to consume it in any test.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10z" fill="#52798c"/></marker></defs><rect width="640" height="1326" fill="#f5f8fa"/><g font-family="Arial,Helvetica,sans-serif"><rect width="640" height="185" fill="#163d4b"/><text x="28" y="33" font-size="18" fill="#9ee2ce" font-weight="700"><tspan x="28" dy="0">ZFU LABELS / BUYER DECISION</tspan></text><text x="28" y="83" font-size="31" fill="#ffffff" font-weight="700"><tspan x="28" dy="0">Move evidence without losing its</tspan><tspan x="28" dy="38">history</tspan></text><rect x="40" y="210" width="560" height="127" rx="15" fill="#ffffff" stroke="#becfd8" stroke-width="2"/><text x="58" y="244" font-size="26" fill="#126d65" font-weight="700"><tspan x="58" dy="0">BEFORE DISPATCH</tspan></text><text x="58" y="285" font-size="25" fill="#243b53" font-weight="400"><tspan x="58" dy="0">ID + condition + handling history</tspan></text><path d="M320 339 L320 370" fill="none" stroke="#52798c" stroke-width="3" marker-end="url(#arrow)"/><rect x="40" y="381" width="560" height="127" rx="15" fill="#ffffff" stroke="#becfd8" stroke-width="2"/><text x="58" y="415" font-size="26" fill="#126d65" font-weight="700"><tspan x="58" dy="0">TRANSFER</tspan></text><text x="58" y="456" font-size="25" fill="#243b53" font-weight="400"><tspan x="58" dy="0">Recipient + date + package reference</tspan></text><path d="M320 510 L320 541" fill="none" stroke="#52798c" stroke-width="3" marker-end="url(#arrow)"/><rect x="40" y="552" width="560" height="127" rx="15" fill="#ffffff" stroke="#becfd8" stroke-width="2"/><text x="58" y="586" font-size="26" fill="#126d65" font-weight="700"><tspan x="58" dy="0">RECEIPT</tspan></text><text x="58" y="627" font-size="25" fill="#243b53" font-weight="400"><tspan x="58" dy="0">Confirm contents and arrival condition</tspan></text><path d="M320 681 L320 712" fill="none" stroke="#52798c" stroke-width="3" marker-end="url(#arrow)"/><rect x="40" y="723" width="560" height="127" rx="15" fill="#ffffff" stroke="#becfd8" stroke-width="2"/><text x="58" y="757" font-size="26" fill="#126d65" font-weight="700"><tspan x="58" dy="0">PERMISSION</tspan></text><text x="58" y="798" font-size="25" fill="#243b53" font-weight="400"><tspan x="58" dy="0">Named examination and sample remainder</tspan></text><path d="M320 852 L320 883" fill="none" stroke="#52798c" stroke-width="3" marker-end="url(#arrow)"/><rect x="40" y="894" width="560" height="159" rx="15" fill="#ffffff" stroke="#becfd8" stroke-width="2"/><text x="58" y="928" font-size="26" fill="#126d65" font-weight="700"><tspan x="58" dy="0">CLOSE HANDOFF</tspan></text><text x="58" y="969" font-size="25" fill="#243b53" font-weight="400"><tspan x="58" dy="0">Return/disposal and unresolved</tspan><tspan x="58" dy="32">findings</tspan></text><rect x="24" y="1097" width="592" height="159" rx="15" fill="#f0f4f6" stroke="#becfd8" stroke-width="2"/><text x="42" y="1131" font-size="26" fill="#126d65" font-weight="700"><tspan x="42" dy="0">SCOPE / OPEN CONDITION</tspan></text><text x="42" y="1172" font-size="25" fill="#243b53" font-weight="400"><tspan x="42" dy="0">Receipt of a sample is not permission to</tspan><tspan x="42" dy="32">consume it in any test.</tspan></text><text x="28" y="1303" font-size="18" fill="#526979" font-weight="400"><tspan x="28" dy="0">Editorial planning aid • use with the article worksheet</tspan></text></g></svg>