<svg xmlns="http://www.w3.org/2000/svg" width="640" height="1195" viewBox="0 0 640 1195" role="img" aria-labelledby="title desc"><title id="title">A delivery is not one release</title><desc id="desc">A passing sample does not close B or C. No sample size is specified.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10z" fill="#52798c"/></marker></defs><rect width="640" height="1195" fill="#f5f8fa"/><g font-family="Arial,Helvetica,sans-serif"><rect width="640" height="185" fill="#163d4b"/><text x="28" y="33" font-size="18" fill="#9ee2ce" font-weight="700"><tspan x="28" dy="0">ZFU LABELS / BUYER DECISION</tspan></text><text x="28" y="83" font-size="31" fill="#ffffff" font-weight="700"><tspan x="28" dy="0">A delivery is not one release</tspan></text><rect x="40" y="210" width="560" height="159" rx="15" fill="#e7f2f7" stroke="#becfd8" stroke-width="2"/><text x="58" y="244" font-size="26" fill="#126d65" font-weight="700"><tspan x="58" dy="0">MIXED DELIVERY</tspan></text><text x="58" y="285" font-size="25" fill="#243b53" font-weight="400"><tspan x="58" dy="0">Map its distinct populations before</tspan><tspan x="58" dy="32">applying the agreed plan.</tspan></text><rect x="40" y="414" width="560" height="159" rx="15" fill="#e9f7ee" stroke="#becfd8" stroke-width="2"/><text x="58" y="448" font-size="26" fill="#126d65" font-weight="700"><tspan x="58" dy="0">GROUP A</tspan></text><text x="58" y="489" font-size="25" fill="#243b53" font-weight="400"><tspan x="58" dy="0">Identity + scoped evidence / A-only</tspan><tspan x="58" dy="32">decision</tspan></text><rect x="40" y="598" width="560" height="159" rx="15" fill="#fff0eb" stroke="#becfd8" stroke-width="2"/><text x="58" y="632" font-size="26" fill="#126d65" font-weight="700"><tspan x="58" dy="0">GROUP B</tspan></text><text x="58" y="673" font-size="25" fill="#243b53" font-weight="400"><tspan x="58" dy="0">Different revision; coverage open /</tspan><tspan x="58" dy="32">Pending separate review</tspan></text><rect x="40" y="782" width="560" height="159" rx="15" fill="#fff0eb" stroke="#becfd8" stroke-width="2"/><text x="58" y="816" font-size="26" fill="#126d65" font-weight="700"><tspan x="58" dy="0">GROUP C</tspan></text><text x="58" y="857" font-size="25" fill="#243b53" font-weight="400"><tspan x="58" dy="0">Construction identity unresolved /</tspan><tspan x="58" dy="32">Hold affected material</tspan></text><rect x="24" y="966" width="592" height="159" rx="15" fill="#f0f4f6" stroke="#becfd8" stroke-width="2"/><text x="42" y="1000" font-size="26" fill="#126d65" font-weight="700"><tspan x="42" dy="0">SCOPE / OPEN CONDITION</tspan></text><text x="42" y="1041" font-size="25" fill="#243b53" font-weight="400"><tspan x="42" dy="0">A passing sample does not close B or C.</tspan><tspan x="42" dy="32">No sample size is specified.</tspan></text><text x="28" y="1172" font-size="18" fill="#526979" font-weight="400"><tspan x="28" dy="0">Editorial planning aid • use with the article worksheet</tspan></text></g></svg>