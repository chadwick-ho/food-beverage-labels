<svg xmlns="http://www.w3.org/2000/svg" width="640" height="1120" viewBox="0 0 640 1120" role="img" aria-label="Summed material area is not the surface union"><g font-family="Arial, sans-serif"><rect x="0" y="0" width="640" height="1120" fill="#f2f7fa" stroke="#a5becb" stroke-width="2"/><rect x="0" y="0" width="640" height="190" fill="#173e4b" stroke="#a5becb" stroke-width="2"/><text x="30" y="35" font-size="18" font-weight="700" fill="#a4e1d0"><tspan x="30" dy="0">ZFU LABELS / PURCHASING DIAGRAM</tspan></text><text x="30" y="88" font-size="32" font-weight="700" fill="#fff"><tspan x="30" dy="0">Summed material area is not the</tspan><tspan x="30" dy="40">surface union</tspan></text><rect x="60" y="285" width="305" height="255" fill="#c9e8e0" stroke="#a5becb" stroke-width="2"/><rect x="290" y="410" width="260" height="235" fill="#ffdf9f" stroke="#a5becb" stroke-width="2"/><rect x="290" y="410" width="75" height="130" fill="#b6c3ab" stroke="#a5becb" stroke-width="2"/><text x="90" y="355" font-size="32" font-weight="700" fill="#213b4c"><tspan x="90" dy="0">A = 40</tspan></text><text x="378" y="570" font-size="30" font-weight="700" fill="#213b4c"><tspan x="378" dy="0">B = 30</tspan></text><text x="34" y="710" font-size="29" font-weight="700" fill="#213b4c"><tspan x="34" dy="0">Overlap = 5 square units</tspan></text><text x="34" y="788" font-size="29" font-weight="700" fill="#213b4c"><tspan x="34" dy="0">Sum = 40 + 30 = 70</tspan></text><text x="34" y="853" font-size="29" font-weight="700" fill="#213b4c"><tspan x="34" dy="0">Union = 40 + 30 - 5 = 65</tspan></text><text x="34" y="946" font-size="27" font-weight="400" fill="#213b4c"><tspan x="34" dy="0">Not to scale. Ask the assessor which</tspan><tspan x="34" dy="35">measurement basis applies.</tspan></text><text x="30" y="1095" font-size="18" font-weight="400" fill="#4b6473"><tspan x="30" dy="0">Planning example / no customer result or acceptance limit</tspan></text></g></svg>