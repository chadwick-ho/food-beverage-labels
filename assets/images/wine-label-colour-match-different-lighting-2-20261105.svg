<svg xmlns="http://www.w3.org/2000/svg" width="660" height="600" viewBox="0 0 660 600"><title>A pair-by-light observation record</title><rect width="660" height="600" fill="#edf4ef"/><g font-family="Arial" fill="#12304a"><text x="30" y="48" font-size="29" font-weight="bold">A pair-by-light observation record</text><rect x="30" y="110" width="600" height="340" rx="12" fill="white"/><path d="M30 190h600M30 300h600M300 110v340" stroke="#a5bfb0" stroke-width="2"/><text x="55" y="158" font-size="25" font-weight="bold">Same identified pair</text><text x="325" y="158" font-size="25" font-weight="bold">Record the result</text><text x="55" y="240" font-size="24">Agreed primary light</text><text x="325" y="235" font-size="24">Match, difference</text><text x="325" y="270" font-size="24">or unresolved view?</text><text x="55" y="350" font-size="24">Relevant other light</text><text x="325" y="345" font-size="24">Same pair and</text><text x="325" y="380" font-size="24">known presentation?</text><text x="55" y="500" font-size="24">Ask what the observations actually establish.</text><text x="30" y="570" font-size="21">Editorial worksheet; no actual match or acceptance limit shown.</text></g></svg>