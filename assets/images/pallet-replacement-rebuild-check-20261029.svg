<svg xmlns="http://www.w3.org/2000/svg" width="500" height="1050" viewBox="0 0 500 1050" role="img" aria-labelledby="t d"><title id="t">Logistics-label replacement or pallet rebuild?</title><desc id="d">Two event paths lead to a shared physical unit, label and record check.</desc><rect width="500" height="1050" fill="#f3f7f7"/><rect width="500" height="145" fill="#173d4a"/><g font-family="Arial" fill="#183f4d"><text x="24" y="38" fill="#a4e9d6" font-size="19">BUYER DECISION / LOGISTICS</text><text x="24" y="79" fill="white" font-size="27" font-weight="bold">Replace a label or</text><text x="24" y="114" fill="white" font-size="27" font-weight="bold">rebuild a pallet?</text>
<rect x="25" y="175" width="450" height="95" rx="12" fill="white" stroke="#a9cbd2" stroke-width="2"/><text x="45" y="215" font-size="23" font-weight="bold" fill="#087a78">WHAT HAPPENED?</text><text x="45" y="248" font-size="20">Identify the physical unit and event.</text><path d="M250 270v30M250 300H133v35M250 300h117v35" fill="none" stroke="#688e9a" stroke-width="3"/>
<rect x="20" y="335" width="225" height="260" rx="12" fill="#e9f5f0" stroke="#a9cbd2" stroke-width="2"/><text x="35" y="373" font-size="21" font-weight="bold" fill="#087a78">SAME UNIT</text><text x="35" y="415" font-size="20">Record damaged</text><text x="35" y="445" font-size="20">label and unit.</text><text x="35" y="485" font-size="20">Ask for authorized</text><text x="35" y="515" font-size="20">replacement output.</text><text x="35" y="555" font-size="19">Control loose prints.</text>
<rect x="255" y="335" width="225" height="260" rx="12" fill="#edf4fa" stroke="#a9cbd2" stroke-width="2"/><text x="270" y="373" font-size="21" font-weight="bold" fill="#087a78">REBUILT</text><text x="270" y="415" font-size="20">Record changed</text><text x="270" y="445" font-size="20">units and contents.</text><text x="270" y="485" font-size="20">Ask the data owner</text><text x="270" y="515" font-size="20">which records apply.</text><text x="270" y="555" font-size="19">Do not copy blindly.</text>
<path d="M133 595v35h117M367 595v35H250v35" fill="none" stroke="#688e9a" stroke-width="3"/><path d="M242 653l8 13 8-13" fill="#688e9a"/>
<rect x="25" y="665" width="450" height="165" rx="12" fill="white" stroke="#a9cbd2" stroke-width="2"/><text x="45" y="705" font-size="23" font-weight="bold" fill="#087a78">MATCH BEFORE RELEASE</text><text x="45" y="747" font-size="21">Physical unit + authorized label +</text><text x="45" y="779" font-size="21">dispatch record must correspond.</text><text x="45" y="811" font-size="19">A scan alone cannot confirm contents.</text>
<text x="25" y="880" font-size="21" font-weight="bold" fill="#a24229">Unknown identity? Hold and ask the</text><text x="25" y="912" font-size="21" font-weight="bold" fill="#a24229">responsible data owner.</text><text x="25" y="1008" font-size="17">Planning aid • not an identifier or compliance decision</text></g></svg>
