<svg xmlns="http://www.w3.org/2000/svg" width="660" height="600" viewBox="0 0 660 600"><title>Keep three parts of the offer separate</title><rect width="660" height="600" fill="#edf4ef"/><g font-family="Arial" fill="#12304a"><text x="30" y="48" font-size="29" font-weight="bold">Keep three parts of the offer separate</text><rect x="40" y="110" width="580" height="100" rx="12" fill="white"/><text x="65" y="152" font-size="27" font-weight="bold">Printing</text><text x="65" y="190" font-size="24">Which actual print process produces the image?</text><rect x="40" y="260" width="580" height="100" rx="12" fill="white"/><text x="65" y="302" font-size="27" font-weight="bold">Cutting</text><text x="65" y="340" font-size="24">Which tool or supported controlled path is used?</text><rect x="40" y="410" width="580" height="100" rx="12" fill="white"/><text x="65" y="452" font-size="27" font-weight="bold">Complete delivery</text><text x="65" y="490" font-size="24">Construction, waste removal, format and evidence.</text><text x="30" y="570" font-size="21">No-tool cutting is not a universal zero-setup price.</text></g></svg>