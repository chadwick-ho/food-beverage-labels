<svg xmlns="http://www.w3.org/2000/svg" width="640" height="1120" viewBox="0 0 640 1120" role="img" aria-label="A full repeat lasts longer than its gap"><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8Z" fill="#486e80"/></marker></defs><g font-family="Arial, sans-serif"><rect x="0" y="0" width="640" height="1120" rx="0" fill="#f2f7fa" stroke="#a5becb" stroke-width="2"/><rect x="0" y="0" width="640" height="190" rx="0" fill="#173e4b" stroke="#173e4b" stroke-width="2"/><text x="30" y="35" fill="#a4e1d0" font-size="18" font-weight="700"><tspan x="30" dy="0">ZFU LABELS / PURCHASING DIAGRAM</tspan></text><text x="30" y="88" fill="#fff" font-size="32" font-weight="700"><tspan x="30" dy="0">A full repeat lasts longer than</tspan><tspan x="30" dy="40">its gap</tspan></text><text x="34" y="241" fill="#213b4c" font-size="26" font-weight="700"><tspan x="34" dy="0">FICTIONAL STEADY WEB: 30 m/min</tspan></text><text x="34" y="292" fill="#213b4c" font-size="30" font-weight="700"><tspan x="34" dy="0">30 m/min = 500 mm/s</tspan></text><rect x="50" y="354" width="481" height="155" rx="0" fill="#c9e8e0" stroke="#a5becb" stroke-width="2"/><rect x="531" y="354" width="39" height="155" rx="0" fill="#ffdf9f" stroke="#a5becb" stroke-width="2"/><text x="70" y="418" fill="#213b4c" font-size="27" font-weight="400"><tspan x="70" dy="0">Label-bearing part</tspan></text><text x="70" y="463" fill="#213b4c" font-size="24" font-weight="400"><tspan x="70" dy="0">Sensed gap at right</tspan></text><path d="M50 549 L570 549" fill="none" stroke="#486e80" stroke-width="3"/><path d="M50 537 L50 561" fill="none" stroke="#486e80" stroke-width="3"/><path d="M570 537 L570 561" fill="none" stroke="#486e80" stroke-width="3"/><text x="123" y="597" fill="#213b4c" font-size="29" font-weight="700"><tspan x="123" dy="0">40 mm pitch = 80 ms</tspan></text><path d="M550 513 L550 653" fill="none" stroke="#486e80" stroke-width="3" marker-end="url(#arrow)"/><text x="114" y="711" fill="#213b4c" font-size="34" font-weight="700"><tspan x="114" dy="0">3 mm gap = 6 ms</tspan></text><rect x="34" y="782" width="572" height="225" rx="14" fill="#fff1de" stroke="#a5becb" stroke-width="2"/><text x="54" y="828" fill="#213b4c" font-size="27" font-weight="700"><tspan x="54" dy="0">The shorter feature is a separate</tspan><tspan x="54" dy="35">window.</tspan></text><text x="54" y="921" fill="#213b4c" font-size="25" font-weight="400"><tspan x="54" dy="0">Arithmetic does not qualify sensor</tspan><tspan x="54" dy="33">response, controls or restart</tspan><tspan x="54" dy="33">behaviour.</tspan></text><text x="30" y="1095" fill="#4b6473" font-size="18" font-weight="400"><tspan x="30" dy="0">Planning example / no customer result or acceptance limit</tspan></text></g></svg>