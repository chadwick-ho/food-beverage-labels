<svg xmlns="http://www.w3.org/2000/svg" width="640" height="1038" viewBox="0 0 640 1038" role="img" aria-labelledby="title desc"><title id="title">A new roll ID keeps its parent links</title><desc id="desc">Illustrative IDs only. Unknown internal boundaries cannot justify assigning one parent exclusively to one finished run.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10z" fill="#52798c"/></marker></defs><rect width="640" height="1038" fill="#f5f8fa"/><g font-family="Arial,Helvetica,sans-serif"><rect width="640" height="185" fill="#163d4b"/><text x="28" y="33" font-size="18" fill="#9ee2ce" font-weight="700"><tspan x="28" dy="0">ZFU LABELS / BUYER DECISION</tspan></text><text x="28" y="83" font-size="31" fill="#ffffff" font-weight="700"><tspan x="28" dy="0">A new roll ID keeps its parent</tspan><tspan x="28" dy="38">links</tspan></text><rect x="24" y="210" width="282" height="122" rx="15" fill="#ffffff" stroke="#becfd8" stroke-width="2"/><text x="42" y="244" font-size="24" fill="#126d65" font-weight="700"><tspan x="42" dy="0">PARENT L1</tspan></text><text x="42" y="283" font-size="22" fill="#243b53" font-weight="400"><tspan x="42" dy="0">Original lot / roll</tspan></text><rect x="334" y="210" width="282" height="122" rx="15" fill="#ffffff" stroke="#becfd8" stroke-width="2"/><text x="352" y="244" font-size="24" fill="#126d65" font-weight="700"><tspan x="352" dy="0">PARENT L2</tspan></text><text x="352" y="283" font-size="22" fill="#243b53" font-weight="400"><tspan x="352" dy="0">Original lot / roll</tspan></text><path d="M165 332 L270 377" fill="none" stroke="#52798c" stroke-width="3" marker-end="url(#arrow)"/><path d="M475 332 L370 377" fill="none" stroke="#52798c" stroke-width="3" marker-end="url(#arrow)"/><rect x="40" y="377" width="560" height="191" rx="15" fill="#e7f2f7" stroke="#becfd8" stroke-width="2"/><text x="58" y="411" font-size="26" fill="#126d65" font-weight="700"><tspan x="58" dy="0">REWIND EVENT → CHILD W</tspan></text><text x="58" y="452" font-size="25" fill="#243b53" font-weight="400"><tspan x="58" dy="0">Preserve both parents, authority,</tspan><tspan x="58" dy="32">quantities and the known or unknown</tspan><tspan x="58" dy="32">internal boundary.</tspan></text><path d="M270 568 L165 623" fill="none" stroke="#52798c" stroke-width="3" marker-end="url(#arrow)"/><path d="M370 568 L475 623" fill="none" stroke="#52798c" stroke-width="3" marker-end="url(#arrow)"/><rect x="24" y="623" width="282" height="122" rx="15" fill="#ffffff" stroke="#becfd8" stroke-width="2"/><text x="42" y="657" font-size="24" fill="#126d65" font-weight="700"><tspan x="42" dy="0">RUN A</tspan></text><text x="42" y="696" font-size="22" fill="#243b53" font-weight="400"><tspan x="42" dy="0">Actual W consumption</tspan></text><rect x="334" y="623" width="282" height="122" rx="15" fill="#ffffff" stroke="#becfd8" stroke-width="2"/><text x="352" y="657" font-size="24" fill="#126d65" font-weight="700"><tspan x="352" dy="0">RUN B</tspan></text><text x="352" y="696" font-size="22" fill="#243b53" font-weight="400"><tspan x="352" dy="0">Actual W consumption</tspan></text><rect x="24" y="777" width="592" height="191" rx="15" fill="#f0f4f6" stroke="#becfd8" stroke-width="2"/><text x="42" y="811" font-size="26" fill="#126d65" font-weight="700"><tspan x="42" dy="0">SCOPE / OPEN CONDITION</tspan></text><text x="42" y="852" font-size="25" fill="#243b53" font-weight="400"><tspan x="42" dy="0">Illustrative IDs only. Unknown internal</tspan><tspan x="42" dy="32">boundaries cannot justify assigning one</tspan><tspan x="42" dy="32">parent exclusively to one finished run.</tspan></text><text x="28" y="1015" font-size="18" fill="#526979" font-weight="400"><tspan x="28" dy="0">Editorial planning aid • use with the article worksheet</tspan></text></g></svg>