<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 1000"><title>Label sheet curl investigation checklist</title><rect width="760" height="1000" fill="#f2f7f4"/><g font-family="Arial" fill="#12304a"><text x="40" y="70" font-size="36" font-weight="bold">Trace the sheet condition</text><text x="40" y="108" font-size="22">Editorial checklist · not a repair procedure</text><rect x="40" y="145" width="680" height="155" rx="16" fill="white"/><text x="65" y="190" font-size="27" font-weight="bold">1 · Before the printer</text><text x="65" y="230" font-size="22">Record packaging, storage and flatness.</text><text x="65" y="270" font-size="22">Keep the material identity and lot.</text><path d="M380 300v30" stroke="#568374" stroke-width="5"/><rect x="40" y="330" width="680" height="155" rx="16" fill="white"/><text x="65" y="375" font-size="27" font-weight="bold">2 · Confirm compatibility</text><text x="65" y="415" font-size="22">Check sheet and printer instructions.</text><text x="65" y="455" font-size="22">Identify the approved feed and print mode.</text><path d="M380 485v30" stroke="#568374" stroke-width="5"/><rect x="40" y="515" width="680" height="155" rx="16" fill="white"/><text x="65" y="560" font-size="27" font-weight="bold">3 · Observe first output</text><text x="65" y="600" font-size="22">Record curl, print and feed observations.</text><text x="65" y="640" font-size="22">Keep the sample and conditions together.</text><path d="M380 670v30" stroke="#568374" stroke-width="5"/><rect x="40" y="700" width="680" height="190" rx="16" fill="white"/><text x="65" y="745" font-size="27" font-weight="bold">4 · Plan the remainder</text><text x="65" y="785" font-size="22">Separate unused sheets from printed stock.</text><text x="65" y="825" font-size="22">Follow the supplier's re-feed instructions.</text><text x="65" y="865" font-size="22">Escalate jams or unknown compatibility.</text></g></svg>