<svg xmlns="http://www.w3.org/2000/svg" width="640" height="1648" viewBox="0 0 640 1648" role="img" aria-labelledby="title desc"><title id="title">Which approvals transfer from glass to PET?</title><desc id="desc">Article-specific editorial purchasing aid. Follow the decision and preserve unresolved conditions with the responsible reviewer.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10z" fill="#517b89"/></marker></defs><rect width="640" height="1648" fill="#f4f8fa"/><g font-family="Arial,Helvetica,sans-serif"><rect width="640" height="168" fill="#163d4b"/><text x="28" y="30" fill="#9ee2ce" font-size="19" font-weight="700"><tspan x="28" dy="0">ZFU LABELS · BUYER DECISION</tspan></text><text x="28" y="76" fill="#ffffff" font-size="32" font-weight="700"><tspan x="28" dy="0">Which approvals transfer from</tspan><tspan x="28" dy="39">glass to PET?</tspan></text><rect x="44" y="198" width="552" height="168" rx="17" fill="#ffffff" stroke="#d5e2e9" stroke-width="2"/><text x="68" y="237" fill="#137f75" font-size="26" font-weight="700"><tspan x="68" dy="0">01  Identify the pack change</tspan></text><text x="68" y="277" fill="#243b53" font-size="25" font-weight="400"><tspan x="68" dy="0">Bottle, filled geometry and</tspan><tspan x="68" dy="33">application</tspan></text><path d="M320 366 V396" stroke="#517b89" stroke-width="3" fill="none" marker-end="url(#arrow)"/><rect x="44" y="404" width="552" height="168" rx="17" fill="#ffffff" stroke="#d5e2e9" stroke-width="2"/><text x="68" y="443" fill="#137f75" font-size="26" font-weight="700"><tspan x="68" dy="0">02  Split the old evidence</tspan></text><text x="68" y="483" fill="#243b53" font-size="25" font-weight="400"><tspan x="68" dy="0">Fit, adhesion, appearance,</tspan><tspan x="68" dy="33">handling and copy</tspan></text><path d="M320 572 V602" stroke="#517b89" stroke-width="3" fill="none" marker-end="url(#arrow)"/><rect x="44" y="610" width="552" height="168" rx="17" fill="#ffffff" stroke="#d5e2e9" stroke-width="2"/><text x="68" y="649" fill="#137f75" font-size="26" font-weight="700"><tspan x="68" dy="0">03  Compare each item</tspan></text><text x="68" y="689" fill="#243b53" font-size="25" font-weight="400"><tspan x="68" dy="0">What did the glass sample</tspan><tspan x="68" dy="33">actually represent?</tspan></text><path d="M320 778 V808" stroke="#517b89" stroke-width="3" fill="none" marker-end="url(#arrow)"/><rect x="44" y="816" width="552" height="160" rx="17" fill="#e3f2f4" stroke="#588c9a" stroke-width="2"/><text x="68" y="859" fill="#163d4b" font-size="27" font-weight="700"><tspan x="68" dy="0">Does the evidence cover the</tspan><tspan x="68" dy="35">proposed PET condition?</tspan></text><path d="M44 911 H24 V1086 H44" fill="none" stroke="#10765b" stroke-width="3" marker-end="url(#arrow)"/><rect x="44" y="1016" width="552" height="230" rx="17" fill="#e9f7ee" stroke="#10765b" stroke-width="2"/><text x="68" y="1055" fill="#10765b" font-size="26" font-weight="700"><tspan x="68" dy="0">YES · Retain the represented</tspan><tspan x="68" dy="33">item</tspan></text><text x="68" y="1128" fill="#243b53" font-size="25" font-weight="400"><tspan x="68" dy="0">Record its scope and supporting</tspan><tspan x="68" dy="33">reference.</tspan></text><path d="M596 911 H616 V1346 H596" fill="none" stroke="#a54232" stroke-width="3" marker-end="url(#arrow)"/><rect x="44" y="1276" width="552" height="230" rx="17" fill="#fff0eb" stroke="#a54232" stroke-width="2"/><text x="68" y="1315" fill="#a54232" font-size="26" font-weight="700"><tspan x="68" dy="0">NO · Reopen that evidence item</tspan></text><text x="68" y="1355" fill="#243b53" font-size="25" font-weight="400"><tspan x="68" dy="0">Request the relevant evaluation,</tspan><tspan x="68" dy="33">not an assumed full transfer.</tspan></text><text x="44" y="1566" fill="#526979" font-size="21" font-weight="400"><tspan x="44" dy="0">Use with the article worksheet and actual</tspan><tspan x="44" dy="28">package evidence.</tspan></text></g></svg>