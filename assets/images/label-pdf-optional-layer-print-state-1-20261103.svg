<svg xmlns="http://www.w3.org/2000/svg" width="660" height="550" viewBox="0 0 660 550"><title>Screen state and output state</title><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#527c6d"/></marker></defs><rect width="660" height="550" fill="#edf4ef"/><g font-family="Arial, sans-serif" fill="#12304a"><text x="30" y="48" font-size="30" font-weight="bold">Screen state and output state</text><text x="30" y="95" font-size="21">The file needs an explicit intended result</text><path d="M170 315L230 365" stroke="#527c6d" stroke-width="4" marker-end="url(#arrow)"/><path d="M490 315L430 365" stroke="#527c6d" stroke-width="4" marker-end="url(#arrow)"/><rect x="30" y="145" width="280" height="170" rx="14" fill="white" stroke="#aac4b8" stroke-width="2"/><text x="48" y="182" font-size="26" font-weight="bold">Screen preview</text><text x="48" y="220" font-size="24">What this viewer</text><text x="48" y="254" font-size="24">currently shows</text><text x="48" y="288" font-size="24">or hides</text><rect x="350" y="145" width="280" height="170" rx="14" fill="white" stroke="#aac4b8" stroke-width="2"/><text x="368" y="182" font-size="26" font-weight="bold">Print output</text><text x="368" y="220" font-size="24">What the actual</text><text x="368" y="254" font-size="24">workflow includes</text><text x="368" y="288" font-size="24">or excludes</text><rect x="30" y="375" width="600" height="120" rx="14" fill="white" stroke="#aac4b8" stroke-width="2"/><text x="48" y="412" font-size="26" font-weight="bold">Compare with the intended-output map</text><text x="48" y="450" font-size="24">A hidden screenshot element</text><text x="48" y="484" font-size="24">is not automatically a nonprinting element.</text></g></svg>