<svg xmlns="http://www.w3.org/2000/svg" width="660" height="570" viewBox="0 0 660 570"><title>Named exclusions are not interchangeable</title><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#527c6d"/></marker></defs><rect width="660" height="570" fill="#edf4ef"/><g font-family="Arial, sans-serif" fill="#12304a"><text x="30" y="48" font-size="30" font-weight="bold">Named exclusions are not interchangeable</text><text x="30" y="95" font-size="21">Read the exact material declaration</text><rect x="30" y="145" width="600" height="105" rx="14" fill="white" stroke="#aac4b8" stroke-width="2"/><text x="48" y="182" font-size="26" font-weight="bold">BPA-free</text><text x="48" y="220" font-size="24">A statement about a named substance</text><rect x="30" y="280" width="600" height="105" rx="14" fill="white" stroke="#aac4b8" stroke-width="2"/><text x="48" y="317" font-size="26" font-weight="bold">BPS-free</text><text x="48" y="355" font-size="24">A different named-substance statement</text><rect x="30" y="415" width="600" height="105" rx="14" fill="white" stroke="#aac4b8" stroke-width="2"/><text x="48" y="452" font-size="26" font-weight="bold">Phenol-free</text><text x="48" y="490" font-size="24">A broader category needing a stated definition</text></g></svg>