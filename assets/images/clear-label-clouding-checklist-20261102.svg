<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 1000"><title>Clear-label clouding evidence checklist</title><rect width="760" height="1000" fill="#f2f7f4"/><g font-family="Arial" fill="#12304a"><text x="40" y="70" font-size="36" font-weight="bold">Record the cloudy sample</text><text x="40" y="108" font-size="22">Editorial checklist · not a diagnosis</text><rect x="40" y="145" width="680" height="155" rx="16" fill="white"/><text x="65" y="190" font-size="27" font-weight="bold">1 · Identify the construction</text><text x="65" y="230" font-size="22">Bottle, film, adhesive, print and sample lot.</text><text x="65" y="270" font-size="22">Keep comparison samples traceable.</text><path d="M380 300v30" stroke="#568374" stroke-width="5"/><rect x="40" y="330" width="680" height="155" rx="16" fill="white"/><text x="65" y="375" font-size="27" font-weight="bold">2 · Record the timeline</text><text x="65" y="415" font-size="22">Surface condition at application and later exposure.</text><text x="65" y="455" font-size="22">Note when the appearance first changed.</text><path d="M380 485v30" stroke="#568374" stroke-width="5"/><rect x="40" y="515" width="680" height="155" rx="16" fill="white"/><text x="65" y="560" font-size="27" font-weight="bold">3 · Separate observations</text><text x="65" y="600" font-size="22">Clarity, print, bubbles and edge attachment.</text><text x="65" y="640" font-size="22">A cloudy patch does not establish the cause.</text><path d="M380 670v30" stroke="#568374" stroke-width="5"/><rect x="40" y="700" width="680" height="190" rx="16" fill="white"/><text x="65" y="745" font-size="27" font-weight="bold">4 · Agree the next comparison</text><text x="65" y="785" font-size="22">Define samples, conditions and review time.</text><text x="65" y="825" font-size="22">Use the actual product and package route.</text><text x="65" y="865" font-size="22">Keep unknowns visible before approval.</text></g></svg>