<svg xmlns="http://www.w3.org/2000/svg" width="660" height="900" viewBox="0 0 660 900"><title>Choose the sheet before printing</title><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#527c6d"/></marker></defs><rect width="660" height="900" fill="#edf4ef"/><g font-family="Arial, sans-serif" fill="#12304a"><text x="30" y="48" font-size="30" font-weight="bold">Choose the sheet before printing</text><text x="30" y="95" font-size="21">Match media documentation with device instructions</text><path d="M330 270L170 315" stroke="#527c6d" stroke-width="4" marker-end="url(#arrow)"/><path d="M330 270L490 315" stroke="#527c6d" stroke-width="4" marker-end="url(#arrow)"/><path d="M170 510L230 560" stroke="#527c6d" stroke-width="4" marker-end="url(#arrow)"/><path d="M490 510L430 560" stroke="#527c6d" stroke-width="4" marker-end="url(#arrow)"/><path d="M330 690L330 740" stroke="#527c6d" stroke-width="4" marker-end="url(#arrow)"/><rect x="30" y="145" width="600" height="125" rx="14" fill="white" stroke="#aac4b8" stroke-width="2"/><text x="48" y="182" font-size="26" font-weight="bold">Identify the real printing route</text><text x="48" y="220" font-size="24">Printer model, technology and responsible owner.</text><rect x="30" y="325" width="280" height="185" rx="14" fill="white" stroke="#aac4b8" stroke-width="2"/><text x="48" y="362" font-size="26" font-weight="bold">Sheet evidence</text><text x="48" y="400" font-size="24">Exact reference</text><text x="48" y="434" font-size="24">and documented</text><text x="48" y="468" font-size="24">printing scope.</text><rect x="350" y="325" width="280" height="185" rx="14" fill="white" stroke="#aac4b8" stroke-width="2"/><text x="368" y="362" font-size="26" font-weight="bold">Device evidence</text><text x="368" y="400" font-size="24">Supported media</text><text x="368" y="434" font-size="24">and applicable</text><text x="368" y="468" font-size="24">feed instructions.</text><rect x="30" y="570" width="600" height="120" rx="14" fill="white" stroke="#aac4b8" stroke-width="2"/><text x="48" y="607" font-size="26" font-weight="bold">Resolve the compatibility gap</text><text x="48" y="645" font-size="24">No unsupported trial or guessed machine setting.</text><rect x="30" y="750" width="600" height="110" rx="14" fill="white" stroke="#aac4b8" stroke-width="2"/><text x="48" y="787" font-size="26" font-weight="bold">Then qualify the finished package</text><text x="48" y="825" font-size="24">Feed success alone is not wet-use approval.</text></g></svg>