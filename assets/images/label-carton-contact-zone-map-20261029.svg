<svg xmlns="http://www.w3.org/2000/svg" width="500" height="1050" viewBox="0 0 500 1050" role="img" aria-labelledby="t d"><title id="t">Map package contact zones before a rub comparison</title><desc id="d">An illustrative label panel has two distinct contact areas, with different printed functions to review.</desc><rect width="500" height="1050" fill="#f3f7f7"/><rect width="500" height="145" fill="#173d4a"/><g font-family="Arial" fill="#183f4d"><text x="24" y="38" fill="#a4e9d6" font-size="19">BUYER DECISION / DURABILITY</text><text x="24" y="79" fill="white" font-size="27" font-weight="bold">Which printed area</text><text x="24" y="114" fill="white" font-size="27" font-weight="bold">meets which contact?</text>
<rect x="20" y="175" width="460" height="360" rx="12" fill="white" stroke="#a9cbd2" stroke-width="2"/><text x="40" y="215" font-size="23" font-weight="bold" fill="#087a78">ILLUSTRATIVE LABEL PANEL</text><rect x="65" y="255" width="370" height="185" rx="8" fill="#edf4fa" stroke="#6a91a0" stroke-width="2"/><rect x="85" y="275" width="130" height="145" fill="#f9ddd4" stroke="#ba644c" stroke-width="3"/><text x="105" y="335" font-size="20">A: brand</text><text x="105" y="365" font-size="20">panel</text><rect x="285" y="315" width="125" height="80" fill="#dff2e9" stroke="#39958b" stroke-width="3"/><text x="300" y="350" font-size="20">B: later</text><text x="300" y="378" font-size="20">code</text><text x="40" y="500" font-size="19">Example areas are not observed damage.</text>
<rect x="20" y="560" width="460" height="250" rx="12" fill="#e9f5f0" stroke="#a9cbd2" stroke-width="2"/><text x="40" y="600" font-size="23" font-weight="bold" fill="#087a78">RECORD THE ACTUAL CONTACT</text><text x="40" y="644" font-size="21">What touched each printed region?</text><text x="40" y="678" font-size="21">Known contact or an open question?</text><text x="40" y="712" font-size="21">Was the later code on the test sample?</text><text x="40" y="746" font-size="21">Which method and inspection apply?</text>
<text x="20" y="870" font-size="21" fill="#a24229">A location map is not a rub-test result.</text><text x="20" y="904" font-size="21" fill="#a24229">A nearby divider does not prove cause.</text><text x="20" y="1015" font-size="17">Illustration only • agree the actual test and acceptance</text></g></svg>
