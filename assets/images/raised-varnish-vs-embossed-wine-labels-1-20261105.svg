<svg xmlns="http://www.w3.org/2000/svg" width="660" height="600" viewBox="0 0 660 600"><title>Two different ways to create relief</title><rect width="660" height="600" fill="#edf4ef"/><g font-family="Arial" fill="#12304a"><text x="30" y="48" font-size="29" font-weight="bold">Two different ways to create relief</text><text x="45" y="115" font-size="26" font-weight="bold">Form the paper face</text><path d="M55 220h130c0-65 100-65 100 0h300v25H285c0-65-100-65-100 0H55z" fill="#d2b66f" stroke="#806635" stroke-width="3"/><text x="45" y="310" font-size="26" font-weight="bold">Add a raised coating</text><rect x="55" y="420" width="530" height="25" fill="#d2b66f" stroke="#806635" stroke-width="3"/><path d="M185 420q0-70 50-70t50 70z" fill="#9abbb8" stroke="#527c6d" stroke-width="3"/><text x="335" y="390" font-size="24">Coating over the face</text><text x="45" y="515" font-size="23">Simplified faces only; the full label must be specified.</text><text x="30" y="570" font-size="21">Conceptual sections; no thickness, scale or exact stack implied.</text></g></svg>