<svg xmlns="http://www.w3.org/2000/svg" width="660" height="550" viewBox="0 0 660 550"><title>Two phrases, different propositions</title><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#527c6d"/></marker></defs><rect width="660" height="550" fill="#edf4ef"/><g font-family="Arial, sans-serif" fill="#12304a"><text x="30" y="48" font-size="30" font-weight="bold">Two phrases, different propositions</text><text x="30" y="95" font-size="21">The design brief must preserve the meaning</text><path d="M170 325L230 375" stroke="#527c6d" stroke-width="4" marker-end="url(#arrow)"/><path d="M490 325L430 375" stroke="#527c6d" stroke-width="4" marker-end="url(#arrow)"/><rect x="30" y="145" width="280" height="180" rx="14" fill="white" stroke="#aac4b8" stroke-width="2"/><text x="48" y="182" font-size="26" font-weight="bold">Sugar-free</text><text x="48" y="220" font-size="24">Content criteria</text><text x="48" y="254" font-size="24">and other</text><text x="48" y="288" font-size="24">applicable conditions</text><rect x="350" y="145" width="280" height="180" rx="14" fill="white" stroke="#aac4b8" stroke-width="2"/><text x="368" y="182" font-size="26" font-weight="bold">No added sugar</text><text x="368" y="220" font-size="24">Addition, ingredient</text><text x="368" y="254" font-size="24">and processing</text><text x="368" y="288" font-size="24">conditions</text><rect x="30" y="385" width="600" height="115" rx="14" fill="white" stroke="#aac4b8" stroke-width="2"/><text x="48" y="422" font-size="26" font-weight="bold">Exact wording needs its own review</text><text x="48" y="460" font-size="24">Neither phrase is a shortcut for</text><text x="48" y="494" font-size="24">the other or for a calorie claim.</text></g></svg>