<svg xmlns="http://www.w3.org/2000/svg" width="640" height="1232" viewBox="0 0 640 1232" role="img" aria-labelledby="title desc"><title id="title">Illustrative runout: reserve stock once</title><desc id="desc">Assumes old revision use is expressly authorized. No setup/sample use included; not an actual customer balance.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10z" fill="#52798c"/></marker></defs><rect width="640" height="1232" fill="#f5f8fa"/><g font-family="Arial,Helvetica,sans-serif"><rect width="640" height="185" fill="#163d4b"/><text x="28" y="33" font-size="18" fill="#9ee2ce" font-weight="700"><tspan x="28" dy="0">ZFU LABELS / BUYER DECISION</tspan></text><text x="28" y="83" font-size="31" fill="#ffffff" font-weight="700"><tspan x="28" dy="0">Illustrative runout: reserve stock</tspan><tspan x="28" dy="38">once</tspan></text><rect x="40" y="210" width="560" height="127" rx="15" fill="#ffffff" stroke="#becfd8" stroke-width="2"/><text x="58" y="244" font-size="26" fill="#126d65" font-weight="700"><tspan x="58" dy="0">OPENING ELIGIBLE BALANCE</tspan></text><text x="58" y="285" font-size="25" fill="#243b53" font-weight="400"><tspan x="58" dy="0">1,200 usable old-revision pieces</tspan></text><path d="M320 339 L320 370" fill="none" stroke="#52798c" stroke-width="3" marker-end="url(#arrow)"/><rect x="40" y="381" width="560" height="127" rx="15" fill="#ffffff" stroke="#becfd8" stroke-width="2"/><text x="58" y="415" font-size="26" fill="#126d65" font-weight="700"><tspan x="58" dy="0">RESERVE A: 800</tspan></text><text x="58" y="456" font-size="25" fill="#243b53" font-weight="400"><tspan x="58" dy="0">1,200 − 800 = 400 still unreserved</tspan></text><path d="M320 510 L320 541" fill="none" stroke="#52798c" stroke-width="3" marker-end="url(#arrow)"/><rect x="40" y="552" width="560" height="127" rx="15" fill="#ffffff" stroke="#becfd8" stroke-width="2"/><text x="58" y="586" font-size="26" fill="#126d65" font-weight="700"><tspan x="58" dy="0">B NEEDS 700</tspan></text><text x="58" y="627" font-size="25" fill="#243b53" font-weight="400"><tspan x="58" dy="0">Reserve remaining 400 → 300 uncovered</tspan></text><rect x="40" y="723" width="560" height="191" rx="15" fill="#fff0eb" stroke="#becfd8" stroke-width="2"/><text x="58" y="757" font-size="26" fill="#126d65" font-weight="700"><tspan x="58" dy="0">DO NOT DEDUCT 1,200 TWICE</tspan></text><text x="58" y="798" font-size="25" fill="#243b53" font-weight="400"><tspan x="58" dy="0">Schedule changes require an updated</tspan><tspan x="58" dy="32">reservation and a valid use</tspan><tspan x="58" dy="32">authorization.</tspan></text><rect x="24" y="939" width="592" height="223" rx="15" fill="#f0f4f6" stroke="#becfd8" stroke-width="2"/><text x="42" y="973" font-size="26" fill="#126d65" font-weight="700"><tspan x="42" dy="0">SCOPE / OPEN CONDITION</tspan></text><text x="42" y="1014" font-size="25" fill="#243b53" font-weight="400"><tspan x="42" dy="0">Assumes old revision use is expressly</tspan><tspan x="42" dy="32">authorized. No setup/sample use</tspan><tspan x="42" dy="32">included; not an actual customer</tspan><tspan x="42" dy="32">balance.</tspan></text><text x="28" y="1209" font-size="18" fill="#526979" font-weight="400"><tspan x="28" dy="0">Editorial planning aid • use with the article worksheet</tspan></text></g></svg>