<svg xmlns="http://www.w3.org/2000/svg" width="500" height="1330" viewBox="0 0 500 1330" role="img" aria-labelledby="t d">
<title id="t">Compare label timing around in-pack HPP</title><desc id="d">Compare whether each route is available, what the labeled sample experiences, and what needs review before release.</desc>
<rect width="500" height="1330" fill="#f3f7f7"/><rect width="500" height="145" fill="#173d4a"/>
<g font-family="Arial" fill="#183f4d"><text x="24" y="36" fill="#a4e9d6" font-size="19">BUYER DECISION / JUICE</text><text x="24" y="78" fill="white" font-weight="bold" font-size="27">Compare two in-pack</text><text x="24" y="112" fill="white" font-weight="bold" font-size="27">HPP label routes</text>
<rect x="20" y="170" width="460" height="310" rx="12" fill="#e9f5f0" stroke="#a9cbd2" stroke-width="2"/><text x="40" y="209" font-size="23" font-weight="bold" fill="#087a78">A: LABEL BEFORE HPP</text><text x="40" y="252" font-size="22">Fill and close the bottle</text><text x="40" y="288" font-size="22">↓</text><text x="40" y="322" font-size="22">Apply the identified label</text><text x="40" y="358" font-size="22">↓</text><text x="40" y="392" font-size="22">Process the labeled pack</text><text x="40" y="440" font-size="21">Record what the label experienced.</text>
<rect x="20" y="505" width="460" height="310" rx="12" fill="#edf4fa" stroke="#a9cbd2" stroke-width="2"/><text x="40" y="544" font-size="23" font-weight="bold" fill="#087a78">B: LABEL AFTER HPP</text><text x="40" y="587" font-size="22">Fill and close the bottle</text><text x="40" y="623" font-size="22">↓</text><text x="40" y="657" font-size="22">Process the closed pack</text><text x="40" y="693" font-size="22">↓</text><text x="40" y="727" font-size="22">Review surface, then label</text><text x="40" y="775" font-size="21">Record surface and drying steps.</text>
<rect x="20" y="840" width="460" height="190" rx="12" fill="white" stroke="#a9cbd2" stroke-width="2"/><text x="40" y="880" font-size="23" font-weight="bold" fill="#087a78">BEFORE COMPARING</text><text x="40" y="922" font-size="21">Can the co-packer run each route?</text><text x="40" y="957" font-size="21">Record the package and differences.</text><text x="40" y="992" font-size="21">One route does not approve the other.</text>
<rect x="20" y="1055" width="460" height="190" rx="12" fill="#fff0eb" stroke="#a9cbd2" stroke-width="2"/><text x="40" y="1095" font-size="23" font-weight="bold" fill="#087a78">HOLD OPEN EXCEPTIONS</text><text x="40" y="1137" font-size="21">Unknown process or sample coverage?</text><text x="40" y="1172" font-size="21">Name the owner and missing evidence.</text><text x="40" y="1207" font-size="21">No process or performance approval.</text><text x="20" y="1298" font-size="17">Planning aid • confirm actual approved process</text></g></svg>
