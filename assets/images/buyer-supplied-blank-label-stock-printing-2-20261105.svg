<svg xmlns="http://www.w3.org/2000/svg" width="660" height="900" viewBox="0 0 660 900"><title>Compare two confirmed supply routes</title><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#527c6d"/></marker></defs><rect width="660" height="900" fill="#edf4ef"/><g font-family="Arial, sans-serif" fill="#12304a"><text x="30" y="48" font-size="30" font-weight="bold">Compare two confirmed supply routes</text><text x="30" y="95" font-size="21">Both can use an outside printer</text><path d="M170 355L230 410" stroke="#527c6d" stroke-width="4" marker-end="url(#arrow)"/><path d="M490 355L430 410" stroke="#527c6d" stroke-width="4" marker-end="url(#arrow)"/><path d="M330 565L330 625" stroke="#527c6d" stroke-width="4" marker-end="url(#arrow)"/><rect x="30" y="145" width="280" height="210" rx="14" fill="white" stroke="#aac4b8" stroke-width="2"/><text x="48" y="182" font-size="26" font-weight="bold">Buyer-stock route</text><text x="48" y="220" font-size="24">Exact accepted input</text><text x="48" y="254" font-size="24">and proposed work.</text><text x="48" y="288" font-size="24">Ownership, remnants</text><text x="48" y="322" font-size="24">and limits agreed.</text><rect x="350" y="145" width="280" height="210" rx="14" fill="white" stroke="#aac4b8" stroke-width="2"/><text x="368" y="182" font-size="26" font-weight="bold">Printer-stock route</text><text x="368" y="220" font-size="24">Exact construction</text><text x="368" y="254" font-size="24">and finished scope.</text><text x="368" y="288" font-size="24">Included operations</text><text x="368" y="322" font-size="24">and limits agreed.</text><rect x="30" y="420" width="600" height="145" rx="14" fill="white" stroke="#aac4b8" stroke-width="2"/><text x="48" y="457" font-size="26" font-weight="bold">Use the same finished-label requirement</text><text x="48" y="495" font-size="24">Quantity, print, conversion, package and delivery.</text><text x="48" y="529" font-size="24">Past material spending is not a new quote.</text><rect x="30" y="635" width="600" height="180" rx="14" fill="white" stroke="#aac4b8" stroke-width="2"/><text x="48" y="672" font-size="26" font-weight="bold">Resolve acceptance before stock dispatch</text><text x="48" y="710" font-size="24">A trial consumes only its agreed quantity.</text><text x="48" y="744" font-size="24">Printing acceptance and package-use evidence</text><text x="48" y="778" font-size="24">remain separate purchasing questions.</text></g></svg>