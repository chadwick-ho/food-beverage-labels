<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 1040"><title>Curved-package barcode decision checklist</title><rect width="760" height="1040" fill="#f2f7f4"/><g font-family="Arial" fill="#12304a"><text x="45" y="70" font-size="36" font-weight="bold">Plan the barcode together</text><text x="45" y="110" font-size="22">Editorial checklist · not a scanning test</text><rect x="45" y="145" width="670" height="165" rx="15" fill="#fff"/><text x="68" y="190" font-size="27" font-weight="bold">1 · Identify the symbol and use</text><text x="68" y="230" font-size="22">Confirm approved code and receiving channel.</text><text x="68" y="270" font-size="22">Ask which specification applies.</text><path d="M380 310v30" stroke="#568374" stroke-width="5"/><rect x="45" y="340" width="670" height="165" rx="15" fill="#fff"/><text x="68" y="385" font-size="27" font-weight="bold">2 · Review the finished package</text><text x="68" y="425" font-size="22">Measure the actual panel and curvature.</text><text x="68" y="465" font-size="22">Protect clear space and avoid seams.</text><path d="M380 505v30" stroke="#568374" stroke-width="5"/><rect x="45" y="535" width="670" height="165" rx="15" fill="#fff"/><text x="68" y="580" font-size="27" font-weight="bold">3 · Ask the printer</text><text x="68" y="620" font-size="22">Compare orientation with web direction.</text><text x="68" y="660" font-size="22">Keep symbol and roll direction distinct.</text><path d="M380 700v30" stroke="#568374" stroke-width="5"/><rect x="45" y="730" width="670" height="190" rx="15" fill="#fff"/><text x="68" y="775" font-size="27" font-weight="bold">4 · Agree acceptance</text><text x="68" y="815" font-size="22">Link the proof and verification to the revision.</text><text x="68" y="855" font-size="22">Review the assembled pack and actual workflow.</text><text x="68" y="895" font-size="22">Record unresolved questions before release.</text></g></svg>