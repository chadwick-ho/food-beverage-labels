<svg xmlns="http://www.w3.org/2000/svg" width="660" height="900" viewBox="0 0 660 900"><title>When the records disagree</title><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#527c6d"/></marker></defs><rect width="660" height="900" fill="#edf4ef"/><g font-family="Arial, sans-serif" fill="#12304a"><text x="30" y="48" font-size="30" font-weight="bold">When the records disagree</text><text x="30" y="95" font-size="21">Preserve sources before issuing a replacement</text><path d="M170 295L250 345" stroke="#527c6d" stroke-width="4" marker-end="url(#arrow)"/><path d="M490 295L410 345" stroke="#527c6d" stroke-width="4" marker-end="url(#arrow)"/><path d="M330 485L330 535" stroke="#527c6d" stroke-width="4" marker-end="url(#arrow)"/><path d="M330 675L330 725" stroke="#527c6d" stroke-width="4" marker-end="url(#arrow)"/><rect x="30" y="145" width="280" height="150" rx="14" fill="white" stroke="#aac4b8" stroke-width="2"/><text x="48" y="182" font-size="26" font-weight="bold">Master data</text><text x="48" y="220" font-size="24">Product + pack</text><text x="48" y="254" font-size="24">Complete ID</text><rect x="350" y="145" width="280" height="150" rx="14" fill="white" stroke="#aac4b8" stroke-width="2"/><text x="368" y="182" font-size="26" font-weight="bold">Production proof</text><text x="368" y="220" font-size="24">SKU + revision</text><text x="368" y="254" font-size="24">Encoded ID</text><rect x="30" y="355" width="600" height="130" rx="14" fill="white" stroke="#aac4b8" stroke-width="2"/><text x="48" y="392" font-size="26" font-weight="bold">Compare the assignment</text><text x="48" y="430" font-size="24">Match the exact item, not only the last digit.</text><rect x="30" y="545" width="600" height="130" rx="14" fill="white" stroke="#aac4b8" stroke-width="2"/><text x="48" y="582" font-size="26" font-weight="bold">Mismatch: return to data owner</text><text x="48" y="620" font-size="24">Do not make an invented arithmetic repair.</text><rect x="30" y="735" width="600" height="115" rx="14" fill="white" stroke="#aac4b8" stroke-width="2"/><text x="48" y="772" font-size="26" font-weight="bold">Resolved: replace and recheck</text><text x="48" y="810" font-size="24">Retain superseded and approved references.</text></g></svg>