<svg xmlns="http://www.w3.org/2000/svg" width="660" height="900" viewBox="0 0 660 900"><title>Separate contact and handling decisions</title><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#527c6d"/></marker></defs><rect width="660" height="900" fill="#edf4ef"/><g font-family="Arial, sans-serif" fill="#12304a"><text x="30" y="48" font-size="30" font-weight="bold">Separate contact and handling decisions</text><text x="30" y="95" font-size="21">Keep the same construction in every record</text><path d="M330 275L170 315" stroke="#527c6d" stroke-width="4" marker-end="url(#arrow)"/><path d="M330 275L490 315" stroke="#527c6d" stroke-width="4" marker-end="url(#arrow)"/><path d="M170 500L230 555" stroke="#527c6d" stroke-width="4" marker-end="url(#arrow)"/><path d="M490 500L430 555" stroke="#527c6d" stroke-width="4" marker-end="url(#arrow)"/><path d="M330 710L330 755" stroke="#527c6d" stroke-width="4" marker-end="url(#arrow)"/><rect x="30" y="145" width="600" height="130" rx="14" fill="white" stroke="#aac4b8" stroke-width="2"/><text x="48" y="182" font-size="26" font-weight="bold">Define the real contact arrangement</text><text x="48" y="220" font-size="24">Fruit skin, exposed food or packaging only?</text><rect x="30" y="325" width="280" height="175" rx="14" fill="white" stroke="#aac4b8" stroke-width="2"/><text x="48" y="362" font-size="26" font-weight="bold">Contact evidence</text><text x="48" y="400" font-size="24">Material identities</text><text x="48" y="434" font-size="24">and actual use</text><text x="48" y="468" font-size="24">for the reviewer.</text><rect x="350" y="325" width="280" height="175" rx="14" fill="white" stroke="#aac4b8" stroke-width="2"/><text x="368" y="362" font-size="26" font-weight="bold">Handling evidence</text><text x="368" y="400" font-size="24">Stay-on interval</text><text x="368" y="434" font-size="24">and intended</text><text x="368" y="468" font-size="24">removal sequence.</text><rect x="30" y="565" width="600" height="145" rx="14" fill="white" stroke="#aac4b8" stroke-width="2"/><text x="48" y="602" font-size="26" font-weight="bold">Confirm the printed produce identity</text><text x="48" y="640" font-size="24">Authorized data is another approval.</text><text x="48" y="674" font-size="24">Do not infer material status from a PLU.</text><rect x="30" y="765" width="600" height="90" rx="14" fill="white" stroke="#aac4b8" stroke-width="2"/><text x="48" y="802" font-size="26" font-weight="bold">Resolve open scope before ordering</text></g></svg>