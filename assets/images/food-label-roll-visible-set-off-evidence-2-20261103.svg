<svg xmlns="http://www.w3.org/2000/svg" width="660" height="900" viewBox="0 0 660 900"><title>From a visible mark to useful evidence</title><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#527c6d"/></marker></defs><rect width="660" height="900" fill="#edf4ef"/><g font-family="Arial, sans-serif" fill="#12304a"><text x="30" y="48" font-size="30" font-weight="bold">From a visible mark to useful evidence</text><text x="30" y="95" font-size="21">A clean appearance is not an analytical result</text><path d="M330 275L330 315" stroke="#527c6d" stroke-width="4" marker-end="url(#arrow)"/><path d="M330 455L170 495" stroke="#527c6d" stroke-width="4" marker-end="url(#arrow)"/><path d="M330 455L490 495" stroke="#527c6d" stroke-width="4" marker-end="url(#arrow)"/><path d="M170 685L230 740" stroke="#527c6d" stroke-width="4" marker-end="url(#arrow)"/><path d="M490 685L430 740" stroke="#527c6d" stroke-width="4" marker-end="url(#arrow)"/><rect x="30" y="145" width="600" height="130" rx="14" fill="white" stroke="#aac4b8" stroke-width="2"/><text x="48" y="182" font-size="26" font-weight="bold">Identify the side and pattern</text><text x="48" y="220" font-size="24">Preserve the roll/stack and affected position.</text><rect x="30" y="325" width="600" height="130" rx="14" fill="white" stroke="#aac4b8" stroke-width="2"/><text x="48" y="362" font-size="26" font-weight="bold">Map the contacting surfaces</text><text x="48" y="400" font-size="24">Retain relevant neighboring layers.</text><rect x="30" y="505" width="280" height="180" rx="14" fill="white" stroke="#aac4b8" stroke-width="2"/><text x="48" y="542" font-size="26" font-weight="bold">Quality review</text><text x="48" y="580" font-size="24">Converter examines</text><text x="48" y="614" font-size="24">visible transfer</text><text x="48" y="648" font-size="24">and its cause.</text><rect x="350" y="505" width="280" height="180" rx="14" fill="white" stroke="#aac4b8" stroke-width="2"/><text x="368" y="542" font-size="26" font-weight="bold">Use assessment</text><text x="368" y="580" font-size="24">Responsible expert</text><text x="368" y="614" font-size="24">reviews actual</text><text x="368" y="648" font-size="24">food-contact scope.</text><rect x="30" y="750" width="600" height="100" rx="14" fill="white" stroke="#aac4b8" stroke-width="2"/><text x="48" y="787" font-size="26" font-weight="bold">Record findings and stock decision separately</text></g></svg>