<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 1040"><title>2D barcode background decision checklist</title><rect width="760" height="1040" fill="#f2f7f4"/><g font-family="Arial" fill="#12304a"><text x="45" y="70" font-size="36" font-weight="bold">Review the finished pack</text><text x="45" y="110" font-size="22">Editorial checklist · not verification</text><rect x="45" y="145" width="670" height="165" rx="15" fill="#fff"/><text x="68" y="190" font-size="27" font-weight="bold">1 · Define the code and use</text><text x="68" y="230" font-size="22">Approved symbol, data and receiving channel.</text><text x="68" y="270" font-size="22">Confirm the applicable requirements.</text><path d="M380 310v30" stroke="#568374" stroke-width="5"/><rect x="45" y="340" width="670" height="165" rx="15" fill="#fff"/><text x="68" y="385" font-size="27" font-weight="bold">2 · Identify what is behind it</text><text x="68" y="425" font-size="22">Clear film, contents, ink and background.</text><text x="68" y="465" font-size="22">Preserve the full quiet zone.</text><path d="M380 505v30" stroke="#568374" stroke-width="5"/><rect x="45" y="535" width="670" height="165" rx="15" fill="#fff"/><text x="68" y="580" font-size="27" font-weight="bold">3 · Review reflection</text><text x="68" y="620" font-size="22">Compare finish and package conditions.</text><text x="68" y="660" font-size="22">Ask the printer for a representative sample.</text><path d="M380 700v30" stroke="#568374" stroke-width="5"/><rect x="45" y="730" width="670" height="190" rx="15" fill="#fff"/><text x="68" y="775" font-size="27" font-weight="bold">4 · Agree evidence</text><text x="68" y="815" font-size="22">Link file, print and final-pack checks.</text><text x="68" y="855" font-size="22">Verify against the applicable specification.</text><text x="68" y="895" font-size="22">Record limitations before release.</text></g></svg>