<svg xmlns="http://www.w3.org/2000/svg" width="760" height="600" viewBox="0 0 760 600"><title>Alternating front back labels versus separate reels</title><rect width="760" height="600" fill="#eff5f1"/><g font-family="Arial" fill="#12304a"><text x="35" y="55" font-size="30" font-weight="bold">Components do not define the supplied sequence</text><text x="45" y="135" font-size="27" font-weight="bold">One alternating web</text><rect x="45" y="165" width="660" height="100" fill="#c4dbd0"/><g font-size="26"><rect x="65" y="180" width="125" height="70" fill="white"/><text x="85" y="225">Front</text><rect x="225" y="180" width="125" height="70" fill="#e9d7ae"/><text x="250" y="225">Back</text><rect x="385" y="180" width="125" height="70" fill="white"/><text x="405" y="225">Front</text><rect x="545" y="180" width="125" height="70" fill="#e9d7ae"/><text x="570" y="225">Back</text></g><text x="45" y="335" font-size="27" font-weight="bold">Separate component supplies</text><rect x="45" y="365" width="310" height="90" fill="#c4dbd0"/><text x="80" y="420" font-size="25">Front → front → front</text><rect x="395" y="365" width="310" height="90" fill="#e9d7ae"/><text x="430" y="420" font-size="25">Back → back → back</text><text x="35" y="525" font-size="23">The equipment owner confirms the actual supported layout.</text><text x="35" y="570" font-size="21">Sequence concepts only · label sizes and gaps are not specified</text></g></svg>