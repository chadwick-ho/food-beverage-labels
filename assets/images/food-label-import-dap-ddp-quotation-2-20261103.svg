<svg xmlns="http://www.w3.org/2000/svg" width="660" height="900" viewBox="0 0 660 900"><title>Ask what the delivered offer includes</title><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#527c6d"/></marker></defs><rect width="660" height="900" fill="#edf4ef"/><g font-family="Arial, sans-serif" fill="#12304a"><text x="30" y="48" font-size="30" font-weight="bold">Ask what the delivered offer includes</text><text x="30" y="95" font-size="21">A procurement comparison, not a tariff calculation</text><path d="M170 335L230 395" stroke="#527c6d" stroke-width="4" marker-end="url(#arrow)"/><path d="M490 335L430 395" stroke="#527c6d" stroke-width="4" marker-end="url(#arrow)"/><path d="M330 535L330 595" stroke="#527c6d" stroke-width="4" marker-end="url(#arrow)"/><rect x="30" y="145" width="280" height="190" rx="14" fill="white" stroke="#aac4b8" stroke-width="2"/><text x="48" y="182" font-size="26" font-weight="bold">DAP review</text><text x="48" y="220" font-size="24">Buyer import</text><text x="48" y="254" font-size="24">clearance/duties</text><text x="48" y="288" font-size="24">under the rule.</text><text x="48" y="322" font-size="24">Confirm actual terms.</text><rect x="350" y="145" width="280" height="190" rx="14" fill="white" stroke="#aac4b8" stroke-width="2"/><text x="368" y="182" font-size="26" font-weight="bold">DDP review</text><text x="368" y="220" font-size="24">Seller import</text><text x="368" y="254" font-size="24">obligations</text><text x="368" y="288" font-size="24">under the rule.</text><text x="368" y="322" font-size="24">Confirm feasibility.</text><rect x="30" y="405" width="600" height="130" rx="14" fill="white" stroke="#aac4b8" stroke-width="2"/><text x="48" y="442" font-size="26" font-weight="bold">Both offers need a named place</text><text x="48" y="480" font-size="24">Record the edition and actual destination.</text><text x="48" y="514" font-size="24">Review exclusions and local constraints.</text><rect x="30" y="605" width="600" height="180" rx="14" fill="white" stroke="#aac4b8" stroke-width="2"/><text x="48" y="642" font-size="26" font-weight="bold">Compare only a confirmed scope</text><text x="48" y="680" font-size="24">Goods, freight and applicable obligations.</text><text x="48" y="714" font-size="24">Do not invent tax rates or call blanks zero.</text><text x="48" y="748" font-size="24">Receiving is separate from production release.</text></g></svg>