<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 1040"><title>Film-label dispensing investigation checklist</title><rect width="760" height="1040" fill="#f2f7f4"/><g font-family="Arial" fill="#12304a"><text x="45" y="70" font-size="36" font-weight="bold">Investigate the handoff</text><text x="45" y="110" font-size="22">Editorial checklist · follow equipment safety rules</text><rect x="45" y="145" width="670" height="165" rx="15" fill="#fff"/><text x="68" y="190" font-size="27" font-weight="bold">1 · Locate the symptom</text><text x="68" y="230" font-size="22">Separate peeling, sensing and placement.</text><text x="68" y="270" font-size="22">Retain samples and machine observations.</text><path d="M380 310v30" stroke="#568374" stroke-width="5"/><rect x="45" y="340" width="670" height="165" rx="15" fill="#fff"/><text x="68" y="385" font-size="27" font-weight="bold">2 · Record the conditions</text><text x="68" y="425" font-size="22">Material, liner, storage and environment.</text><text x="68" y="465" font-size="22">Identify what changed and what is unknown.</text><path d="M380 505v30" stroke="#568374" stroke-width="5"/><rect x="45" y="535" width="670" height="165" rx="15" fill="#fff"/><text x="68" y="580" font-size="27" font-weight="bold">3 · Compare safely</text><text x="68" y="620" font-size="22">Use approved line procedures and controls.</text><text x="68" y="660" font-size="22">Do not change several inputs at once.</text><path d="M380 700v30" stroke="#568374" stroke-width="5"/><rect x="45" y="730" width="670" height="190" rx="15" fill="#fff"/><text x="68" y="775" font-size="27" font-weight="bold">4 · Agree next action</text><text x="68" y="815" font-size="22">Review evidence with equipment and label owners.</text><text x="68" y="855" font-size="22">Trial the complete approved construction.</text><text x="68" y="895" font-size="22">Document limits and unresolved causes.</text></g></svg>