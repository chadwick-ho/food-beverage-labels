<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 940"><title>Thickness quotation comparison checklist</title><rect width="640" height="940" fill="#f2f7f4"/><g font-family="Arial" fill="#12304a"><text x="35" y="65" font-size="31" font-weight="bold">Compare the same boundary</text><text x="35" y="105" font-size="21">Editorial worksheet · no product specification</text><rect x="30" y="145" width="580" height="150" rx="15" fill="white"/><text x="50" y="187" font-size="26" font-weight="bold">1 · Identify the material</text><text x="50" y="230" font-size="23">Product code, construction and revision.</text><text x="50" y="266" font-size="23">Link the quoted stock to its data.</text><rect x="30" y="330" width="580" height="150" rx="15" fill="white"/><text x="50" y="372" font-size="26" font-weight="bold">2 · Name the included layers</text><text x="50" y="415" font-size="23">Face only, with liner, or finished label?</text><text x="50" y="451" font-size="23">Ask what each total actually includes.</text><rect x="30" y="515" width="580" height="150" rx="15" fill="white"/><text x="50" y="557" font-size="26" font-weight="bold">3 · Retain the measurement basis</text><text x="50" y="600" font-size="23">Units, nominal value and tolerance.</text><text x="50" y="636" font-size="23">Calculated and measured are distinct.</text><rect x="30" y="700" width="580" height="180" rx="15" fill="white"/><text x="50" y="742" font-size="26" font-weight="bold">4 · Check the intended use</text><text x="50" y="785" font-size="23">Finished roll, dispenser and package.</text><text x="50" y="821" font-size="23">Confirm changes with the relevant owner.</text><text x="50" y="857" font-size="23">Thickness alone does not prove fit.</text></g></svg>