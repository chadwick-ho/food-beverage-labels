<svg xmlns="http://www.w3.org/2000/svg" width="660" height="600" viewBox="0 0 660 600"><title>Ask who supplies each operation</title><rect width="660" height="600" fill="#edf4ef"/><g font-family="Arial" fill="#12304a"><text x="28" y="48" font-size="28" font-weight="bold">Ask who supplies each operation</text><path d="M45 165h560M45 330h560" stroke="#527c6d" stroke-width="4"/><text x="40" y="120" font-size="27" font-weight="bold">Reel-fed hotmelt example</text><text x="45" y="210" font-size="25">Printed web → line cut → line glue</text><text x="40" y="290" font-size="27" font-weight="bold">Pressure-sensitive route</text><text x="45" y="375" font-size="25">Cut adhesive labels → liner release</text><rect x="35" y="425" width="590" height="95" fill="white" rx="12"/><text x="55" y="465" font-size="24">Name the fitted station and supported format.</text><text x="55" y="500" font-size="24">Similar artwork does not make webs interchangeable.</text><text x="28" y="568" font-size="21">Process distinction only; not a machine setup instruction.</text></g></svg>