<svg xmlns="http://www.w3.org/2000/svg" width="640" height="1270" viewBox="0 0 640 1270" role="img" aria-labelledby="title desc"><title id="title">A source change has several approval states</title><desc id="desc">S1/S2 and languages A/B are hypothetical workflow identifiers, not translated or approved product wording.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10z" fill="#52798c"/></marker></defs><rect width="640" height="1270" fill="#f5f8fa"/><g font-family="Arial,Helvetica,sans-serif"><rect width="640" height="185" fill="#163d4b"/><text x="28" y="33" font-size="18" fill="#9ee2ce" font-weight="700"><tspan x="28" dy="0">ZFU LABELS / BUYER DECISION</tspan></text><text x="28" y="83" font-size="31" fill="#ffffff" font-weight="700"><tspan x="28" dy="0">A source change has several</tspan><tspan x="28" dy="38">approval states</tspan></text><rect x="40" y="210" width="560" height="159" rx="15" fill="#e7f2f7" stroke="#becfd8" stroke-width="2"/><text x="58" y="244" font-size="26" fill="#126d65" font-weight="700"><tspan x="58" dy="0">SOURCE BLOCK S2 CHANGES</tspan></text><text x="58" y="285" font-size="25" fill="#243b53" font-weight="400"><tspan x="58" dy="0">Trace actual dependencies before</tspan><tspan x="58" dy="32">carrying approval forward.</tspan></text><rect x="24" y="404" width="282" height="180" rx="15" fill="#ffffff" stroke="#becfd8" stroke-width="2"/><text x="42" y="438" font-size="24" fill="#126d65" font-weight="700"><tspan x="42" dy="0">A / BACK</tspan></text><text x="42" y="477" font-size="22" fill="#243b53" font-weight="400"><tspan x="42" dy="0">Translation review →</tspan><tspan x="42" dy="29">new export</tspan><tspan x="42" dy="29">comparison</tspan></text><rect x="334" y="404" width="282" height="180" rx="15" fill="#ffffff" stroke="#becfd8" stroke-width="2"/><text x="352" y="438" font-size="24" fill="#126d65" font-weight="700"><tspan x="352" dy="0">B / BACK</tspan></text><text x="352" y="477" font-size="22" fill="#243b53" font-weight="400"><tspan x="352" dy="0">Independent review →</tspan><tspan x="352" dy="29">own export</tspan><tspan x="352" dy="29">comparison</tspan></text><rect x="40" y="609" width="560" height="159" rx="15" fill="#e9f7ee" stroke="#becfd8" stroke-width="2"/><text x="58" y="643" font-size="26" fill="#126d65" font-weight="700"><tspan x="58" dy="0">FRONT USES S1 ONLY?</tspan></text><text x="58" y="684" font-size="25" fill="#243b53" font-weight="400"><tspan x="58" dy="0">Retain unaffected scope only after</tspan><tspan x="58" dy="32">checking the dependency and output.</tspan></text><rect x="40" y="793" width="560" height="191" rx="15" fill="#fff0eb" stroke="#becfd8" stroke-width="2"/><text x="58" y="827" font-size="26" fill="#126d65" font-weight="700"><tspan x="58" dy="0">UNKNOWN CELL ≠ UNAFFECTED</tspan></text><text x="58" y="868" font-size="25" fill="#243b53" font-weight="400"><tspan x="58" dy="0">Keep mapping pending. Meaning approval</tspan><tspan x="58" dy="32">and correct export are separate</tspan><tspan x="58" dy="32">states.</tspan></text><rect x="24" y="1009" width="592" height="191" rx="15" fill="#f0f4f6" stroke="#becfd8" stroke-width="2"/><text x="42" y="1043" font-size="26" fill="#126d65" font-weight="700"><tspan x="42" dy="0">SCOPE / OPEN CONDITION</tspan></text><text x="42" y="1084" font-size="25" fill="#243b53" font-weight="400"><tspan x="42" dy="0">S1/S2 and languages A/B are hypothetical</tspan><tspan x="42" dy="32">workflow identifiers, not translated or</tspan><tspan x="42" dy="32">approved product wording.</tspan></text><text x="28" y="1247" font-size="18" fill="#526979" font-weight="400"><tspan x="28" dy="0">Editorial planning aid • use with the article worksheet</tspan></text></g></svg>