<svg xmlns="http://www.w3.org/2000/svg" width="660" height="600" viewBox="0 0 660 600"><title>Three drawings answer different questions</title><rect width="660" height="600" fill="#edf4ef"/><g font-family="Arial" fill="#12304a"><text x="30" y="48" font-size="29" font-weight="bold">Three drawings answer different questions</text><rect x="35" y="110" width="590" height="110" rx="12" fill="white"/><text x="60" y="155" font-size="27" font-weight="bold">Artwork</text><text x="60" y="195" font-size="24">What is printed and where it can be read.</text><rect x="35" y="270" width="590" height="110" rx="12" fill="white"/><text x="60" y="315" font-size="27" font-weight="bold">Physical cut and opening</text><text x="60" y="355" font-size="24">Which parts move, remain or separate.</text><rect x="35" y="430" width="590" height="90" rx="12" fill="white"/><text x="60" y="485" font-size="25">Adhesive map: actual behaviour by named region.</text><text x="30" y="570" font-size="21">An unprinted area is not automatically a non-tacky area.</text></g></svg>