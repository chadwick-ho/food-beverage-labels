<svg xmlns="http://www.w3.org/2000/svg" width="660" height="600" viewBox="0 0 660 600"><title>Printing and cutting need matching inputs</title><rect width="660" height="600" fill="#edf4ef"/><g font-family="Arial" fill="#12304a"><text x="30" y="48" font-size="29" font-weight="bold">Printing and cutting need matching inputs</text><rect x="35" y="110" width="590" height="110" rx="12" fill="white"/><text x="60" y="155" font-size="27" font-weight="bold">Installed option</text><text x="60" y="195" font-size="24">Actual printer configuration and applicable manual.</text><rect x="35" y="270" width="590" height="110" rx="12" fill="white"/><text x="60" y="315" font-size="27" font-weight="bold">Supplied web</text><text x="60" y="355" font-size="24">Layer identities, repeat and separation boundary.</text><rect x="35" y="430" width="590" height="90" rx="12" fill="white"/><text x="60" y="485" font-size="25">Then evaluate the required separated output.</text><text x="30" y="570" font-size="21">No blade access, machine adjustment or media approval shown.</text></g></svg>