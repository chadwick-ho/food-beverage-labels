<svg xmlns="http://www.w3.org/2000/svg" width="500" height="1200" viewBox="0 0 500 1200" role="img" aria-labelledby="t d"><title id="t">Illustrative can-decoration cost crossover</title><desc id="d">Compare two hypothetical formulas at ten thousand and forty thousand units, then review excluded costs and inventory.</desc><rect width="500" height="1200" fill="#f3f7f7"/><rect width="500" height="145" fill="#173d4a"/><g font-family="Arial" fill="#183f4d"><text x="24" y="38" fill="#a4e9d6" font-size="19">BUYER DECISION / CANS</text><text x="24" y="79" fill="white" font-size="27" font-weight="bold">When does a setup charge</text><text x="24" y="114" fill="white" font-size="27" font-weight="bold">change the comparison?</text>
<rect x="20" y="170" width="460" height="180" rx="12" fill="white" stroke="#a9cbd2" stroke-width="2"/><text x="40" y="209" font-size="23" font-weight="bold" fill="#087a78">ILLUSTRATIVE INPUTS</text><text x="40" y="253" font-size="21">Plain can + label + application: $0.19</text><text x="40" y="287" font-size="21">Decorated can: $0.18 + $400 setup</text><text x="40" y="321" font-size="21">Amounts are examples, not quotes.</text>
<rect x="20" y="375" width="460" height="200" rx="12" fill="#e9f5f0" stroke="#a9cbd2" stroke-width="2"/><text x="40" y="414" font-size="23" font-weight="bold" fill="#087a78">10,000 SALEABLE CANS</text><text x="40" y="458" font-size="21">Label route: 10,000 × $0.19 = $1,900</text><text x="40" y="492" font-size="21">Decorated: 10,000 × $0.18 + $400</text><text x="40" y="526" font-size="21">= $2,200 for this simplified example</text>
<rect x="20" y="600" width="460" height="200" rx="12" fill="#edf4fa" stroke="#a9cbd2" stroke-width="2"/><text x="40" y="639" font-size="23" font-weight="bold" fill="#087a78">40,000 SALEABLE CANS</text><text x="40" y="683" font-size="21">Label route: $7,600</text><text x="40" y="717" font-size="21">Decorated: $7,200 + $400 = $7,600</text><text x="40" y="751" font-size="21">Arithmetic tie under these assumptions</text>
<rect x="20" y="825" width="460" height="260" rx="12" fill="#fff0eb" stroke="#a9cbd2" stroke-width="2"/><text x="40" y="864" font-size="23" font-weight="bold" fill="#087a78">BEFORE BUYING</text><text x="40" y="908" font-size="21">Add actual freight, waste and storage.</text><text x="40" y="942" font-size="21">Check setup coverage and price breaks.</text><text x="40" y="976" font-size="21">Compare usable demand and inventory.</text><text x="40" y="1010" font-size="21">An arithmetic tie does not approve</text><text x="40" y="1044" font-size="21">the package or the supplier's terms.</text><text x="20" y="1158" font-size="17">Illustration only • use complete real offers</text></g></svg>
