<svg xmlns="http://www.w3.org/2000/svg" width="660" height="600" viewBox="0 0 660 600"><title>One layout, two different area totals</title><rect width="660" height="600" fill="#edf4ef"/><g font-family="Arial" fill="#12304a"><text x="30" y="48" font-size="29" font-weight="bold">One layout, two different area totals</text><rect x="30" y="105" width="600" height="155" rx="12" fill="white"/><text x="55" y="150" font-size="27" font-weight="bold">20.00 m² — rectangular cut faces</text><text x="55" y="200" font-size="24">10,000 × 0.050 m × 0.040 m</text><rect x="30" y="300" width="600" height="155" rx="12" fill="white"/><text x="55" y="345" font-size="27" font-weight="bold">22.26 m² — repeated web</text><text x="55" y="395" font-size="24">(10,000 ÷ 2 × 0.042 m) × 0.106 m</text><text x="45" y="510" font-size="24">Neither total defines the supplier’s billing rule.</text><text x="30" y="570" font-size="21">Invented arithmetic example; no price, waste or yield claimed.</text></g></svg>