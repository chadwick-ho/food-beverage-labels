<svg xmlns="http://www.w3.org/2000/svg" width="500" height="990" viewBox="0 0 500 990" role="img" aria-labelledby="t d"><title id="t">Review a barcode correction patch at its placement limits</title><desc id="d">A conceptual old-code area and patch footprints at two positions show why a centered sample alone cannot establish the full placement range.</desc><rect width="500" height="990" fill="#f3f7f7"/><rect width="500" height="145" fill="#173d4a"/><g font-family="Arial" fill="#183f4d"><text x="24" y="38" fill="#a4e9d6" font-size="19">BUYER DECISION / CORRECTION</text><text x="24" y="79" fill="white" font-size="27" font-weight="bold">Check both limits of</text><text x="24" y="114" fill="white" font-size="27" font-weight="bold">the patch position</text>
<rect x="20" y="170" width="460" height="370" rx="12" fill="white" stroke="#a9cbd2" stroke-width="2"/><text x="40" y="210" font-size="23" font-weight="bold" fill="#087a78">ILLUSTRATIVE PLAN VIEW</text><rect x="115" y="292" width="270" height="145" fill="#ffe7e0" stroke="#b64b32" stroke-width="3"/><text x="155" y="372" font-size="22" fill="#a24229">Old code area</text><rect x="80" y="265" width="310" height="200" fill="none" stroke="#158379" stroke-width="4" stroke-dasharray="9 5"/><rect x="110" y="250" width="310" height="200" fill="none" stroke="#526eae" stroke-width="4" stroke-dasharray="4 5"/><text x="40" y="500" font-size="19">Dashed outlines: two possible patch positions.</text>
<rect x="20" y="565" width="460" height="220" rx="12" fill="#e9f5f0" stroke="#a9cbd2" stroke-width="2"/><text x="40" y="605" font-size="23" font-weight="bold" fill="#087a78">REVIEW THE REAL LIMITS</text><text x="40" y="649" font-size="21">Old code hidden at each position?</text><text x="40" y="683" font-size="21">New code and surrounding area clear?</text><text x="40" y="717" font-size="21">Any other required field obstructed?</text><text x="40" y="751" font-size="21">Use agreed variation, not this sketch.</text>
<text x="20" y="850" font-size="21" fill="#a24229">Geometry does not establish opacity,</text><text x="20" y="884" font-size="21" fill="#a24229">adhesion or barcode verification.</text><text x="20" y="954" font-size="17">Illustration only • not a tolerance or actual test</text></g></svg>
