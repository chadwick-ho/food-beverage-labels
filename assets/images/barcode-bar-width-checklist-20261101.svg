<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 1040"><title>Barcode print adjustment review checklist</title><rect width="760" height="1040" fill="#f2f7f4"/><g font-family="Arial" fill="#12304a"><text x="45" y="70" font-size="36" font-weight="bold">Review the barcode output</text><text x="45" y="110" font-size="22">Editorial checklist · not an adjustment recipe</text><rect x="45" y="145" width="670" height="165" rx="15" fill="#fff"/><text x="68" y="190" font-size="27" font-weight="bold">1 · Identify the symbol</text><text x="68" y="230" font-size="22">Approved data, size, use and artwork revision.</text><text x="68" y="270" font-size="22">Confirm receiving requirements.</text><path d="M380 310v30" stroke="#568374" stroke-width="5"/><rect x="45" y="340" width="670" height="165" rx="15" fill="#fff"/><text x="68" y="385" font-size="27" font-weight="bold">2 · Identify the process</text><text x="68" y="425" font-size="22">Press, ink, substrate and intended finish.</text><text x="68" y="465" font-size="22">Ask what print evidence is available.</text><path d="M380 505v30" stroke="#568374" stroke-width="5"/><rect x="45" y="535" width="670" height="165" rx="15" fill="#fff"/><text x="68" y="580" font-size="27" font-weight="bold">3 · Assign file authority</text><text x="68" y="620" font-size="22">Who originates and adjusts the master?</text><text x="68" y="660" font-size="22">Prevent a second untracked adjustment.</text><path d="M380 700v30" stroke="#568374" stroke-width="5"/><rect x="45" y="730" width="670" height="190" rx="15" fill="#fff"/><text x="68" y="775" font-size="27" font-weight="bold">4 · Agree acceptance</text><text x="68" y="815" font-size="22">Link proofs and reports to actual output.</text><text x="68" y="855" font-size="22">Record method, sample and criteria.</text><text x="68" y="895" font-size="22">Escalate process or material changes.</text></g></svg>