<svg xmlns="http://www.w3.org/2000/svg" width="640" height="1120" viewBox="0 0 640 1120" role="img" aria-label="Two different winding questions"><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8Z" fill="#486e80"/></marker></defs><g font-family="Arial, sans-serif"><rect x="0" y="0" width="640" height="1120" rx="0" fill="#f2f7fa" stroke="#a5becb" stroke-width="2"/><rect x="0" y="0" width="640" height="190" rx="0" fill="#173e4b" stroke="#173e4b" stroke-width="2"/><text x="30" y="35" fill="#a4e1d0" font-size="18" font-weight="700"><tspan x="30" dy="0">ZFU LABELS / PURCHASING DIAGRAM</tspan></text><text x="30" y="88" fill="#fff" font-size="32" font-weight="700"><tspan x="30" dy="0">Two different winding questions</tspan></text><text x="34" y="237" fill="#213b4c" font-size="28" font-weight="700"><tspan x="34" dy="0">RIBBON SUPPLY</tspan></text><rect x="34" y="265" width="572" height="205" rx="14" fill="#fff" stroke="#a5becb" stroke-width="2"/><text x="54" y="306" fill="#213b4c" font-size="27" font-weight="700"><tspan x="54" dy="0">Coated side: inside OR outside</tspan></text><text x="54" y="357" fill="#213b4c" font-size="26" font-weight="400"><tspan x="54" dy="0">Must match the actual printer</tspan><tspan x="54" dy="34">configuration.</tspan></text><text x="54" y="435" fill="#213b4c" font-size="24" font-weight="400"><tspan x="54" dy="0">Obtain the exact item specification.</tspan></text><text x="34" y="533" fill="#213b4c" font-size="28" font-weight="700"><tspan x="34" dy="0">LABEL ROLL</tspan></text><rect x="34" y="563" width="572" height="176" rx="14" fill="#e0f1ea" stroke="#a5becb" stroke-width="2"/><text x="54" y="606" fill="#213b4c" font-size="28" font-weight="700"><tspan x="54" dy="0">Print-in OR print-out</tspan></text><text x="54" y="656" fill="#213b4c" font-size="26" font-weight="400"><tspan x="54" dy="0">A separate delivered-label unwind</tspan><tspan x="54" dy="34">question.</tspan></text><rect x="34" y="788" width="572" height="202" rx="14" fill="#fff1de" stroke="#a5becb" stroke-width="2"/><text x="54" y="830" fill="#213b4c" font-size="27" font-weight="700"><tspan x="54" dy="0">Do not copy one field into the other</tspan></text><text x="54" y="912" fill="#213b4c" font-size="25" font-weight="400"><tspan x="54" dy="0">Also confirm ribbon dimensions,</tspan><tspan x="54" dy="33">chemistry and final-label evidence.</tspan></text><text x="30" y="1095" fill="#4b6473" font-size="18" font-weight="400"><tspan x="30" dy="0">Planning example / no customer result or acceptance limit</tspan></text></g></svg>