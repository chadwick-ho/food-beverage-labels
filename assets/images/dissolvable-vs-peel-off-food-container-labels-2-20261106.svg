<svg xmlns="http://www.w3.org/2000/svg" width="660" height="600" viewBox="0 0 660 600"><title>Keep the before-and-after duties distinct</title><rect width="660" height="600" fill="#edf4ef"/><g font-family="Arial" fill="#12304a"><text x="30" y="48" font-size="29" font-weight="bold">Keep the before-and-after duties distinct</text><rect x="35" y="110" width="590" height="150" rx="12" fill="white"/><text x="60" y="155" font-size="27" font-weight="bold">Before intended removal</text><text x="60" y="205" font-size="24">Actual identification, contact and holding conditions.</text><rect x="35" y="315" width="590" height="150" rx="12" fill="white"/><text x="60" y="360" font-size="27" font-weight="bold">During the actual approved route</text><text x="60" y="410" font-size="24">Observe face, mark, adhesive and container surface.</text><text x="45" y="520" font-size="23">Label removal does not authorise hygienic reuse.</text><text x="30" y="570" font-size="21">No wash recipe, health benefit or product approval implied.</text></g></svg>