<svg xmlns="http://www.w3.org/2000/svg" width="640" height="1402" viewBox="0 0 640 1402" role="img" aria-labelledby="title desc"><title id="title">Connect a barcode report to the delivered lot</title><desc id="desc">Article-specific editorial purchasing aid. Follow the decision and preserve unresolved conditions with the responsible reviewer.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10z" fill="#517b89"/></marker></defs><rect width="640" height="1402" fill="#f4f8fa"/><g font-family="Arial,Helvetica,sans-serif"><rect width="640" height="168" fill="#163d4b"/><text x="28" y="30" fill="#9ee2ce" font-size="19" font-weight="700"><tspan x="28" dy="0">ZFU LABELS · BUYER DECISION</tspan></text><text x="28" y="76" fill="#ffffff" font-size="32" font-weight="700"><tspan x="28" dy="0">Connect a barcode report to the</tspan><tspan x="28" dy="39">delivered lot</tspan></text><rect x="44" y="198" width="552" height="145" rx="17" fill="#ffffff" stroke="#d5e2e9" stroke-width="2"/><text x="68" y="237" fill="#137f75" font-size="26" font-weight="700"><tspan x="68" dy="0">01  APPROVED DATA</tspan></text><text x="68" y="277" fill="#243b53" font-size="25" font-weight="400"><tspan x="68" dy="0">Authorized SKU and decoded</tspan><tspan x="68" dy="33">content</tspan></text><path d="M320 343 V375" stroke="#517b89" stroke-width="3" fill="none" marker-end="url(#arrow)"/><rect x="44" y="382" width="552" height="145" rx="17" fill="#ffffff" stroke="#d5e2e9" stroke-width="2"/><text x="68" y="421" fill="#137f75" font-size="26" font-weight="700"><tspan x="68" dy="0">02  ARTWORK REVISION</tspan></text><text x="68" y="461" fill="#243b53" font-size="25" font-weight="400"><tspan x="68" dy="0">Exact component and production</tspan><tspan x="68" dy="33">file</tspan></text><path d="M320 527 V559" stroke="#517b89" stroke-width="3" fill="none" marker-end="url(#arrow)"/><rect x="44" y="566" width="552" height="145" rx="17" fill="#ffffff" stroke="#d5e2e9" stroke-width="2"/><text x="68" y="605" fill="#137f75" font-size="26" font-weight="700"><tspan x="68" dy="0">03  REPORTED SAMPLE</tspan></text><text x="68" y="645" fill="#243b53" font-size="25" font-weight="400"><tspan x="68" dy="0">Identified construction and</tspan><tspan x="68" dy="33">sample</tspan></text><path d="M320 711 V743" stroke="#517b89" stroke-width="3" fill="none" marker-end="url(#arrow)"/><rect x="44" y="750" width="552" height="145" rx="17" fill="#ffffff" stroke="#d5e2e9" stroke-width="2"/><text x="68" y="789" fill="#137f75" font-size="26" font-weight="700"><tspan x="68" dy="0">04  REPORT SCOPE</tspan></text><text x="68" y="829" fill="#243b53" font-size="25" font-weight="400"><tspan x="68" dy="0">Method, criteria and actual</tspan><tspan x="68" dy="33">coverage</tspan></text><path d="M320 895 V927" stroke="#517b89" stroke-width="3" fill="none" marker-end="url(#arrow)"/><rect x="44" y="934" width="552" height="145" rx="17" fill="#ffffff" stroke="#d5e2e9" stroke-width="2"/><text x="68" y="973" fill="#137f75" font-size="26" font-weight="700"><tspan x="68" dy="0">05  DELIVERED LOT</tspan></text><text x="68" y="1013" fill="#243b53" font-size="25" font-weight="400"><tspan x="68" dy="0">Order, roll references and</tspan><tspan x="68" dy="33">sampled population</tspan></text><rect x="44" y="1118" width="552" height="150" rx="17" fill="#fff0eb"/><text x="65" y="1157" fill="#843f2f" font-size="26" font-weight="700"><tspan x="65" dy="0">A mismatch returns to its owner. A</tspan><tspan x="65" dy="34">successful scan cannot repair an</tspan><tspan x="65" dy="34">unrelated report.</tspan></text><text x="44" y="1320" fill="#526979" font-size="21" font-weight="400"><tspan x="44" dy="0">Use with the article worksheet and actual</tspan><tspan x="44" dy="28">package evidence.</tspan></text></g></svg>