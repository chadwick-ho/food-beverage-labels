<svg xmlns="http://www.w3.org/2000/svg" width="760" height="600" viewBox="0 0 760 600"><title>Unprinted roll history and printed image life are separate</title><rect width="760" height="600" fill="#eff5f1"/><g font-family="Arial" fill="#12304a"><text x="35" y="55" font-size="30" font-weight="bold">When does the required evidence change?</text><circle cx="170" cy="270" r="80" fill="#d3e4df" stroke="#416c5b" stroke-width="4"/><circle cx="170" cy="270" r="28" fill="white"/><text x="60" y="405" font-size="25">Unprinted roll</text><path d="M285 270H445 M425 257L445 270L425 283" stroke="#416c5b" stroke-width="5"/><text x="300" y="230" font-size="24">Print event</text><rect x="500" y="185" width="200" height="170" rx="15" fill="white" stroke="#416c5b"/><text x="530" y="245" font-size="25">LOT: DEMO</text><text x="530" y="290" font-size="21">Illustration only</text><text x="500" y="405" font-size="25">Printed information</text><text x="35" y="520" font-size="23">Storage eligibility ≠ adhesion ≠ required image life</text><text x="35" y="570" font-size="21">Conceptual timeline · no real lot, date or durability result</text></g></svg>