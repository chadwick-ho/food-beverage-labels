<svg xmlns="http://www.w3.org/2000/svg" width="640" height="1247" viewBox="0 0 640 1247" role="img" aria-labelledby="title desc"><title id="title">Illustrative tolerance arithmetic</title><desc id="desc">Hypothetical 90%-110% terms only; not a supplier offer or recommended allowance. Setup use is not included.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10z" fill="#52798c"/></marker></defs><rect width="640" height="1247" fill="#f5f8fa"/><g font-family="Arial,Helvetica,sans-serif"><rect width="640" height="185" fill="#163d4b"/><text x="28" y="33" font-size="18" fill="#9ee2ce" font-weight="700"><tspan x="28" dy="0">ZFU LABELS / BUYER DECISION</tspan></text><text x="28" y="83" font-size="31" fill="#ffffff" font-weight="700"><tspan x="28" dy="0">Illustrative tolerance arithmetic</tspan></text><rect x="40" y="210" width="560" height="159" rx="15" fill="#ffffff" stroke="#becfd8" stroke-width="2"/><text x="58" y="244" font-size="26" fill="#126d65" font-weight="700"><tspan x="58" dy="0">JOB NEED</tspan></text><text x="58" y="285" font-size="25" fill="#243b53" font-weight="400"><tspan x="58" dy="0">1,000 packs / one front + one back</tspan><tspan x="58" dy="32">each</tspan></text><path d="M320 371 L320 402" fill="none" stroke="#52798c" stroke-width="3" marker-end="url(#arrow)"/><rect x="40" y="413" width="560" height="127" rx="15" fill="#ffffff" stroke="#becfd8" stroke-width="2"/><text x="58" y="447" font-size="26" fill="#126d65" font-weight="700"><tspan x="58" dy="0">ILLUSTRATIVE ORDER</tspan></text><text x="58" y="488" font-size="25" fill="#243b53" font-weight="400"><tspan x="58" dy="0">1,100 fronts + 1,100 backs</tspan></text><rect x="24" y="584" width="282" height="151" rx="15" fill="#fff0eb" stroke="#becfd8" stroke-width="2"/><text x="42" y="618" font-size="24" fill="#126d65" font-weight="700"><tspan x="42" dy="0">LOWER: 90%</tspan></text><text x="42" y="657" font-size="22" fill="#243b53" font-weight="400"><tspan x="42" dy="0">990 fronts + 990</tspan><tspan x="42" dy="29">backs → 990 sets</tspan></text><rect x="334" y="584" width="282" height="151" rx="15" fill="#e7f2f7" stroke="#becfd8" stroke-width="2"/><text x="352" y="618" font-size="24" fill="#126d65" font-weight="700"><tspan x="352" dy="0">UPPER: 110%</tspan></text><text x="352" y="657" font-size="22" fill="#243b53" font-weight="400"><tspan x="352" dy="0">1,210 fronts + 1,210</tspan><tspan x="352" dy="29">backs → 2,420 pieces</tspan></text><rect x="40" y="770" width="560" height="191" rx="15" fill="#ffffff" stroke="#becfd8" stroke-width="2"/><text x="58" y="804" font-size="26" fill="#126d65" font-weight="700"><tspan x="58" dy="0">TWO DIFFERENT QUESTIONS</tspan></text><text x="58" y="845" font-size="25" fill="#243b53" font-weight="400"><tspan x="58" dy="0">Does the lower set capacity meet the</tspan><tspan x="58" dy="32">job? What does the upper piece amount</tspan><tspan x="58" dy="32">cost under the actual invoice terms?</tspan></text><rect x="24" y="986" width="592" height="191" rx="15" fill="#f0f4f6" stroke="#becfd8" stroke-width="2"/><text x="42" y="1020" font-size="26" fill="#126d65" font-weight="700"><tspan x="42" dy="0">SCOPE / OPEN CONDITION</tspan></text><text x="42" y="1061" font-size="25" fill="#243b53" font-weight="400"><tspan x="42" dy="0">Hypothetical 90%-110% terms only; not a</tspan><tspan x="42" dy="32">supplier offer or recommended allowance.</tspan><tspan x="42" dy="32">Setup use is not included.</tspan></text><text x="28" y="1224" font-size="18" fill="#526979" font-weight="400"><tspan x="28" dy="0">Editorial planning aid • use with the article worksheet</tspan></text></g></svg>