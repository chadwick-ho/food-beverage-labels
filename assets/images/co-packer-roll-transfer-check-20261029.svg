<svg xmlns="http://www.w3.org/2000/svg" width="500" height="1050" viewBox="0 0 500 1050" role="img" aria-labelledby="t d"><title id="t">Can held label rolls move to another co-packer?</title><desc id="d">Compare authorized product, physical roll status and destination equipment before moving the identified stock.</desc><rect width="500" height="1050" fill="#f3f7f7"/><rect width="500" height="145" fill="#173d4a"/><g font-family="Arial" fill="#183f4d"><text x="24" y="38" fill="#a4e9d6" font-size="19">BUYER DECISION / SPLIT DELIVERY</text><text x="24" y="79" fill="white" font-size="27" font-weight="bold">Move the actual rolls</text><text x="24" y="114" fill="white" font-size="27" font-weight="bold">to a second co-packer?</text>
<rect x="20" y="180" width="460" height="180" rx="12" fill="white" stroke="#a9cbd2" stroke-width="2"/><text x="40" y="220" font-size="23" font-weight="bold" fill="#087a78">SOURCE STOCK</text><text x="40" y="264" font-size="21">Identify roll, lot, revision and balance.</text><text x="40" y="298" font-size="21">A held roll is not released by shipping.</text><text x="40" y="332" font-size="21">Retain protection and identity.</text>
<path d="M250 360v35" stroke="#688e9a" stroke-width="3"/><path d="M242 384l8 13 8-13" fill="#688e9a"/><rect x="20" y="400" width="460" height="225" rx="12" fill="#e9f5f0" stroke="#a9cbd2" stroke-width="2"/><text x="40" y="440" font-size="23" font-weight="bold" fill="#087a78">DESTINATION MATCH</text><text x="40" y="484" font-size="21">Correct product and component set?</text><text x="40" y="518" font-size="21">Core, diameter, unwind and sensor fit?</text><text x="40" y="552" font-size="21">Who accepts freight and transfer terms?</text><text x="40" y="586" font-size="21">Unconfirmed field → keep it open.</text>
<path d="M250 625v35" stroke="#688e9a" stroke-width="3"/><path d="M242 649l8 13 8-13" fill="#688e9a"/><rect x="20" y="665" width="460" height="235" rx="12" fill="#fff0eb" stroke="#a9cbd2" stroke-width="2"/><text x="40" y="705" font-size="23" font-weight="bold" fill="#a24229">RECEIPT AND RELEASE</text><text x="40" y="749" font-size="21">Dispatch and receipt are separate events.</text><text x="40" y="783" font-size="21">Do not count in-transit stock at both sites.</text><text x="40" y="817" font-size="21">Receiving and production use require</text><text x="40" y="851" font-size="21">the destination's actual authorization.</text><text x="20" y="1015" font-size="17">Planning aid • no transfer service or price promised</text></g></svg>
