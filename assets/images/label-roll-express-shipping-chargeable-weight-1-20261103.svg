<svg xmlns="http://www.w3.org/2000/svg" width="760" height="600" viewBox="0 0 760 600"><title>Measure the packed carton, not the bare label rolls</title><rect width="760" height="600" fill="#eff5f1"/><g font-family="Arial" fill="#12304a"><text x="35" y="55" font-size="30" font-weight="bold">The carton is the freight measurement unit</text><path d="M155 230L470 230L585 155L270 155Z" fill="#d1e3d8" stroke="#416c5b" stroke-width="3"/><path d="M155 230L470 230L470 440L155 440Z" fill="white" stroke="#416c5b" stroke-width="3"/><path d="M470 230L585 155L585 365L470 440Z" fill="#bdd3c7" stroke="#416c5b" stroke-width="3"/><ellipse cx="250" cy="320" rx="55" ry="25" fill="#d1e3d8"/><ellipse cx="375" cy="320" rx="55" ry="25" fill="#d1e3d8"/><text x="200" y="390" font-size="23">Label rolls + protection</text><path d="M155 475H470 M620 165V365 M520 475L630 400" stroke="#12304a" stroke-width="3"/><text x="260" y="515" font-size="25">Length</text><text x="635" y="280" font-size="24">Height</text><text x="530" y="520" font-size="24">Width</text><text x="35" y="575" font-size="22">Conceptual carton · no dimensions or weight are measured</text></g></svg>