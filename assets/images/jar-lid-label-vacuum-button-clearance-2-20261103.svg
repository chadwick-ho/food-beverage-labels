<svg xmlns="http://www.w3.org/2000/svg" width="660" height="900" viewBox="0 0 660 900"><title>Lid label geometry follows the closure</title><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#527c6d"/></marker></defs><rect width="660" height="900" fill="#edf4ef"/><g font-family="Arial, sans-serif" fill="#12304a"><text x="30" y="48" font-size="30" font-weight="bold">Lid label geometry follows the closure</text><text x="30" y="95" font-size="21">The decorative sticker does not certify a seal</text><path d="M330 275L170 315" stroke="#527c6d" stroke-width="4" marker-end="url(#arrow)"/><path d="M330 275L490 315" stroke="#527c6d" stroke-width="4" marker-end="url(#arrow)"/><path d="M170 505L230 560" stroke="#527c6d" stroke-width="4" marker-end="url(#arrow)"/><path d="M490 505L430 560" stroke="#527c6d" stroke-width="4" marker-end="url(#arrow)"/><path d="M330 720L330 765" stroke="#527c6d" stroke-width="4" marker-end="url(#arrow)"/><rect x="30" y="145" width="600" height="130" rx="14" fill="white" stroke="#aac4b8" stroke-width="2"/><text x="48" y="182" font-size="26" font-weight="bold">Identify the actual cap and inspection</text><text x="48" y="220" font-size="24">Closure owner defines required access/visibility.</text><rect x="30" y="325" width="280" height="180" rx="14" fill="white" stroke="#aac4b8" stroke-width="2"/><text x="48" y="362" font-size="26" font-weight="bold">Sufficient area</text><text x="48" y="400" font-size="24">Place accepted</text><text x="48" y="434" font-size="24">copy with the</text><text x="48" y="468" font-size="24">required clearance.</text><rect x="350" y="325" width="280" height="180" rx="14" fill="white" stroke="#aac4b8" stroke-width="2"/><text x="368" y="362" font-size="26" font-weight="bold">Area conflict</text><text x="368" y="400" font-size="24">Review offset,</text><text x="368" y="434" font-size="24">annular or body</text><text x="368" y="468" font-size="24">label options.</text><rect x="30" y="570" width="600" height="150" rx="14" fill="white" stroke="#aac4b8" stroke-width="2"/><text x="48" y="607" font-size="26" font-weight="bold">Account for application variation</text><text x="48" y="645" font-size="24">Converter and packer confirm the proposal.</text><text x="48" y="679" font-size="24">Inspect a representative finished jar.</text><rect x="30" y="775" width="600" height="90" rx="14" fill="white" stroke="#aac4b8" stroke-width="2"/><text x="48" y="812" font-size="26" font-weight="bold">Closure / food release remain separate decisions</text></g></svg>