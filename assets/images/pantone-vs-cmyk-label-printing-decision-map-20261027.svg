<svg xmlns="http://www.w3.org/2000/svg" width="640" height="1750" viewBox="0 0 640 1750" role="img" aria-labelledby="title desc"><title id="title">Color target and printing route are separate</title><desc id="desc">Article-specific editorial purchasing aid. Follow the decision and preserve unresolved conditions with the responsible reviewer.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10z" fill="#517b89"/></marker></defs><rect width="640" height="1750" fill="#f4f8fa"/><g font-family="Arial,Helvetica,sans-serif"><rect width="640" height="168" fill="#163d4b"/><text x="28" y="30" fill="#9ee2ce" font-size="19" font-weight="700"><tspan x="28" dy="0">ZFU LABELS · BUYER DECISION</tspan></text><text x="28" y="76" fill="#ffffff" font-size="32" font-weight="700"><tspan x="28" dy="0">Color target and printing route</tspan><tspan x="28" dy="39">are separate</tspan></text><rect x="44" y="198" width="552" height="145" rx="17" fill="#e7f2f7" stroke="#d5e2e9" stroke-width="2"/><text x="68" y="237" fill="#137f75" font-size="26" font-weight="700"><tspan x="68" dy="0">SPOT ROUTE</tspan></text><text x="68" y="277" fill="#243b53" font-size="25" font-weight="400"><tspan x="68" dy="0">Ask which actual ink is</tspan><tspan x="68" dy="33">proposed.</tspan></text><rect x="44" y="364" width="552" height="145" rx="17" fill="#eaf4eb" stroke="#d5e2e9" stroke-width="2"/><text x="68" y="403" fill="#137f75" font-size="26" font-weight="700"><tspan x="68" dy="0">PROCESS ROUTE</tspan></text><text x="68" y="443" fill="#243b53" font-size="25" font-weight="400"><tspan x="68" dy="0">Ask which actual color build is</tspan><tspan x="68" dy="33">proposed.</tspan></text><text x="44" y="555" fill="#137f75" font-size="24" font-weight="700"><tspan x="44" dy="0">COMPARE ON ONE BASIS</tspan></text><rect x="44" y="583" width="552" height="145" rx="17" fill="#ffffff" stroke="#d5e2e9" stroke-width="2"/><text x="68" y="622" fill="#137f75" font-size="26" font-weight="700"><tspan x="68" dy="0">COMMON TARGET</tspan></text><text x="68" y="662" fill="#243b53" font-size="25" font-weight="400"><tspan x="68" dy="0">Identify reference and critical</tspan><tspan x="68" dy="33">color region.</tspan></text><rect x="44" y="748" width="552" height="145" rx="17" fill="#ffffff" stroke="#d5e2e9" stroke-width="2"/><text x="68" y="787" fill="#137f75" font-size="26" font-weight="700"><tspan x="68" dy="0">PHYSICAL CONTEXT</tspan></text><text x="68" y="827" fill="#243b53" font-size="25" font-weight="400"><tspan x="68" dy="0">Name stock, backing and finish.</tspan></text><rect x="44" y="913" width="552" height="145" rx="17" fill="#ffffff" stroke="#d5e2e9" stroke-width="2"/><text x="68" y="952" fill="#137f75" font-size="26" font-weight="700"><tspan x="68" dy="0">APPROVAL EVIDENCE</tspan></text><text x="68" y="992" fill="#243b53" font-size="25" font-weight="400"><tspan x="68" dy="0">Agree a representative physical</tspan><tspan x="68" dy="33">proof.</tspan></text><rect x="44" y="1078" width="552" height="260" rx="17" fill="#e9f7ee" stroke="#d5e2e9" stroke-width="2"/><text x="68" y="1117" fill="#137f75" font-size="26" font-weight="700"><tspan x="68" dy="0">DECISION</tspan></text><text x="68" y="1157" fill="#243b53" font-size="25" font-weight="400"><tspan x="68" dy="0">Approve a named route against an</tspan><tspan x="68" dy="33">identified target.</tspan></text><rect x="44" y="1358" width="552" height="260" rx="17" fill="#fff0eb" stroke="#d5e2e9" stroke-width="2"/><text x="68" y="1397" fill="#137f75" font-size="26" font-weight="700"><tspan x="68" dy="0">UNRESOLVED</tspan></text><text x="68" y="1437" fill="#243b53" font-size="25" font-weight="400"><tspan x="68" dy="0">A Pantone name inside a file</tspan><tspan x="68" dy="33">does not confirm the</tspan><tspan x="68" dy="33">manufacturing route.</tspan></text><text x="44" y="1668" fill="#526979" font-size="21" font-weight="400"><tspan x="44" dy="0">Use with the article worksheet and actual</tspan><tspan x="44" dy="28">package evidence.</tspan></text></g></svg>