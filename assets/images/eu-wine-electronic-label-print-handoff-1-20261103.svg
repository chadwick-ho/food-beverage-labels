<svg xmlns="http://www.w3.org/2000/svg" width="660" height="550" viewBox="0 0 660 550"><title>One wine, two information locations</title><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#527c6d"/></marker></defs><rect width="660" height="550" fill="#edf4ef"/><g font-family="Arial, sans-serif" fill="#12304a"><text x="30" y="48" font-size="30" font-weight="bold">One wine, two information locations</text><text x="30" y="95" font-size="21">The market reviewer approves the exact split</text><path d="M170 320L250 370" stroke="#527c6d" stroke-width="4" marker-end="url(#arrow)"/><path d="M490 320L410 370" stroke="#527c6d" stroke-width="4" marker-end="url(#arrow)"/><rect x="30" y="145" width="280" height="175" rx="14" fill="white" stroke="#aac4b8" stroke-width="2"/><text x="48" y="182" font-size="26" font-weight="bold">Physical bottle</text><text x="48" y="220" font-size="24">Required on-pack</text><text x="48" y="254" font-size="24">information</text><text x="48" y="288" font-size="24">+ printed route</text><rect x="350" y="145" width="280" height="175" rx="14" fill="white" stroke="#aac4b8" stroke-width="2"/><text x="368" y="182" font-size="26" font-weight="bold">Electronic page</text><text x="368" y="220" font-size="24">Approved product</text><text x="368" y="254" font-size="24">disclosure</text><text x="368" y="288" font-size="24">+ language route</text><rect x="30" y="380" width="600" height="110" rx="14" fill="white" stroke="#aac4b8" stroke-width="2"/><text x="48" y="417" font-size="26" font-weight="bold">Shared identity</text><text x="48" y="455" font-size="24">Same wine/version and controlled reference</text></g></svg>