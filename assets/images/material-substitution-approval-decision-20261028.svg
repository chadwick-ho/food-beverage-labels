<svg xmlns="http://www.w3.org/2000/svg" width="640" height="1454" viewBox="0 0 640 1454" role="img" aria-labelledby="title desc"><title id="title">Close a temporary material concession</title><desc id="desc">Completion of one run does not qualify unrepresented conditions or silently change the repeat-order specification.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10z" fill="#52798c"/></marker></defs><rect width="640" height="1454" fill="#f5f8fa"/><g font-family="Arial,Helvetica,sans-serif"><rect width="640" height="185" fill="#163d4b"/><text x="28" y="33" font-size="18" fill="#9ee2ce" font-weight="700"><tspan x="28" dy="0">ZFU LABELS / BUYER DECISION</tspan></text><text x="28" y="83" font-size="31" fill="#ffffff" font-weight="700"><tspan x="28" dy="0">Close a temporary material</tspan><tspan x="28" dy="38">concession</tspan></text><rect x="40" y="210" width="560" height="159" rx="15" fill="#ffffff" stroke="#becfd8" stroke-width="2"/><text x="58" y="244" font-size="26" fill="#126d65" font-weight="700"><tspan x="58" dy="0">LIMITED AUTHORITY</tspan></text><text x="58" y="285" font-size="25" fill="#243b53" font-weight="400"><tspan x="58" dy="0">Order, components, quantity and</tspan><tspan x="58" dy="32">conditions</tspan></text><path d="M320 371 L320 402" fill="none" stroke="#52798c" stroke-width="3" marker-end="url(#arrow)"/><rect x="40" y="413" width="560" height="159" rx="15" fill="#ffffff" stroke="#becfd8" stroke-width="2"/><text x="58" y="447" font-size="26" fill="#126d65" font-weight="700"><tspan x="58" dy="0">ACTUAL DELIVERY</tspan></text><text x="58" y="488" font-size="25" fill="#243b53" font-weight="400"><tspan x="58" dy="0">Construction plus supplied lot/roll</tspan><tspan x="58" dy="32">identity</tspan></text><path d="M320 574 L320 605" fill="none" stroke="#52798c" stroke-width="3" marker-end="url(#arrow)"/><rect x="40" y="616" width="560" height="159" rx="15" fill="#ffffff" stroke="#becfd8" stroke-width="2"/><text x="58" y="650" font-size="26" fill="#126d65" font-weight="700"><tspan x="58" dy="0">REMAINING STOCK</tspan></text><text x="58" y="691" font-size="25" fill="#243b53" font-weight="400"><tspan x="58" dy="0">Keep original and substitute</tspan><tspan x="58" dy="32">distinguishable</tspan></text><path d="M320 777 L320 808" fill="none" stroke="#52798c" stroke-width="3" marker-end="url(#arrow)"/><rect x="40" y="819" width="560" height="127" rx="15" fill="#ffffff" stroke="#becfd8" stroke-width="2"/><text x="58" y="853" font-size="26" fill="#126d65" font-weight="700"><tspan x="58" dy="0">CLOSING EVENT</tspan></text><text x="58" y="894" font-size="25" fill="#243b53" font-weight="400"><tspan x="58" dy="0">Run complete, scope used or review due</tspan></text><path d="M320 948 L320 979" fill="none" stroke="#52798c" stroke-width="3" marker-end="url(#arrow)"/><rect x="40" y="990" width="560" height="159" rx="15" fill="#ffffff" stroke="#becfd8" stroke-width="2"/><text x="58" y="1024" font-size="26" fill="#126d65" font-weight="700"><tspan x="58" dy="0">NEXT BASELINE</tspan></text><text x="58" y="1065" font-size="25" fill="#243b53" font-weight="400"><tspan x="58" dy="0">Original, formally changed or new</tspan><tspan x="58" dy="32">limited proposal</tspan></text><rect x="24" y="1193" width="592" height="191" rx="15" fill="#f0f4f6" stroke="#becfd8" stroke-width="2"/><text x="42" y="1227" font-size="26" fill="#126d65" font-weight="700"><tspan x="42" dy="0">SCOPE / OPEN CONDITION</tspan></text><text x="42" y="1268" font-size="25" fill="#243b53" font-weight="400"><tspan x="42" dy="0">Completion of one run does not qualify</tspan><tspan x="42" dy="32">unrepresented conditions or silently</tspan><tspan x="42" dy="32">change the repeat-order specification.</tspan></text><text x="28" y="1431" font-size="18" fill="#526979" font-weight="400"><tspan x="28" dy="0">Editorial planning aid • use with the article worksheet</tspan></text></g></svg>