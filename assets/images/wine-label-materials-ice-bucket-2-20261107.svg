<svg xmlns="http://www.w3.org/2000/svg" width="660" height="600" viewBox="0 0 660 600"><title>Use mixed results to ask the next question</title><rect width="660" height="600" fill="#edf4ef"/><g font-family="Arial" fill="#12304a"><text x="28" y="48" font-size="28" font-weight="bold">Use mixed results to ask the next question</text><rect x="30" y="105" width="600" height="120" rx="12" fill="white"/><text x="50" y="145" font-size="26" font-weight="bold">Whole paper, wrong wet appearance?</text><text x="50" y="190" font-size="24">Ask about the actual wet-opacity candidate.</text><rect x="30" y="270" width="600" height="100" rx="12" fill="white"/><text x="50" y="312" font-size="26" font-weight="bold">Good appearance, torn paper?</text><text x="50" y="350" font-size="24">Request relevant physical-integrity evidence.</text><rect x="30" y="415" width="600" height="100" rx="12" fill="white"/><text x="50" y="457" font-size="26" font-weight="bold">Face looks right, bond moves?</text><text x="50" y="495" font-size="24">Review the adhesive / bottle / use sequence.</text><text x="28" y="568" font-size="21">No universal exposure interval or pass limit is implied.</text></g></svg>