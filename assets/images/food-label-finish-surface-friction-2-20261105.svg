<svg xmlns="http://www.w3.org/2000/svg" width="660" height="600" viewBox="0 0 660 600"><title>Movement evidence is not a rub result</title><rect width="660" height="600" fill="#edf4ef"/><g font-family="Arial" fill="#12304a"><text x="30" y="48" font-size="29" font-weight="bold">Movement evidence is not a rub result</text><rect x="30" y="105" width="600" height="115" rx="12" fill="white"/><text x="55" y="148" font-size="27" font-weight="bold">Starting movement</text><text x="55" y="190" font-size="24">Identify the same sample and counter-surface.</text><rect x="30" y="270" width="600" height="115" rx="12" fill="white"/><text x="55" y="313" font-size="27" font-weight="bold">Continued sliding</text><text x="55" y="355" font-size="24">Record the relevant conditions and observation.</text><rect x="30" y="435" width="600" height="85" rx="12" fill="white"/><text x="55" y="485" font-size="25">Inspect printed-face wear separately.</text><text x="30" y="570" font-size="21">Comparison questions; no test method or passing value supplied.</text></g></svg>