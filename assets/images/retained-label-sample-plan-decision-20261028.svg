<svg xmlns="http://www.w3.org/2000/svg" width="640" height="1148" viewBox="0 0 640 1148" role="img" aria-labelledby="title desc"><title id="title">Protect the comparison you still need</title><desc id="desc">Illustrative allocation, not a required sample count. A used remainder is not an untouched witness.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10z" fill="#52798c"/></marker></defs><rect width="640" height="1148" fill="#f5f8fa"/><g font-family="Arial,Helvetica,sans-serif"><rect width="640" height="185" fill="#163d4b"/><text x="28" y="33" font-size="18" fill="#9ee2ce" font-weight="700"><tspan x="28" dy="0">ZFU LABELS / BUYER DECISION</tspan></text><text x="28" y="83" font-size="31" fill="#ffffff" font-weight="700"><tspan x="28" dy="0">Protect the comparison you still</tspan><tspan x="28" dy="38">need</tspan></text><rect x="40" y="210" width="560" height="159" rx="15" fill="#ffffff" stroke="#becfd8" stroke-width="2"/><text x="58" y="244" font-size="26" fill="#126d65" font-weight="700"><tspan x="58" dy="0">INVENTORY ACTUAL SPECIMENS</tspan></text><text x="58" y="285" font-size="25" fill="#243b53" font-weight="400"><tspan x="58" dy="0">ID, origin, condition and questions</tspan><tspan x="58" dy="32">each can answer</tspan></text><path d="M320 369 L320 399" fill="none" stroke="#52798c" stroke-width="3" marker-end="url(#arrow)"/><rect x="24" y="409" width="282" height="180" rx="15" fill="#e9f7ee" stroke="#becfd8" stroke-width="2"/><text x="42" y="443" font-size="24" fill="#126d65" font-weight="700"><tspan x="42" dy="0">RESERVE</tspan></text><text x="42" y="482" font-size="22" fill="#243b53" font-weight="400"><tspan x="42" dy="0">Untouched witness</tspan><tspan x="42" dy="29">for the later</tspan><tspan x="42" dy="29">comparison</tspan></text><rect x="334" y="409" width="282" height="180" rx="15" fill="#e7f2f7" stroke="#becfd8" stroke-width="2"/><text x="352" y="443" font-size="24" fill="#126d65" font-weight="700"><tspan x="352" dy="0">ALLOCATE</tspan></text><text x="352" y="482" font-size="22" fill="#243b53" font-weight="400"><tspan x="352" dy="0">Separate piece for</tspan><tspan x="352" dy="29">the agreed</tspan><tspan x="352" dy="29">destructive check</tspan></text><rect x="40" y="634" width="560" height="223" rx="15" fill="#fff0eb" stroke="#becfd8" stroke-width="2"/><text x="58" y="668" font-size="26" fill="#126d65" font-weight="700"><tspan x="58" dy="0">ONLY ONE PIECE?</tspan></text><text x="58" y="709" font-size="25" fill="#243b53" font-weight="400"><tspan x="58" dy="0">Resolve the competing questions before</tspan><tspan x="58" dy="32">consumption. Seek another specimen,</tspan><tspan x="58" dy="32">agree sequence or retain an explicit</tspan><tspan x="58" dy="32">gap.</tspan></text><rect x="24" y="887" width="592" height="191" rx="15" fill="#f0f4f6" stroke="#becfd8" stroke-width="2"/><text x="42" y="921" font-size="26" fill="#126d65" font-weight="700"><tspan x="42" dy="0">SCOPE / OPEN CONDITION</tspan></text><text x="42" y="962" font-size="25" fill="#243b53" font-weight="400"><tspan x="42" dy="0">Illustrative allocation, not a required</tspan><tspan x="42" dy="32">sample count. A used remainder is not an</tspan><tspan x="42" dy="32">untouched witness.</tspan></text><text x="28" y="1125" font-size="18" fill="#526979" font-weight="400"><tspan x="28" dy="0">Editorial planning aid • use with the article worksheet</tspan></text></g></svg>