<svg xmlns="http://www.w3.org/2000/svg" width="640" height="1390" viewBox="0 0 640 1390" role="img" aria-labelledby="title desc"><title id="title">Locate the unobserved logistics leg</title><desc id="desc">A gap in observation is not evidence that a named handler caused the damage.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10z" fill="#52798c"/></marker></defs><rect width="640" height="1390" fill="#f5f8fa"/><g font-family="Arial,Helvetica,sans-serif"><rect width="640" height="185" fill="#163d4b"/><text x="28" y="33" font-size="18" fill="#9ee2ce" font-weight="700"><tspan x="28" dy="0">ZFU LABELS / BUYER DECISION</tspan></text><text x="28" y="83" font-size="31" fill="#ffffff" font-weight="700"><tspan x="28" dy="0">Locate the unobserved logistics</tspan><tspan x="28" dy="38">leg</tspan></text><rect x="40" y="210" width="560" height="127" rx="15" fill="#ffffff" stroke="#becfd8" stroke-width="2"/><text x="58" y="244" font-size="26" fill="#126d65" font-weight="700"><tspan x="58" dy="0">DISPATCH</tspan></text><text x="58" y="285" font-size="25" fill="#243b53" font-weight="400"><tspan x="58" dy="0">Original protection + roll/carton IDs</tspan></text><path d="M320 339 L320 370" fill="none" stroke="#52798c" stroke-width="3" marker-end="url(#arrow)"/><rect x="40" y="381" width="560" height="159" rx="15" fill="#ffffff" stroke="#becfd8" stroke-width="2"/><text x="58" y="415" font-size="26" fill="#126d65" font-weight="700"><tspan x="58" dy="0">CONSOLIDATION</tspan></text><text x="58" y="456" font-size="25" fill="#243b53" font-weight="400"><tspan x="58" dy="0">Arrival observation or explicitly</tspan><tspan x="58" dy="32">unopened</tspan></text><path d="M320 542 L320 573" fill="none" stroke="#52798c" stroke-width="3" marker-end="url(#arrow)"/><rect x="40" y="584" width="560" height="127" rx="15" fill="#ffffff" stroke="#becfd8" stroke-width="2"/><text x="58" y="618" font-size="26" fill="#126d65" font-weight="700"><tspan x="58" dy="0">REPACKING</tspan></text><text x="58" y="659" font-size="25" fill="#243b53" font-weight="400"><tspan x="58" dy="0">Old/new identity map + support changes</tspan></text><path d="M320 713 L320 744" fill="none" stroke="#52798c" stroke-width="3" marker-end="url(#arrow)"/><rect x="40" y="755" width="560" height="159" rx="15" fill="#ffffff" stroke="#becfd8" stroke-width="2"/><text x="58" y="789" font-size="26" fill="#126d65" font-weight="700"><tspan x="58" dy="0">CO-PACKER RECEIPT</tspan></text><text x="58" y="830" font-size="25" fill="#243b53" font-weight="400"><tspan x="58" dy="0">New observation before corrective</tspan><tspan x="58" dy="32">handling</tspan></text><path d="M320 916 L320 947" fill="none" stroke="#52798c" stroke-width="3" marker-end="url(#arrow)"/><rect x="40" y="958" width="560" height="159" rx="15" fill="#ffffff" stroke="#becfd8" stroke-width="2"/><text x="58" y="992" font-size="26" fill="#126d65" font-weight="700"><tspan x="58" dy="0">INVESTIGATION</tspan></text><text x="58" y="1033" font-size="25" fill="#243b53" font-weight="400"><tspan x="58" dy="0">Compare facts; preserve the missing</tspan><tspan x="58" dy="32">interval</tspan></text><rect x="24" y="1161" width="592" height="159" rx="15" fill="#f0f4f6" stroke="#becfd8" stroke-width="2"/><text x="42" y="1195" font-size="26" fill="#126d65" font-weight="700"><tspan x="42" dy="0">SCOPE / OPEN CONDITION</tspan></text><text x="42" y="1236" font-size="25" fill="#243b53" font-weight="400"><tspan x="42" dy="0">A gap in observation is not evidence</tspan><tspan x="42" dy="32">that a named handler caused the damage.</tspan></text><text x="28" y="1367" font-size="18" fill="#526979" font-weight="400"><tspan x="28" dy="0">Editorial planning aid • use with the article worksheet</tspan></text></g></svg>