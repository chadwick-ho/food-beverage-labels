<svg xmlns="http://www.w3.org/2000/svg" width="640" height="1040" viewBox="0 0 640 1040" role="img" aria-label="One intended ink, two file names?"><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8Z" fill="#486e80"/></marker></defs><g font-family="Arial, sans-serif"><rect x="0" y="0" width="640" height="1040" rx="0" fill="#f2f7fa" stroke="#a5becb" stroke-width="2"/><rect x="0" y="0" width="640" height="190" rx="0" fill="#173e4b" stroke="#173e4b" stroke-width="2"/><text x="30" y="35" fill="#a4e1d0" font-size="18" font-weight="700"><tspan x="30" dy="0">ZFU LABELS / PURCHASING DIAGRAM</tspan></text><text x="30" y="88" fill="#fff" font-size="32" font-weight="700"><tspan x="30" dy="0">One intended ink, two file names?</tspan></text><rect x="34" y="225" width="572" height="108" rx="14" fill="#fff" stroke="#a5becb" stroke-width="2"/><text x="54" y="268" fill="#213b4c" font-size="29" font-weight="700"><tspan x="54" dy="0">BRAND_BLUE</tspan></text><text x="54" y="307" fill="#213b4c" font-size="24" font-weight="400"><tspan x="54" dy="0">Intended brand ink?</tspan></text><rect x="34" y="360" width="572" height="108" rx="14" fill="#fff" stroke="#a5becb" stroke-width="2"/><text x="54" y="403" fill="#213b4c" font-size="29" font-weight="700"><tspan x="54" dy="0">BrandBlue_copy</tspan></text><text x="54" y="442" fill="#213b4c" font-size="24" font-weight="400"><tspan x="54" dy="0">Same intended ink? Confirm first.</tspan></text><path d="M606 279 L622 279" fill="none" stroke="#486e80" stroke-width="3"/><path d="M622 279 L622 505" fill="none" stroke="#486e80" stroke-width="3"/><path d="M606 414 L622 414" fill="none" stroke="#486e80" stroke-width="3"/><path d="M622 505 L320 505" fill="none" stroke="#486e80" stroke-width="3"/><path d="M320 505 L320 528" fill="none" stroke="#486e80" stroke-width="3" marker-end="url(#arrow)"/><rect x="34" y="539" width="572" height="150" rx="14" fill="#e0f1ea" stroke="#a5becb" stroke-width="2"/><text x="54" y="580" fill="#213b4c" font-size="27" font-weight="700"><tspan x="54" dy="0">CONFIRMED DUPLICATE</tspan></text><text x="54" y="627" fill="#213b4c" font-size="25" font-weight="400"><tspan x="54" dy="0">Prepress mapping to one agreed output</tspan><tspan x="54" dy="33">separation; recheck export.</tspan></text><rect x="34" y="728" width="572" height="130" rx="14" fill="#fff1de" stroke="#a5becb" stroke-width="2"/><text x="54" y="769" fill="#213b4c" font-size="27" font-weight="700"><tspan x="54" dy="0">WHITE_MASK stays separate</tspan></text><text x="54" y="814" fill="#213b4c" font-size="24" font-weight="400"><tspan x="54" dy="0">Technical channels need their own role.</tspan></text><text x="34" y="907" fill="#213b4c" font-size="24" font-weight="400"><tspan x="34" dy="0">If intent is uncertain, hold the mapping</tspan><tspan x="34" dy="32">question. Names are fictional.</tspan></text><text x="30" y="1015" fill="#4b6473" font-size="18" font-weight="400"><tspan x="30" dy="0">Planning example / no customer result or acceptance limit</tspan></text></g></svg>