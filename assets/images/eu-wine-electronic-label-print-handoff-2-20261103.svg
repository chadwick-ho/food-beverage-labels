<svg xmlns="http://www.w3.org/2000/svg" width="660" height="900" viewBox="0 0 660 900"><title>Approve the route, not just the QR</title><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#527c6d"/></marker></defs><rect width="660" height="900" fill="#edf4ef"/><g font-family="Arial, sans-serif" fill="#12304a"><text x="30" y="48" font-size="30" font-weight="bold">Approve the route, not just the QR</text><text x="30" y="95" font-size="21">Review the disclosure environment too</text><path d="M330 280L330 320" stroke="#527c6d" stroke-width="4" marker-end="url(#arrow)"/><path d="M330 465L330 505" stroke="#527c6d" stroke-width="4" marker-end="url(#arrow)"/><path d="M330 650L330 690" stroke="#527c6d" stroke-width="4" marker-end="url(#arrow)"/><rect x="30" y="145" width="600" height="135" rx="14" fill="white" stroke="#aac4b8" stroke-width="2"/><text x="48" y="182" font-size="26" font-weight="bold">1. Market review</text><text x="48" y="220" font-size="24">Confirm applicability and physical copy.</text><rect x="30" y="330" width="600" height="135" rx="14" fill="white" stroke="#aac4b8" stroke-width="2"/><text x="48" y="367" font-size="26" font-weight="bold">2. Product-specific mapping</text><text x="48" y="405" font-size="24">Freeze the exact route and disclosure version.</text><rect x="30" y="515" width="600" height="135" rx="14" fill="white" stroke="#aac4b8" stroke-width="2"/><text x="48" y="552" font-size="26" font-weight="bold">3. Final-pack access check</text><text x="48" y="590" font-size="24">Correct wine, languages and readable page.</text><rect x="30" y="700" width="600" height="155" rx="14" fill="white" stroke="#aac4b8" stroke-width="2"/><text x="48" y="737" font-size="26" font-weight="bold">4. Controlled maintenance</text><text x="48" y="775" font-size="24">Review redirects, content and provider changes.</text><text x="48" y="809" font-size="24">Keep distributed bottle versions identifiable.</text></g></svg>