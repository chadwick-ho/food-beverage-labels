<svg xmlns="http://www.w3.org/2000/svg" width="660" height="600" viewBox="0 0 660 600"><title>The reverse and grain also need a brief</title><rect width="660" height="600" fill="#edf4ef"/><g font-family="Arial" fill="#12304a"><text x="30" y="48" font-size="29" font-weight="bold">The reverse and grain also need a brief</text><rect x="50" y="125" width="250" height="280" rx="12" fill="white" stroke="#527c6d" stroke-width="3"/><rect x="360" y="125" width="250" height="280" rx="12" fill="#ded3b5" stroke="#527c6d" stroke-width="3"/><text x="95" y="175" font-size="25">Printed face</text><text x="395" y="175" font-size="25">Paper reverse</text><rect x="95" y="230" width="160" height="90" fill="#d1e2d7"/><path d="M400 215v130m35-130v130m35-130v130m35-130v130m35-130v130" stroke="#9d8b5c" stroke-width="3"/><text x="65" y="465" font-size="24">Name the side, grain and actual supplied stock.</text><text x="65" y="510" font-size="22">Lines show a reference, not a required orientation.</text><text x="30" y="570" font-size="21">Conceptual paper views; no qualified stock or test shown.</text></g></svg>