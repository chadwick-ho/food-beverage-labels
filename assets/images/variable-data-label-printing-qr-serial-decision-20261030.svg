<svg xmlns="http://www.w3.org/2000/svg" width="640" height="1030" viewBox="0 0 640 1030" role="img" aria-label="Preserve the identifier at every handoff"><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8Z" fill="#486e80"/></marker></defs><g font-family="Arial, sans-serif"><rect x="0" y="0" width="640" height="1030" rx="0" fill="#f2f7fa" stroke="#a5becb" stroke-width="2"/><rect x="0" y="0" width="640" height="190" rx="0" fill="#173e4b" stroke="#173e4b" stroke-width="2"/><text x="30" y="35" fill="#a4e1d0" font-size="18" font-weight="700"><tspan x="30" dy="0">ZFU LABELS / PURCHASING DIAGRAM</tspan></text><text x="30" y="88" fill="#fff" font-size="32" font-weight="700"><tspan x="30" dy="0">Preserve the identifier at every</tspan><tspan x="30" dy="40">handoff</tspan></text><rect x="34" y="222" width="572" height="143" rx="14" fill="#fff" stroke="#a5becb" stroke-width="2"/><text x="54" y="261" fill="#213b4c" font-size="26" font-weight="700"><tspan x="54" dy="0">1  APPROVED SOURCE</tspan></text><text x="54" y="307" fill="#213b4c" font-size="25" font-weight="400"><tspan x="54" dy="0">Literal string: 000731 / length: 6</tspan></text><path d="M320 369 L320 399" fill="none" stroke="#486e80" stroke-width="3" marker-end="url(#arrow)"/><rect x="34" y="408" width="572" height="143" rx="14" fill="#fff" stroke="#a5becb" stroke-width="2"/><text x="54" y="447" fill="#213b4c" font-size="26" font-weight="700"><tspan x="54" dy="0">2  EXPORTED FILE</tspan></text><text x="54" y="493" fill="#213b4c" font-size="25" font-weight="400"><tspan x="54" dy="0">Compare stored characters, not display</tspan></text><path d="M320 555 L320 585" fill="none" stroke="#486e80" stroke-width="3" marker-end="url(#arrow)"/><rect x="34" y="594" width="572" height="143" rx="14" fill="#fff" stroke="#a5becb" stroke-width="2"/><text x="54" y="633" fill="#213b4c" font-size="26" font-weight="700"><tspan x="54" dy="0">3  POPULATED OUTPUT</tspan></text><text x="54" y="679" fill="#213b4c" font-size="25" font-weight="400"><tspan x="54" dy="0">Decoded value linked to the same record</tspan></text><rect x="34" y="774" width="572" height="165" rx="14" fill="#fff1de" stroke="#a5becb" stroke-width="2"/><text x="54" y="812" fill="#213b4c" font-size="27" font-weight="700"><tspan x="54" dy="0">000731 is not the string 731</tspan></text><text x="54" y="858" fill="#213b4c" font-size="25" font-weight="400"><tspan x="54" dy="0">A matching row count cannot prove exact</tspan><tspan x="54" dy="33">character preservation.</tspan></text><text x="30" y="1005" fill="#4b6473" font-size="18" font-weight="400"><tspan x="30" dy="0">Planning example / no customer result or acceptance limit</tspan></text></g></svg>