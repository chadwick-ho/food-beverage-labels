<svg xmlns="http://www.w3.org/2000/svg" width="500" height="1120" viewBox="0 0 500 1120" role="img" aria-labelledby="t d"><title id="t">Check a pail label against handle positions</title><desc id="d">Review resting and carrying handle positions, then move or separate information only after checking the actual pail and printing process.</desc><rect width="500" height="1120" fill="#f3f7f7"/><rect width="500" height="145" fill="#173d4a"/><g font-family="Arial" fill="#183f4d"><text x="24" y="38" fill="#a4e9d6" font-size="19">BUYER DECISION / PAILS</text><text x="24" y="79" fill="white" font-size="27" font-weight="bold">Keep information clear</text><text x="24" y="114" fill="white" font-size="27" font-weight="bold">of handle travel</text>
<rect x="20" y="170" width="460" height="190" rx="12" fill="white" stroke="#a9cbd2" stroke-width="2"/><text x="40" y="209" font-size="23" font-weight="bold" fill="#087a78">1. MARK THE REAL PANEL</text><text x="40" y="253" font-size="21">Filled pail, supplier and cut outline.</text><text x="40" y="287" font-size="21">Keep taper and ribs visible.</text><text x="40" y="321" font-size="21">Do not assume a common flat panel.</text>
<rect x="20" y="385" width="460" height="190" rx="12" fill="#e9f5f0" stroke="#a9cbd2" stroke-width="2"/><text x="40" y="424" font-size="23" font-weight="bold" fill="#087a78">2. MOVE THE HANDLE</text><text x="40" y="468" font-size="21">Check lowered and carrying positions.</text><text x="40" y="502" font-size="21">Mark the contact and obscured areas.</text><text x="40" y="536" font-size="21">Include actual packing positions.</text>
<rect x="20" y="600" width="460" height="190" rx="12" fill="#edf4fa" stroke="#a9cbd2" stroke-width="2"/><text x="40" y="639" font-size="23" font-weight="bold" fill="#087a78">3. REVIEW EACH FIELD</text><text x="40" y="683" font-size="21">Product name and variant visible?</text><text x="40" y="717" font-size="21">Can the date or lot field be printed?</text><text x="40" y="751" font-size="21">What barcode check is agreed?</text>
<rect x="20" y="815" width="460" height="215" rx="12" fill="#fff0eb" stroke="#a9cbd2" stroke-width="2"/><text x="40" y="854" font-size="23" font-weight="bold" fill="#087a78">4. RESOLVE EXCEPTIONS</text><text x="40" y="898" font-size="21">Move the field only after approval.</text><text x="40" y="932" font-size="21">Check every actual pail variant.</text><text x="40" y="966" font-size="21">If one cut cannot serve both,</text><text x="40" y="1000" font-size="21">compare separate layouts and cost.</text><text x="20" y="1085" font-size="17">Planning aid • no universal clearance or test result</text></g></svg>
