<svg xmlns="http://www.w3.org/2000/svg" width="640" height="1120" viewBox="0 0 640 1120" role="img" aria-label="Zero findings can occur in a nonzero-defect model"><g font-family="Arial, sans-serif"><rect x="0" y="0" width="640" height="1120" fill="#f2f7fa" stroke="#a5becb" stroke-width="2"/><rect x="0" y="0" width="640" height="190" fill="#173e4b" stroke="#a5becb" stroke-width="2"/><text x="30" y="35" font-size="18" font-weight="700" fill="#a4e1d0"><tspan x="30" dy="0">ZFU LABELS / PURCHASING DIAGRAM</tspan></text><text x="30" y="88" font-size="32" font-weight="700" fill="#fff"><tspan x="30" dy="0">Zero findings can occur in a</tspan><tspan x="30" dy="40">nonzero-defect model</tspan></text><text x="34" y="240" font-size="29" font-weight="700" fill="#213b4c"><tspan x="34" dy="0">ASSUMED MODEL p = 0.01</tspan></text><text x="34" y="295" font-size="28" font-weight="700" fill="#213b4c"><tspan x="34" dy="0">P(zero findings) = (1 - p)^n</tspan></text><text x="34" y="390" font-size="30" font-weight="700" fill="#213b4c"><tspan x="34" dy="0">n = 20</tspan></text><rect x="34" y="420" width="570" height="60" fill="#fff" stroke="#a5becb" stroke-width="2"/><rect x="34" y="420" width="466" height="60" fill="#c9e8e0" stroke="#a5becb" stroke-width="2"/><text x="34" y="536" font-size="28" font-weight="700" fill="#213b4c"><tspan x="34" dy="0">81.8% chance of zero</tspan></text><text x="34" y="640" font-size="30" font-weight="700" fill="#213b4c"><tspan x="34" dy="0">n = 100</tspan></text><rect x="34" y="670" width="570" height="60" fill="#fff" stroke="#a5becb" stroke-width="2"/><rect x="34" y="670" width="208" height="60" fill="#c9e8e0" stroke="#a5becb" stroke-width="2"/><text x="34" y="786" font-size="28" font-weight="700" fill="#213b4c"><tspan x="34" dy="0">36.6% chance of zero</tspan></text><text x="34" y="922" font-size="26" font-weight="400" fill="#213b4c"><tspan x="34" dy="0">Independent trials and constant p</tspan><tspan x="34" dy="34">assumed. Neither n is a recommended</tspan><tspan x="34" dy="34">sample plan.</tspan></text><text x="30" y="1095" font-size="18" font-weight="400" fill="#4b6473"><tspan x="30" dy="0">Planning example / no customer result or acceptance limit</tspan></text></g></svg>