<svg xmlns="http://www.w3.org/2000/svg" width="640" height="1120" viewBox="0 0 640 1120" role="img" aria-label="The matrix is smaller than the reserved footprint"><g font-family="Arial, sans-serif"><rect x="0" y="0" width="640" height="1120" fill="#f2f7fa" stroke="#a5becb" stroke-width="2"/><rect x="0" y="0" width="640" height="190" fill="#173e4b" stroke="#a5becb" stroke-width="2"/><text x="30" y="35" font-size="18" font-weight="700" fill="#a4e1d0"><tspan x="30" dy="0">ZFU LABELS / PURCHASING DIAGRAM</tspan></text><text x="30" y="88" font-size="32" font-weight="700" fill="#fff"><tspan x="30" dy="0">The matrix is smaller than the</tspan><tspan x="30" dy="40">reserved footprint</tspan></text><text x="34" y="238" font-size="24" font-weight="700" fill="#213b4c"><tspan x="34" dy="0">GEOMETRIC PLACEHOLDER / NOT A CODE</tspan></text><rect x="110" y="280" width="370" height="370" fill="#fff" stroke="#a5becb" stroke-width="2"/><rect x="150" y="320" width="290" height="290" fill="#c9e8e0" stroke="#a5becb" stroke-width="2"/><text x="190" y="410" font-size="34" font-weight="700" fill="#213b4c"><tspan x="190" dy="0">29 x 29</tspan></text><text x="178" y="470" font-size="27" font-weight="400" fill="#213b4c"><tspan x="178" dy="0">module matrix</tspan></text><text x="168" y="543" font-size="26" font-weight="400" fill="#213b4c"><tspan x="168" dy="0">14.5 mm wide</tspan></text><path d="M110 682 L480 682" stroke="#486e80" stroke-width="3" fill="none"/><path d="M110 668 L110 696" stroke="#486e80" stroke-width="3" fill="none"/><path d="M480 668 L480 696" stroke="#486e80" stroke-width="3" fill="none"/><text x="105" y="741" font-size="28" font-weight="700" fill="#213b4c"><tspan x="105" dy="0">Full reserved width: 18.5 mm</tspan></text><text x="34" y="823" font-size="27" font-weight="400" fill="#213b4c"><tspan x="34" dy="0">Example X = 0.5 mm; four-module margins</tspan><tspan x="34" dy="35">are 2 mm on each side.</tspan></text><text x="34" y="966" font-size="26" font-weight="400" fill="#213b4c"><tspan x="34" dy="0">Payload, symbol and receiving</tspan><tspan x="34" dy="34">requirements still need approval.</tspan></text><text x="30" y="1095" font-size="18" font-weight="400" fill="#4b6473"><tspan x="30" dy="0">Planning example / no customer result or acceptance limit</tspan></text></g></svg>