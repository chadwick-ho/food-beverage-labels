<svg xmlns="http://www.w3.org/2000/svg" width="660" height="600" viewBox="0 0 660 600"><title>Write what the sample really represents</title><rect width="660" height="600" fill="#edf4ef"/><g font-family="Arial" fill="#12304a"><text x="28" y="48" font-size="28" font-weight="bold">Write what the sample really represents</text><rect x="35" y="110" width="590" height="115" rx="12" fill="white"/><text x="55" y="153" font-size="27" font-weight="bold">Material and reverse treatment</text><text x="55" y="195" font-size="24">Represented / different / unresolved</text><rect x="35" y="270" width="590" height="110" rx="12" fill="white"/><text x="55" y="313" font-size="27" font-weight="bold">Print, finish, relief and contour</text><text x="55" y="355" font-size="24">Identify the actual supplied combination.</text><rect x="35" y="425" width="590" height="95" rx="12" fill="white"/><text x="55" y="465" font-size="27" font-weight="bold">Stack, packing and station</text><text x="55" y="500" font-size="24">Keep the intended magazine reference.</text><text x="28" y="568" font-size="21">Decision record; the line owner defines actual acceptance.</text></g></svg>