<svg xmlns="http://www.w3.org/2000/svg" width="660" height="600" viewBox="0 0 660 600"><title>Intact paper can still change appearance</title><rect width="660" height="600" fill="#edf4ef"/><g font-family="Arial" fill="#12304a"><text x="28" y="48" font-size="28" font-weight="bold">Intact paper can still change appearance</text><path d="M260 110h90v80q70 40 70 100v220H190V290q0-60 70-100z" fill="#496657" stroke="#12304a" stroke-width="3"/><rect x="210" y="300" width="190" height="150" fill="#f8f4df"/><path d="M210 390h190v60H210z" fill="#a9baa9"/><path d="M155 390h300" stroke="#6095ac" stroke-width="4" stroke-dasharray="9 6"/><text x="35" y="275" font-size="24">Unchanged area</text><path d="M120 280l95 35" stroke="#527c6d" stroke-width="3"/><text x="430" y="360" font-size="23">Wet area</text><path d="M425 365l-40 45" stroke="#527c6d" stroke-width="3"/><text x="40" y="530" font-size="23">Appearance, integrity and bond are separate.</text><text x="28" y="568" font-size="21">Conceptual wet appearance; no exposure or result measured.</text></g></svg>