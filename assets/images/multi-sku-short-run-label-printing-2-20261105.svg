<svg xmlns="http://www.w3.org/2000/svg" width="660" height="600" viewBox="0 0 660 600"><title>Shared stock is counted only once</title><rect width="660" height="600" fill="#edf4ef"/><g font-family="Arial" fill="#12304a"><text x="30" y="48" font-size="29" font-weight="bold">Shared stock is counted only once</text><rect x="55" y="110" width="550" height="100" rx="12" fill="white"/><text x="85" y="170" font-size="28">1,200 common bases for the whole plan</text><path d="M330 215v45M170 260h320M170 260v35M490 260v35" fill="none" stroke="#527c6d" stroke-width="4"/><rect x="40" y="300" width="270" height="130" rx="12" fill="white"/><rect x="350" y="300" width="270" height="130" rx="12" fill="white"/><text x="65" y="345" font-size="26">A: 500 possible</text><text x="65" y="390" font-size="23">Demand700; labels500</text><text x="375" y="345" font-size="26">B: 500 planned</text><text x="375" y="390" font-size="23">Demand500; labels700</text><text x="45" y="490" font-size="26">1,000 packs use 1,000 common bases.</text><text x="45" y="530" font-size="23">200 unused bases cannot replace missing A labels.</text><text x="30" y="570" font-size="21">Invented quantities; no losses, prices or supplier offer assumed.</text></g></svg>