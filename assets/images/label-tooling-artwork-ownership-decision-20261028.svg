<svg xmlns="http://www.w3.org/2000/svg" width="640" height="1298" viewBox="0 0 640 1298" role="img" aria-labelledby="title desc"><title id="title">Received does not yet mean usable</title><desc id="desc">Rights, resource completeness and technical suitability are separate gates. File opening is not print approval.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10z" fill="#52798c"/></marker></defs><rect width="640" height="1298" fill="#f5f8fa"/><g font-family="Arial,Helvetica,sans-serif"><rect width="640" height="185" fill="#163d4b"/><text x="28" y="33" font-size="18" fill="#9ee2ce" font-weight="700"><tspan x="28" dy="0">ZFU LABELS / BUYER DECISION</tspan></text><text x="28" y="83" font-size="31" fill="#ffffff" font-weight="700"><tspan x="28" dy="0">Received does not yet mean usable</tspan></text><rect x="24" y="210" width="282" height="151" rx="15" fill="#ffffff" stroke="#becfd8" stroke-width="2"/><text x="42" y="244" font-size="24" fill="#126d65" font-weight="700"><tspan x="42" dy="0">FILE SET</tspan></text><text x="42" y="283" font-size="22" fill="#243b53" font-weight="400"><tspan x="42" dy="0">Identity + permitted</tspan><tspan x="42" dy="29">resources</tspan></text><rect x="334" y="210" width="282" height="151" rx="15" fill="#ffffff" stroke="#becfd8" stroke-width="2"/><text x="352" y="244" font-size="24" fill="#126d65" font-weight="700"><tspan x="352" dy="0">PHYSICAL TOOL</tspan></text><text x="352" y="283" font-size="22" fill="#243b53" font-weight="400"><tspan x="352" dy="0">Identity + condition</tspan><tspan x="352" dy="29">+ compatibility</tspan></text><path d="M165 361 L270 406" fill="none" stroke="#52798c" stroke-width="3" marker-end="url(#arrow)"/><path d="M475 361 L370 406" fill="none" stroke="#52798c" stroke-width="3" marker-end="url(#arrow)"/><rect x="40" y="406" width="560" height="159" rx="15" fill="#e7f2f7" stroke="#becfd8" stroke-width="2"/><text x="58" y="440" font-size="26" fill="#126d65" font-weight="700"><tspan x="58" dy="0">RECEIVING TASK</tspan></text><text x="58" y="481" font-size="25" fill="#243b53" font-weight="400"><tspan x="58" dy="0">View, authorized edit or production</tspan><tspan x="58" dy="32">preparation? Name the task.</tspan></text><rect x="40" y="605" width="560" height="191" rx="15" fill="#fff0eb" stroke="#becfd8" stroke-width="2"/><text x="58" y="639" font-size="26" fill="#126d65" font-weight="700"><tspan x="58" dy="0">GAP → RESOLVE / ADAPT</tspan></text><text x="58" y="680" font-size="25" fill="#243b53" font-weight="400"><tspan x="58" dy="0">Identify missing dependencies. Give an</tspan><tspan x="58" dy="32">adapted output its own revision and</tspan><tspan x="58" dy="32">approval.</tspan></text><rect x="40" y="821" width="560" height="159" rx="15" fill="#e9f7ee" stroke="#becfd8" stroke-width="2"/><text x="58" y="855" font-size="26" fill="#126d65" font-weight="700"><tspan x="58" dy="0">SUPPORTED TASK → RECORD SCOPE</tspan></text><text x="58" y="896" font-size="25" fill="#243b53" font-weight="400"><tspan x="58" dy="0">Usable for the defined task; other</tspan><tspan x="58" dy="32">approvals remain distinct.</tspan></text><rect x="24" y="1005" width="592" height="223" rx="15" fill="#f0f4f6" stroke="#becfd8" stroke-width="2"/><text x="42" y="1039" font-size="26" fill="#126d65" font-weight="700"><tspan x="42" dy="0">SCOPE / OPEN CONDITION</tspan></text><text x="42" y="1080" font-size="25" fill="#243b53" font-weight="400"><tspan x="42" dy="0">Rights, resource completeness and</tspan><tspan x="42" dy="32">technical suitability are separate</tspan><tspan x="42" dy="32">gates. File opening is not print</tspan><tspan x="42" dy="32">approval.</tspan></text><text x="28" y="1275" font-size="18" fill="#526979" font-weight="400"><tspan x="28" dy="0">Editorial planning aid • use with the article worksheet</tspan></text></g></svg>