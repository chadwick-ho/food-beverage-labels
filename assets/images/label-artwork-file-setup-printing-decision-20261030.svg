<svg xmlns="http://www.w3.org/2000/svg" width="640" height="1000" viewBox="0 0 640 1000" role="img" aria-label="The same pixels at two printed sizes"><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8Z" fill="#486e80"/></marker></defs><g font-family="Arial, sans-serif"><rect x="0" y="0" width="640" height="1000" rx="0" fill="#f2f7fa" stroke="#a5becb" stroke-width="2"/><rect x="0" y="0" width="640" height="190" rx="0" fill="#173e4b" stroke="#173e4b" stroke-width="2"/><text x="30" y="35" fill="#a4e1d0" font-size="18" font-weight="700"><tspan x="30" dy="0">ZFU LABELS / PURCHASING DIAGRAM</tspan></text><text x="30" y="88" fill="#fff" font-size="32" font-weight="700"><tspan x="30" dy="0">The same pixels at two printed</tspan><tspan x="30" dy="40">sizes</tspan></text><text x="34" y="235" fill="#213b4c" font-size="25" font-weight="700"><tspan x="34" dy="0">SAME ORIGINAL: 1,200 PIXELS WIDE</tspan></text><rect x="50" y="280" width="250" height="130" rx="14" fill="#c9e8e0" stroke="#a5becb" stroke-width="2"/><text x="66" y="327" fill="#213b4c" font-size="26" font-weight="700"><tspan x="66" dy="0">50.8 mm / 2 in</tspan></text><text x="66" y="371" fill="#213b4c" font-size="29" font-weight="700"><tspan x="66" dy="0">600 PPI</tspan></text><path d="M50 432 L300 432" fill="none" stroke="#486e80" stroke-width="3"/><path d="M50 424 L50 440" fill="none" stroke="#486e80" stroke-width="3"/><path d="M300 424 L300 440" fill="none" stroke="#486e80" stroke-width="3"/><rect x="50" y="497" width="500" height="186" rx="14" fill="#c9e8e0" stroke="#a5becb" stroke-width="2"/><text x="69" y="545" fill="#213b4c" font-size="28" font-weight="700"><tspan x="69" dy="0">101.6 mm / 4 in</tspan></text><text x="69" y="596" fill="#213b4c" font-size="32" font-weight="700"><tspan x="69" dy="0">300 PPI</tspan></text><text x="69" y="643" fill="#213b4c" font-size="24" font-weight="400"><tspan x="69" dy="0">Twice the width; half the PPI.</tspan></text><path d="M50 708 L550 708" fill="none" stroke="#486e80" stroke-width="3"/><path d="M50 700 L50 716" fill="none" stroke="#486e80" stroke-width="3"/><path d="M550 700 L550 716" fill="none" stroke="#486e80" stroke-width="3"/><rect x="34" y="758" width="572" height="161" rx="14" fill="#fff1de" stroke="#a5becb" stroke-width="2"/><text x="54" y="798" fill="#213b4c" font-size="27" font-weight="700"><tspan x="54" dy="0">PPI = pixels / placed inches</tspan></text><text x="54" y="845" fill="#213b4c" font-size="25" font-weight="400"><tspan x="54" dy="0">Arithmetic only. The printer sets the</tspan><tspan x="54" dy="33">actual image requirement.</tspan></text><text x="30" y="975" fill="#4b6473" font-size="18" font-weight="400"><tspan x="30" dy="0">Planning example / no customer result or acceptance limit</tspan></text></g></svg>