<svg xmlns="http://www.w3.org/2000/svg" width="660" height="900" viewBox="0 0 660 900"><title>Plan the identifier transition</title><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#527c6d"/></marker></defs><rect width="660" height="900" fill="#edf4ef"/><g font-family="Arial, sans-serif" fill="#12304a"><text x="30" y="48" font-size="30" font-weight="bold">Plan the identifier transition</text><text x="30" y="95" font-size="21">Do not let a new PDF define the stock boundary</text><path d="M330 275L330 315" stroke="#527c6d" stroke-width="4" marker-end="url(#arrow)"/><path d="M330 455L170 495" stroke="#527c6d" stroke-width="4" marker-end="url(#arrow)"/><path d="M330 455L490 495" stroke="#527c6d" stroke-width="4" marker-end="url(#arrow)"/><path d="M170 680L230 730" stroke="#527c6d" stroke-width="4" marker-end="url(#arrow)"/><path d="M490 680L430 730" stroke="#527c6d" stroke-width="4" marker-end="url(#arrow)"/><rect x="30" y="145" width="600" height="130" rx="14" fill="white" stroke="#aac4b8" stroke-width="2"/><text x="48" y="182" font-size="26" font-weight="bold">Product owner</text><text x="48" y="220" font-size="24">Confirm the actual old/new attributes.</text><rect x="30" y="325" width="600" height="130" rx="14" fill="white" stroke="#aac4b8" stroke-width="2"/><text x="48" y="362" font-size="26" font-weight="bold">Master-data owner</text><text x="48" y="400" font-size="24">Document the applicable identifier outcome.</text><rect x="30" y="505" width="280" height="175" rx="14" fill="white" stroke="#aac4b8" stroke-width="2"/><text x="48" y="542" font-size="26" font-weight="bold">Artwork owner</text><text x="48" y="580" font-size="24">Use the approved</text><text x="48" y="614" font-size="24">complete value.</text><text x="48" y="648" font-size="24">Check the export.</text><rect x="350" y="505" width="280" height="175" rx="14" fill="white" stroke="#aac4b8" stroke-width="2"/><text x="368" y="542" font-size="26" font-weight="bold">Operations owner</text><text x="368" y="580" font-size="24">Identify old/new</text><text x="368" y="614" font-size="24">inventory and</text><text x="368" y="648" font-size="24">packing boundary.</text><rect x="30" y="740" width="600" height="110" rx="14" fill="white" stroke="#aac4b8" stroke-width="2"/><text x="48" y="777" font-size="26" font-weight="bold">Final cross-check</text><text x="48" y="815" font-size="24">Product, ID, artwork and quantity agree.</text></g></svg>