<svg xmlns="http://www.w3.org/2000/svg" width="660" height="900" viewBox="0 0 660 900"><title>Record three separate outcomes</title><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#527c6d"/></marker></defs><rect width="660" height="900" fill="#edf4ef"/><g font-family="Arial, sans-serif" fill="#12304a"><text x="30" y="48" font-size="30" font-weight="bold">Record three separate outcomes</text><text x="30" y="95" font-size="21">Use the actual agreed roll, pack and application method</text><path d="M330 275L330 320" stroke="#527c6d" stroke-width="4" marker-end="url(#arrow)"/><path d="M330 460L330 505" stroke="#527c6d" stroke-width="4" marker-end="url(#arrow)"/><path d="M330 645L330 700" stroke="#527c6d" stroke-width="4" marker-end="url(#arrow)"/><rect x="30" y="145" width="600" height="130" rx="14" fill="white" stroke="#aac4b8" stroke-width="2"/><text x="48" y="182" font-size="26" font-weight="bold">1. Release from the backing</text><text x="48" y="220" font-size="24">Identify the construction and dispensing result.</text><rect x="30" y="330" width="600" height="130" rx="14" fill="white" stroke="#aac4b8" stroke-width="2"/><text x="48" y="367" font-size="26" font-weight="bold">2. Transfer and initial placement</text><text x="48" y="405" font-size="24">Observe the real application and pack condition.</text><rect x="30" y="515" width="600" height="130" rx="14" fill="white" stroke="#aac4b8" stroke-width="2"/><text x="48" y="552" font-size="26" font-weight="bold">3. Bond through intended handling</text><text x="48" y="590" font-size="24">Inspect the relevant later package-use result.</text><rect x="30" y="710" width="600" height="145" rx="14" fill="white" stroke="#aac4b8" stroke-width="2"/><text x="48" y="747" font-size="26" font-weight="bold">Keep each conclusion within its evidence</text><text x="48" y="785" font-size="24">A hand-pressed swatch leaves line transfer open.</text><text x="48" y="819" font-size="24">A line trial does not approve every later exposure.</text></g></svg>