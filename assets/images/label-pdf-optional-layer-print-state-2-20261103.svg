<svg xmlns="http://www.w3.org/2000/svg" width="660" height="900" viewBox="0 0 660 900"><title>Identify the object before changing it</title><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#527c6d"/></marker></defs><rect width="660" height="900" fill="#edf4ef"/><g font-family="Arial, sans-serif" fill="#12304a"><text x="30" y="48" font-size="30" font-weight="bold">Identify the object before changing it</text><text x="30" y="95" font-size="21">Different content roles need different handling</text><path d="M330 275L170 315" stroke="#527c6d" stroke-width="4" marker-end="url(#arrow)"/><path d="M330 275L490 315" stroke="#527c6d" stroke-width="4" marker-end="url(#arrow)"/><path d="M170 510L230 565" stroke="#527c6d" stroke-width="4" marker-end="url(#arrow)"/><path d="M490 510L430 565" stroke="#527c6d" stroke-width="4" marker-end="url(#arrow)"/><path d="M330 695L330 745" stroke="#527c6d" stroke-width="4" marker-end="url(#arrow)"/><rect x="30" y="145" width="600" height="130" rx="14" fill="white" stroke="#aac4b8" stroke-width="2"/><text x="48" y="182" font-size="26" font-weight="bold">What is the disputed object?</text><text x="48" y="220" font-size="24">Optional content, artwork, note or separation?</text><rect x="30" y="325" width="280" height="185" rx="14" fill="white" stroke="#aac4b8" stroke-width="2"/><text x="48" y="362" font-size="26" font-weight="bold">Visible print art</text><text x="48" y="400" font-size="24">Confirm accepted</text><text x="48" y="434" font-size="24">content and</text><text x="48" y="468" font-size="24">released variant.</text><rect x="350" y="325" width="280" height="185" rx="14" fill="white" stroke="#aac4b8" stroke-width="2"/><text x="368" y="362" font-size="26" font-weight="bold">Technical / review</text><text x="368" y="400" font-size="24">Agree its separate</text><text x="368" y="434" font-size="24">or nonprinting</text><text x="368" y="468" font-size="24">treatment.</text><rect x="30" y="575" width="600" height="120" rx="14" fill="white" stroke="#aac4b8" stroke-width="2"/><text x="48" y="612" font-size="26" font-weight="bold">Receiving-workflow check</text><text x="48" y="650" font-size="24">Compare actual output with the intended map.</text><rect x="30" y="755" width="600" height="90" rx="14" fill="white" stroke="#aac4b8" stroke-width="2"/><text x="48" y="792" font-size="26" font-weight="bold">Corrected export is checked again</text></g></svg>