<svg xmlns="http://www.w3.org/2000/svg" width="760" height="600" viewBox="0 0 760 600"><title>Possible set-off contact between adjacent printed turns</title><rect width="760" height="600" fill="#eff5f1"/><g font-family="Arial" fill="#12304a"><text x="35" y="55" font-size="30" font-weight="bold">Map the surfaces that actually touched</text><rect x="70" y="160" width="590" height="80" fill="#c4dbd0"/><text x="95" y="210" font-size="25">Adjacent turn: identified reverse surface</text><path d="M95 280H635" stroke="#b1684b" stroke-width="5" stroke-dasharray="14 9"/><text x="95" y="325" font-size="24">Contact between the two surfaces</text><rect x="70" y="370" width="590" height="85" fill="white" stroke="#416c5b"/><text x="95" y="420" font-size="25">Printed face of the neighboring turn</text><text x="35" y="520" font-size="22">A liner changes which surface contacts the printed face.</text><text x="35" y="565" font-size="21">Conceptual contact map · no transfer or migration result</text></g></svg>