<svg xmlns="http://www.w3.org/2000/svg" width="660" height="570" viewBox="0 0 660 570"><title>The same number format|can hide different conditions</title><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#527c6d"/></marker></defs><rect width="660" height="570" fill="#edf4ef"/><g font-family="Arial, sans-serif" fill="#12304a"><text x="30" y="48" font-size="30" font-weight="bold">The same number format</text><text x="30" y="88" font-size="30" font-weight="bold">can hide different conditions</text><text x="30" y="135" font-size="21">Lab values need an identified measurement context</text><path d="M170 330L240 380" stroke="#527c6d" stroke-width="4" marker-end="url(#arrow)"/><path d="M490 330L420 380" stroke="#527c6d" stroke-width="4" marker-end="url(#arrow)"/><rect x="30" y="180" width="280" height="150" rx="14" fill="white" stroke="#aac4b8" stroke-width="2"/><text x="48" y="217" font-size="26" font-weight="bold">Report A</text><text x="48" y="255" font-size="24">Reference + sample</text><text x="48" y="289" font-size="24">M condition?</text><rect x="350" y="180" width="280" height="150" rx="14" fill="white" stroke="#aac4b8" stroke-width="2"/><text x="368" y="217" font-size="26" font-weight="bold">Report B</text><text x="368" y="255" font-size="24">Reference + sample</text><text x="368" y="289" font-size="24">M condition?</text><rect x="30" y="390" width="600" height="120" rx="14" fill="white" stroke="#aac4b8" stroke-width="2"/><text x="48" y="427" font-size="26" font-weight="bold">Compare the setup first</text><text x="48" y="465" font-size="24">Do not treat M0 / M1 / M2 as quality grades.</text></g></svg>