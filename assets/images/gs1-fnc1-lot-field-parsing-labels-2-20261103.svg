<svg xmlns="http://www.w3.org/2000/svg" width="660" height="900" viewBox="0 0 660 900"><title>Locate the first disagreement</title><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#527c6d"/></marker></defs><rect width="660" height="900" fill="#edf4ef"/><g font-family="Arial, sans-serif" fill="#12304a"><text x="30" y="48" font-size="30" font-weight="bold">Locate the first disagreement</text><text x="30" y="95" font-size="21">Retain the original failing specimen</text><path d="M330 275L330 315" stroke="#527c6d" stroke-width="4" marker-end="url(#arrow)"/><path d="M330 455L330 495" stroke="#527c6d" stroke-width="4" marker-end="url(#arrow)"/><path d="M330 635L330 675" stroke="#527c6d" stroke-width="4" marker-end="url(#arrow)"/><rect x="30" y="145" width="600" height="130" rx="14" fill="white" stroke="#aac4b8" stroke-width="2"/><text x="48" y="182" font-size="26" font-weight="bold">1. Data owner</text><text x="48" y="220" font-size="24">Approve the field list and boundaries.</text><rect x="30" y="325" width="600" height="130" rx="14" fill="white" stroke="#aac4b8" stroke-width="2"/><text x="48" y="362" font-size="26" font-weight="bold">2. Generator and scanner owners</text><text x="48" y="400" font-size="24">Capture encoded and transmitted evidence.</text><rect x="30" y="505" width="600" height="130" rx="14" fill="white" stroke="#aac4b8" stroke-width="2"/><text x="48" y="542" font-size="26" font-weight="bold">3. Receiving-system owner</text><text x="48" y="580" font-size="24">Compare the actual parsed fields.</text><rect x="30" y="685" width="600" height="150" rx="14" fill="white" stroke="#aac4b8" stroke-width="2"/><text x="48" y="722" font-size="26" font-weight="bold">4. Joint release</text><text x="48" y="760" font-size="24">Resolve the first divergence; freeze the test.</text><text x="48" y="794" font-size="24">Print quality remains a separate check.</text></g></svg>