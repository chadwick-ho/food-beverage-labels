<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="t d"><title id="t">Food label artwork review illustration</title><desc id="d">An illustrated sample label with black text, separate color chips, and a review sheet. It does not depict a real printed job.</desc><rect width="1200" height="675" fill="#ecf3f0"/><rect x="80" y="60" width="610" height="550" rx="20" fill="#fff" stroke="#b7cdc5" stroke-width="4"/><rect x="112" y="90" width="546" height="100" rx="8" fill="#df684d"/><text x="145" y="154" font-family="Arial,sans-serif" font-size="45" fill="#fff" font-weight="bold">ARTWORK REVIEW</text><text x="145" y="255" font-family="Arial,sans-serif" font-size="34" fill="#12304a">Food label · planning example</text><rect x="145" y="295" width="470" height="9" fill="#263b3a"/><rect x="145" y="329" width="420" height="9" fill="#263b3a"/><rect x="145" y="363" width="445" height="9" fill="#263b3a"/><rect x="145" y="425" width="365" height="95" rx="8" fill="#e5eee9"/><text x="165" y="482" font-family="Arial,sans-serif" font-size="25" fill="#12304a">Text + background + output</text><rect x="755" y="93" width="340" height="240" rx="18" fill="#fff"/><text x="785" y="145" font-family="Arial,sans-serif" font-size="25" fill="#12304a">CHECK THE FILE</text><circle cx="810" cy="205" r="25" fill="#36a6c6"/><circle cx="875" cy="205" r="25" fill="#db5f99"/><circle cx="940" cy="205" r="25" fill="#efcd53"/><circle cx="1005" cy="205" r="25" fill="#23393a"/><text x="785" y="273" font-family="Arial,sans-serif" font-size="22" fill="#34524c">Separate color plates</text><rect x="755" y="370" width="340" height="180" rx="18" fill="#12304a"/><text x="785" y="425" font-family="Arial,sans-serif" font-size="26" fill="#fff">Preview is a check,</text><text x="785" y="465" font-family="Arial,sans-serif" font-size="26" fill="#fff">not a press result.</text><text x="785" y="510" font-family="Arial,sans-serif" font-size="20" fill="#c8d9d2">Illustrative artwork only</text></svg>