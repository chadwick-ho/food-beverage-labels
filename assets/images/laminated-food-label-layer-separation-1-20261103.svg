<svg xmlns="http://www.w3.org/2000/svg" width="760" height="600" viewBox="0 0 760 600"><title>Layer separation in a laminated food label</title><rect width="760" height="600" fill="#eff5f1"/><g font-family="Arial" fill="#12304a"><text x="35" y="55" font-size="30" font-weight="bold">Which bond is separating?</text><rect x="80" y="185" width="570" height="60" fill="#bcd8cf"/><text x="105" y="224" font-size="26">Added protective film</text><path d="M80 245H650" stroke="#9b5a41" stroke-width="8" stroke-dasharray="15 8"/><text x="105" y="285" font-size="24">Possible interlayer separation</text><rect x="80" y="320" width="570" height="60" fill="white" stroke="#416c5b"/><text x="105" y="360" font-size="26">Printed face material</text><rect x="80" y="400" width="570" height="35" fill="#e3cfaa"/><text x="105" y="470" font-size="24">Package adhesive below the face</text><path d="M80 500H650" stroke="#416c5b" stroke-width="12"/><text x="105" y="545" font-size="24">Bottle surface · layers not to scale</text></g></svg>