<svg xmlns="http://www.w3.org/2000/svg" width="760" height="600" viewBox="0 0 760 600"><title>Two foil finishing routes for a wine label</title><rect width="760" height="600" fill="#eff5f1"/><g font-family="Arial" fill="#12304a"><text x="35" y="55" font-size="30" font-weight="bold">Same metallic request, different route questions</text><rect x="45" y="145" width="310" height="290" rx="18" fill="white"/><rect x="405" y="145" width="310" height="290" rx="18" fill="white"/><text x="85" y="195" font-size="29" font-weight="bold">Hot stamping</text><path d="M120 235H285V290H120Z" fill="#d9b875"/><path d="M145 315V360 M230 315V360" stroke="#9b5a41" stroke-width="5"/><text x="85" y="405" font-size="23">Heated die + pressure</text><text x="445" y="195" font-size="29" font-weight="bold">Cold transfer</text><circle cx="500" cy="265" r="35" fill="#d9b875"/><circle cx="615" cy="265" r="35" fill="#bcd8cf"/><path d="M465 330H650" stroke="#416c5b" stroke-width="8"/><text x="435" y="405" font-size="23">Route-specific material set</text><text x="35" y="515" font-size="24">Compare stock, artwork, layer order and the physical sample.</text><text x="35" y="565" font-size="21">Process concepts only · not press settings or sample results</text></g></svg>