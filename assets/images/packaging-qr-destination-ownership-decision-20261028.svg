<svg xmlns="http://www.w3.org/2000/svg" width="640" height="1338" viewBox="0 0 640 1338" role="img" aria-labelledby="title desc"><title id="title">Test the address already on the pack</title><desc id="desc">A fallback is only available if the actual system and agreement support it. A new page alone cannot rescue an uncontrolled printed route.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10z" fill="#52798c"/></marker></defs><rect width="640" height="1338" fill="#f5f8fa"/><g font-family="Arial,Helvetica,sans-serif"><rect width="640" height="185" fill="#163d4b"/><text x="28" y="33" font-size="18" fill="#9ee2ce" font-weight="700"><tspan x="28" dy="0">ZFU LABELS / BUYER DECISION</tspan></text><text x="28" y="83" font-size="31" fill="#ffffff" font-weight="700"><tspan x="28" dy="0">Test the address already on the</tspan><tspan x="28" dy="38">pack</tspan></text><rect x="40" y="210" width="560" height="159" rx="15" fill="#ffffff" stroke="#becfd8" stroke-width="2"/><text x="58" y="244" font-size="26" fill="#126d65" font-weight="700"><tspan x="58" dy="0">UNCHANGED PRINTED ADDRESS</tspan></text><text x="58" y="285" font-size="25" fill="#243b53" font-weight="400"><tspan x="58" dy="0">Start with exact decoded content, not</tspan><tspan x="58" dy="32">the new page URL.</tspan></text><path d="M320 371 L320 402" fill="none" stroke="#52798c" stroke-width="3" marker-end="url(#arrow)"/><rect x="40" y="413" width="560" height="159" rx="15" fill="#ffffff" stroke="#becfd8" stroke-width="2"/><text x="58" y="447" font-size="26" fill="#126d65" font-weight="700"><tspan x="58" dy="0">CONTROLLED ROUTING STEP</tspan></text><text x="58" y="488" font-size="25" fill="#243b53" font-weight="400"><tspan x="58" dy="0">Actual provider/domain authority and</tspan><tspan x="58" dy="32">product-specific rule</tspan></text><path d="M320 574 L320 605" fill="none" stroke="#52798c" stroke-width="3" marker-end="url(#arrow)"/><rect x="40" y="616" width="560" height="159" rx="15" fill="#ffffff" stroke="#becfd8" stroke-width="2"/><text x="58" y="650" font-size="26" fill="#126d65" font-weight="700"><tspan x="58" dy="0">PROPOSED CONSUMER RESULT</tspan></text><text x="58" y="691" font-size="25" fill="#243b53" font-weight="400"><tspan x="58" dy="0">Anonymous access to correct product,</tspan><tspan x="58" dy="32">version and language</tspan></text><rect x="40" y="819" width="560" height="191" rx="15" fill="#fff0eb" stroke="#becfd8" stroke-width="2"/><text x="58" y="853" font-size="26" fill="#126d65" font-weight="700"><tspan x="58" dy="0">FAILURE BRANCH</tspan></text><text x="58" y="894" font-size="25" fill="#243b53" font-weight="400"><tspan x="58" dy="0">Use an agreed feasible</tspan><tspan x="58" dy="32">revert/fallback. If none exists,</tspan><tspan x="58" dy="32">record that before accepting cutover.</tspan></text><rect x="24" y="1045" width="592" height="223" rx="15" fill="#f0f4f6" stroke="#becfd8" stroke-width="2"/><text x="42" y="1079" font-size="26" fill="#126d65" font-weight="700"><tspan x="42" dy="0">SCOPE / OPEN CONDITION</tspan></text><text x="42" y="1120" font-size="25" fill="#243b53" font-weight="400"><tspan x="42" dy="0">A fallback is only available if the</tspan><tspan x="42" dy="32">actual system and agreement support it.</tspan><tspan x="42" dy="32">A new page alone cannot rescue an</tspan><tspan x="42" dy="32">uncontrolled printed route.</tspan></text><text x="28" y="1315" font-size="18" fill="#526979" font-weight="400"><tspan x="28" dy="0">Editorial planning aid • use with the article worksheet</tspan></text></g></svg>