<svg xmlns="http://www.w3.org/2000/svg" width="660" height="510" viewBox="0 0 660 510"><title>A recyclable message needs a boundary</title><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#527c6d"/></marker></defs><rect width="660" height="510" fill="#edf4ef"/><g font-family="Arial, sans-serif" fill="#12304a"><text x="30" y="48" font-size="30" font-weight="bold">A recyclable message needs a boundary</text><text x="30" y="95" font-size="21">Object, construction and market must agree</text><path d="M330 245L170 290" stroke="#527c6d" stroke-width="4" marker-end="url(#arrow)"/><path d="M330 245L490 290" stroke="#527c6d" stroke-width="4" marker-end="url(#arrow)"/><rect x="30" y="145" width="600" height="100" rx="14" fill="white" stroke="#aac4b8" stroke-width="2"/><text x="48" y="182" font-size="26" font-weight="bold">Which object?</text><text x="48" y="220" font-size="24">Label / container / closure / complete pack</text><rect x="30" y="300" width="280" height="150" rx="14" fill="white" stroke="#aac4b8" stroke-width="2"/><text x="48" y="337" font-size="26" font-weight="bold">Technical route</text><text x="48" y="375" font-size="24">Construction</text><text x="48" y="409" font-size="24">compatibility</text><rect x="350" y="300" width="280" height="150" rx="14" fill="white" stroke="#aac4b8" stroke-width="2"/><text x="368" y="337" font-size="26" font-weight="bold">Practical access</text><text x="368" y="375" font-size="24">Sales geography</text><text x="368" y="409" font-size="24">and collection</text></g></svg>