<svg xmlns="http://www.w3.org/2000/svg" width="640" height="1120" viewBox="0 0 640 1120" role="img" aria-label="A shared repeat creates a fixed SKU ratio"><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8Z" fill="#486e80"/></marker></defs><g font-family="Arial, sans-serif"><rect x="0" y="0" width="640" height="1120" rx="0" fill="#f2f7fa" stroke="#a5becb" stroke-width="2"/><rect x="0" y="0" width="640" height="190" rx="0" fill="#173e4b" stroke="#173e4b" stroke-width="2"/><text x="30" y="35" fill="#a4e1d0" font-size="18" font-weight="700"><tspan x="30" dy="0">ZFU LABELS / PURCHASING DIAGRAM</tspan></text><text x="30" y="88" fill="#fff" font-size="32" font-weight="700"><tspan x="30" dy="0">A shared repeat creates a fixed</tspan><tspan x="30" dy="40">SKU ratio</tspan></text><text x="34" y="240" fill="#213b4c" font-size="27" font-weight="700"><tspan x="34" dy="0">ONE FICTIONAL REPEAT</tspan></text><rect x="34" y="275" width="178" height="130" rx="14" fill="#c9e8e0" stroke="#a5becb" stroke-width="2"/><text x="101" y="356" fill="#213b4c" font-size="48" font-weight="700"><tspan x="101" dy="0">A</tspan></text><rect x="231" y="275" width="178" height="130" rx="14" fill="#c9e8e0" stroke="#a5becb" stroke-width="2"/><text x="298" y="356" fill="#213b4c" font-size="48" font-weight="700"><tspan x="298" dy="0">A</tspan></text><rect x="428" y="275" width="178" height="130" rx="14" fill="#ffdf9f" stroke="#a5becb" stroke-width="2"/><text x="495" y="356" fill="#213b4c" font-size="48" font-weight="700"><tspan x="495" dy="0">B</tspan></text><text x="34" y="467" fill="#213b4c" font-size="31" font-weight="700"><tspan x="34" dy="0">1,500 complete repeats</tspan></text><rect x="34" y="525" width="572" height="180" rx="14" fill="#fff" stroke="#a5becb" stroke-width="2"/><text x="54" y="564" fill="#213b4c" font-size="27" font-weight="700"><tspan x="54" dy="0">SKU A</tspan></text><text x="54" y="611" fill="#213b4c" font-size="27" font-weight="400"><tspan x="54" dy="0">Need: 3,000</tspan></text><text x="310" y="611" fill="#213b4c" font-size="27" font-weight="400"><tspan x="310" dy="0">Created: 3,000</tspan></text><text x="54" y="657" fill="#213b4c" font-size="24" font-weight="400"><tspan x="54" dy="0">Matches this stated requirement.</tspan></text><rect x="34" y="723" width="572" height="180" rx="14" fill="#fff1de" stroke="#a5becb" stroke-width="2"/><text x="54" y="762" fill="#213b4c" font-size="27" font-weight="700"><tspan x="54" dy="0">SKU B</tspan></text><text x="54" y="809" fill="#213b4c" font-size="27" font-weight="400"><tspan x="54" dy="0">Need: 1,000</tspan></text><text x="310" y="809" fill="#213b4c" font-size="27" font-weight="400"><tspan x="310" dy="0">Created: 1,500</tspan></text><text x="54" y="855" fill="#213b4c" font-size="24" font-weight="400"><tspan x="54" dy="0">500 additional B need an inventory</tspan><tspan x="54" dy="32">decision.</tspan></text><text x="34" y="948" fill="#213b4c" font-size="25" font-weight="400"><tspan x="34" dy="0">Ask for supported alternatives and actual</tspan><tspan x="34" dy="33">costs. No layout availability is assumed.</tspan></text><text x="30" y="1095" fill="#4b6473" font-size="18" font-weight="400"><tspan x="30" dy="0">Planning example / no customer result or acceptance limit</tspan></text></g></svg>