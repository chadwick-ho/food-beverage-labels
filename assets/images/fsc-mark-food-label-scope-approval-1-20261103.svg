<svg xmlns="http://www.w3.org/2000/svg" width="660" height="550" viewBox="0 0 660 550"><title>What does this mark refer to?</title><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#527c6d"/></marker></defs><rect width="660" height="550" fill="#edf4ef"/><g font-family="Arial, sans-serif" fill="#12304a"><text x="30" y="48" font-size="30" font-weight="bold">What does this mark refer to?</text><text x="30" y="95" font-size="21">Do not let placement imply a broader claim</text><path d="M170 300L230 350" stroke="#527c6d" stroke-width="4" marker-end="url(#arrow)"/><path d="M490 300L430 350" stroke="#527c6d" stroke-width="4" marker-end="url(#arrow)"/><rect x="30" y="145" width="280" height="155" rx="14" fill="white" stroke="#aac4b8" stroke-width="2"/><text x="48" y="182" font-size="26" font-weight="bold">Paper label</text><text x="48" y="220" font-size="24">Exact item</text><text x="48" y="254" font-size="24">and supplier</text><rect x="350" y="145" width="280" height="155" rx="14" fill="white" stroke="#aac4b8" stroke-width="2"/><text x="368" y="182" font-size="26" font-weight="bold">Outer carton</text><text x="368" y="220" font-size="24">Separate item</text><text x="368" y="254" font-size="24">and supplier</text><rect x="30" y="360" width="600" height="130" rx="14" fill="white" stroke="#aac4b8" stroke-width="2"/><text x="48" y="397" font-size="26" font-weight="bold">Approval must identify the item</text><text x="48" y="435" font-size="24">A record for one component</text><text x="48" y="469" font-size="24">does not approve another automatically.</text></g></svg>