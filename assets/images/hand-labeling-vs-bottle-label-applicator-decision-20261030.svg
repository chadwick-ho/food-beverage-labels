<svg xmlns="http://www.w3.org/2000/svg" width="640" height="1030" viewBox="0 0 640 1030" role="img" aria-label="A faster station can leave the same bottleneck"><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8Z" fill="#486e80"/></marker></defs><g font-family="Arial, sans-serif"><rect x="0" y="0" width="640" height="1030" rx="0" fill="#f2f7fa" stroke="#a5becb" stroke-width="2"/><rect x="0" y="0" width="640" height="190" rx="0" fill="#173e4b" stroke="#173e4b" stroke-width="2"/><text x="30" y="35" fill="#a4e1d0" font-size="18" font-weight="700"><tspan x="30" dy="0">ZFU LABELS / PURCHASING DIAGRAM</tspan></text><text x="30" y="88" fill="#fff" font-size="32" font-weight="700"><tspan x="30" dy="0">A faster station can leave the</tspan><tspan x="30" dy="40">same bottleneck</tspan></text><rect x="34" y="225" width="572" height="144" rx="14" fill="#fff" stroke="#a5becb" stroke-width="2"/><text x="54" y="265" fill="#213b4c" font-size="26" font-weight="700"><tspan x="54" dy="0">FEED / PRESENTATION</tspan></text><text x="54" y="323" fill="#213b4c" font-size="35" font-weight="700"><tspan x="54" dy="0">40 packs/min</tspan></text><path d="M320 373 L320 407" fill="none" stroke="#486e80" stroke-width="3" marker-end="url(#arrow)"/><rect x="34" y="418" width="572" height="144" rx="14" fill="#fff" stroke="#a5becb" stroke-width="2"/><text x="54" y="458" fill="#213b4c" font-size="26" font-weight="700"><tspan x="54" dy="0">LABELING STATION</tspan></text><text x="54" y="516" fill="#213b4c" font-size="35" font-weight="700"><tspan x="54" dy="0">80 packs/min</tspan></text><path d="M320 566 L320 600" fill="none" stroke="#486e80" stroke-width="3" marker-end="url(#arrow)"/><rect x="34" y="611" width="572" height="144" rx="14" fill="#fff1de" stroke="#a5becb" stroke-width="2"/><text x="54" y="651" fill="#213b4c" font-size="26" font-weight="700"><tspan x="54" dy="0">DOWNSTREAM PACKING</tspan></text><text x="54" y="709" fill="#213b4c" font-size="35" font-weight="700"><tspan x="54" dy="0">30 packs/min</tspan></text><text x="34" y="813" fill="#213b4c" font-size="27" font-weight="700"><tspan x="34" dy="0">Illustrative independent-station</tspan><tspan x="34" dy="35">ceiling: no more than 30 packs/min.</tspan></text><text x="34" y="909" fill="#213b4c" font-size="24" font-weight="400"><tspan x="34" dy="0">Shared operator? Map the combined work</tspan><tspan x="34" dy="32">instead. These are not measured rates.</tspan></text><text x="30" y="1005" fill="#4b6473" font-size="18" font-weight="400"><tspan x="30" dy="0">Planning example / no customer result or acceptance limit</tspan></text></g></svg>