<svg xmlns="http://www.w3.org/2000/svg" width="640" height="1328" viewBox="0 0 640 1328" role="img" aria-labelledby="title desc"><title id="title">Illustrative balance: one state per piece</title><desc id="desc">Hypothetical counts, one component and time boundary. A category correction changes the unexplained balance, not the physical stock.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10z" fill="#52798c"/></marker></defs><rect width="640" height="1328" fill="#f5f8fa"/><g font-family="Arial,Helvetica,sans-serif"><rect width="640" height="185" fill="#163d4b"/><text x="28" y="33" font-size="18" fill="#9ee2ce" font-weight="700"><tspan x="28" dy="0">ZFU LABELS / BUYER DECISION</tspan></text><text x="28" y="83" font-size="31" fill="#ffffff" font-weight="700"><tspan x="28" dy="0">Illustrative balance: one state</tspan><tspan x="28" dy="38">per piece</tspan></text><rect x="40" y="210" width="560" height="159" rx="15" fill="#ffffff" stroke="#becfd8" stroke-width="2"/><text x="58" y="244" font-size="26" fill="#126d65" font-weight="700"><tspan x="58" dy="0">OPENING RECEIVED: 10,000</tspan></text><text x="58" y="285" font-size="25" fill="#243b53" font-weight="400"><tspan x="58" dy="0">One component, one agreed quantity</tspan><tspan x="58" dy="32">basis</tspan></text><path d="M320 371 L320 402" fill="none" stroke="#52798c" stroke-width="3" marker-end="url(#arrow)"/><rect x="40" y="413" width="560" height="159" rx="15" fill="#ffffff" stroke="#becfd8" stroke-width="2"/><text x="58" y="447" font-size="26" fill="#126d65" font-weight="700"><tspan x="58" dy="0">EXCLUSIVE KNOWN STATES: 9,950</tspan></text><text x="58" y="488" font-size="25" fill="#243b53" font-weight="400"><tspan x="58" dy="0">9,400 accepted + 120 setup + 30</tspan><tspan x="58" dy="32">inspected + 50 rejects + 350 remaining</tspan></text><path d="M320 574 L320 605" fill="none" stroke="#52798c" stroke-width="3" marker-end="url(#arrow)"/><rect x="40" y="616" width="560" height="159" rx="15" fill="#ffffff" stroke="#becfd8" stroke-width="2"/><text x="58" y="650" font-size="26" fill="#126d65" font-weight="700"><tspan x="58" dy="0">UNEXPLAINED: 50</tspan></text><text x="58" y="691" font-size="25" fill="#243b53" font-weight="400"><tspan x="58" dy="0">10,000 − 9,950 = 50. Keep the gap</tspan><tspan x="58" dy="32">visible.</tspan></text><rect x="40" y="819" width="560" height="191" rx="15" fill="#fff0eb" stroke="#becfd8" stroke-width="2"/><text x="58" y="853" font-size="26" fill="#126d65" font-weight="700"><tspan x="58" dy="0">20 REJECTS ALREADY INSPECTED</tspan></text><text x="58" y="894" font-size="25" fill="#243b53" font-weight="400"><tspan x="58" dy="0">Remove the duplicate deduction. Known</tspan><tspan x="58" dy="32">states become 9,930; unexplained</tspan><tspan x="58" dy="32">becomes 70.</tspan></text><rect x="24" y="1035" width="592" height="223" rx="15" fill="#f0f4f6" stroke="#becfd8" stroke-width="2"/><text x="42" y="1069" font-size="26" fill="#126d65" font-weight="700"><tspan x="42" dy="0">SCOPE / OPEN CONDITION</tspan></text><text x="42" y="1110" font-size="25" fill="#243b53" font-weight="400"><tspan x="42" dy="0">Hypothetical counts, one component and</tspan><tspan x="42" dy="32">time boundary. A category correction</tspan><tspan x="42" dy="32">changes the unexplained balance, not the</tspan><tspan x="42" dy="32">physical stock.</tspan></text><text x="28" y="1305" font-size="18" fill="#526979" font-weight="400"><tspan x="28" dy="0">Editorial planning aid • use with the article worksheet</tspan></text></g></svg>