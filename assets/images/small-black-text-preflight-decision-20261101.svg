<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 1040" role="img" aria-labelledby="t d"><title id="t">Four checks for black label text</title><desc id="d">Identify text, inspect separations, review overprint, and agree the proof and output with the printer.</desc><rect width="760" height="1040" fill="#f5f8f6"/><text x="45" y="72" font-family="Arial,sans-serif" font-size="36" font-weight="bold" fill="#12304a">Black text: release checks</text><text x="45" y="110" font-family="Arial,sans-serif" font-size="22" fill="#405d57">Editorial guide · not a production setting</text><g font-family="Arial,sans-serif" fill="#12304a"><rect x="45" y="145" width="670" height="165" rx="18" fill="#fff" stroke="#b7cdc5"/><text x="70" y="190" font-size="27" font-weight="bold">1 · Identify the object</text><text x="70" y="229" font-size="22">Text, fine line, large solid or barcode?</text><text x="70" y="266" font-size="22">Record size, substrate and background.</text><path d="M380 310v30" stroke="#437568" stroke-width="5"/><rect x="45" y="340" width="670" height="165" rx="18" fill="#fff" stroke="#b7cdc5"/><text x="70" y="385" font-size="27" font-weight="bold">2 · Inspect separations</text><text x="70" y="424" font-size="22">Which plates carry the object?</text><text x="70" y="461" font-size="22">Note unexpected extra colors or conversion.</text><path d="M380 505v30" stroke="#437568" stroke-width="5"/><rect x="45" y="535" width="670" height="165" rx="18" fill="#fff" stroke="#b7cdc5"/><text x="70" y="580" font-size="27" font-weight="bold">3 · Review overlap</text><text x="70" y="619" font-size="22">Compare overprint and knockout preview.</text><text x="70" y="656" font-size="22">Ask the printer about the actual process.</text><path d="M380 700v30" stroke="#437568" stroke-width="5"/><rect x="45" y="730" width="670" height="200" rx="18" fill="#fff" stroke="#b7cdc5"/><text x="70" y="775" font-size="27" font-weight="bold">4 · Agree the release</text><text x="70" y="814" font-size="22">Match revision, output and proof scope.</text><text x="70" y="851" font-size="22">Escalate unresolved text or barcode issues.</text><text x="70" y="888" font-size="22">A screen preview is not a press test.</text></g></svg>