<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 1040"><title>Missing print response checklist</title><rect width="760" height="1040" fill="#f2f7f4"/><g font-family="Arial" fill="#12304a"><text x="45" y="70" font-size="36" font-weight="bold">Missing print: response</text><text x="45" y="110" font-size="22">Editorial checklist · follow site procedures</text><rect x="45" y="145" width="670" height="165" rx="15" fill="#fff"/><text x="68" y="190" font-size="27" font-weight="bold">1 · Contain</text><text x="68" y="230" font-size="22">Flag affected output and notify the owner.</text><text x="68" y="270" font-size="22">Keep suspect and released stock separate.</text><path d="M380 310v30" stroke="#568374" stroke-width="5"/><rect x="45" y="340" width="670" height="165" rx="15" fill="#fff"/><text x="68" y="385" font-size="27" font-weight="bold">2 · Preserve evidence</text><text x="68" y="425" font-size="22">Record time, station, samples and lot.</text><text x="68" y="465" font-size="22">Mark what is unknown about the boundary.</text><path d="M380 505v30" stroke="#568374" stroke-width="5"/><rect x="45" y="535" width="670" height="165" rx="15" fill="#fff"/><text x="68" y="580" font-size="27" font-weight="bold">3 · Investigate safely</text><text x="68" y="620" font-size="22">Use the actual equipment guidance.</text><text x="68" y="660" font-size="22">Compare material, ribbon and output.</text><path d="M380 700v30" stroke="#568374" stroke-width="5"/><rect x="45" y="730" width="670" height="190" rx="15" fill="#fff"/><text x="68" y="775" font-size="27" font-weight="bold">4 · Restart with evidence</text><text x="68" y="815" font-size="22">Use defined checks and an authorized release.</text><text x="68" y="855" font-size="22">Trace reprints to the original records.</text><text x="68" y="895" font-size="22">A scan alone is not formal verification.</text></g></svg>