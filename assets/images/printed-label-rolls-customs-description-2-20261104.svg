<svg xmlns="http://www.w3.org/2000/svg" width="660" height="900" viewBox="0 0 660 900"><title>Describe the supplied article accurately</title><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#527c6d"/></marker></defs><rect width="660" height="900" fill="#edf4ef"/><g font-family="Arial, sans-serif" fill="#12304a"><text x="30" y="48" font-size="30" font-weight="bold">Describe the supplied article accurately</text><text x="30" y="95" font-size="21">The importer or broker determines classification</text><path d="M330 275L330 315" stroke="#527c6d" stroke-width="4" marker-end="url(#arrow)"/><path d="M330 455L170 495" stroke="#527c6d" stroke-width="4" marker-end="url(#arrow)"/><path d="M330 455L490 495" stroke="#527c6d" stroke-width="4" marker-end="url(#arrow)"/><path d="M170 680L230 735" stroke="#527c6d" stroke-width="4" marker-end="url(#arrow)"/><path d="M490 680L430 735" stroke="#527c6d" stroke-width="4" marker-end="url(#arrow)"/><rect x="30" y="145" width="600" height="130" rx="14" fill="white" stroke="#aac4b8" stroke-width="2"/><text x="48" y="182" font-size="26" font-weight="bold">Identify the actual material and format</text><text x="48" y="220" font-size="24">Finished label or stock; paper/film; roll/sheet.</text><rect x="30" y="325" width="600" height="130" rx="14" fill="white" stroke="#aac4b8" stroke-width="2"/><text x="48" y="362" font-size="26" font-weight="bold">Resolve ambiguous layer information</text><text x="48" y="400" font-size="24">Face, adhesive, liner and relevant finish.</text><rect x="30" y="505" width="280" height="175" rx="14" fill="white" stroke="#aac4b8" stroke-width="2"/><text x="48" y="542" font-size="26" font-weight="bold">Technical evidence</text><text x="48" y="580" font-size="24">Specification and</text><text x="48" y="614" font-size="24">actual sample</text><text x="48" y="648" font-size="24">if requested.</text><rect x="350" y="505" width="280" height="175" rx="14" fill="white" stroke="#aac4b8" stroke-width="2"/><text x="368" y="542" font-size="26" font-weight="bold">Customs decision</text><text x="368" y="580" font-size="24">Appropriate party</text><text x="368" y="614" font-size="24">confirms code and</text><text x="368" y="648" font-size="24">required evidence.</text><rect x="30" y="745" width="600" height="105" rx="14" fill="white" stroke="#aac4b8" stroke-width="2"/><text x="48" y="782" font-size="26" font-weight="bold">Reconcile documents before dispatch</text></g></svg>