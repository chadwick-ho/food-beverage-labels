<svg xmlns="http://www.w3.org/2000/svg" width="660" height="550" viewBox="0 0 660 550"><title>Two questions, separate decisions</title><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#527c6d"/></marker></defs><rect width="660" height="550" fill="#edf4ef"/><g font-family="Arial, sans-serif" fill="#12304a"><text x="30" y="48" font-size="30" font-weight="bold">Two questions, separate decisions</text><text x="30" y="95" font-size="21">Do not approve a gluten claim by deletion</text><path d="M170 330L240 380" stroke="#527c6d" stroke-width="4" marker-end="url(#arrow)"/><path d="M490 330L420 380" stroke="#527c6d" stroke-width="4" marker-end="url(#arrow)"/><rect x="30" y="145" width="280" height="185" rx="14" fill="white" stroke="#aac4b8" stroke-width="2"/><text x="48" y="182" font-size="26" font-weight="bold">Allergen copy</text><text x="48" y="220" font-size="24">Approved formula</text><text x="48" y="254" font-size="24">and applicable</text><text x="48" y="288" font-size="24">declaration review</text><rect x="350" y="145" width="280" height="185" rx="14" fill="white" stroke="#aac4b8" stroke-width="2"/><text x="368" y="182" font-size="26" font-weight="bold">Gluten-free claim</text><text x="368" y="220" font-size="24">Product-specific</text><text x="368" y="254" font-size="24">conditions and</text><text x="368" y="288" font-size="24">substantiation</text><rect x="30" y="390" width="600" height="110" rx="14" fill="white" stroke="#aac4b8" stroke-width="2"/><text x="48" y="427" font-size="26" font-weight="bold">Artwork needs both accepted outcomes</text><text x="48" y="465" font-size="24">One decision does not replace the other.</text></g></svg>