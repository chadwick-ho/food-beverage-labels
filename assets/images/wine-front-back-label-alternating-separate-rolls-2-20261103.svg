<svg xmlns="http://www.w3.org/2000/svg" width="660" height="900" viewBox="0 0 660 900"><title>Confirm sequence before ordering the rolls</title><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#527c6d"/></marker></defs><rect width="660" height="900" fill="#edf4ef"/><g font-family="Arial, sans-serif" fill="#12304a"><text x="30" y="48" font-size="30" font-weight="bold">Confirm sequence before ordering the rolls</text><text x="30" y="95" font-size="21">Pairing, unwind and supply pattern stay linked</text><path d="M330 275L170 315" stroke="#527c6d" stroke-width="4" marker-end="url(#arrow)"/><path d="M330 275L490 315" stroke="#527c6d" stroke-width="4" marker-end="url(#arrow)"/><path d="M170 505L230 560" stroke="#527c6d" stroke-width="4" marker-end="url(#arrow)"/><path d="M490 505L430 560" stroke="#527c6d" stroke-width="4" marker-end="url(#arrow)"/><path d="M330 720L330 765" stroke="#527c6d" stroke-width="4" marker-end="url(#arrow)"/><rect x="30" y="145" width="600" height="130" rx="14" fill="white" stroke="#aac4b8" stroke-width="2"/><text x="48" y="182" font-size="26" font-weight="bold">Equipment owner identifies the mode</text><text x="48" y="220" font-size="24">Actual model, stations and component order.</text><rect x="30" y="325" width="280" height="180" rx="14" fill="white" stroke="#aac4b8" stroke-width="2"/><text x="48" y="362" font-size="26" font-weight="bold">Alternating web</text><text x="48" y="400" font-size="24">Confirm repeat,</text><text x="48" y="434" font-size="24">geometry and</text><text x="48" y="468" font-size="24">sequence recovery.</text><rect x="350" y="325" width="280" height="180" rx="14" fill="white" stroke="#aac4b8" stroke-width="2"/><text x="368" y="362" font-size="26" font-weight="bold">Separate supplies</text><text x="368" y="400" font-size="24">Confirm each</text><text x="368" y="434" font-size="24">station and</text><text x="368" y="468" font-size="24">component reel.</text><rect x="30" y="570" width="600" height="150" rx="14" fill="white" stroke="#aac4b8" stroke-width="2"/><text x="48" y="607" font-size="26" font-weight="bold">Converter issues the actual web drawing</text><text x="48" y="645" font-size="24">Both parties review the same components.</text><text x="48" y="679" font-size="24">Quantity must represent usable bottle sets.</text><rect x="30" y="775" width="600" height="90" rx="14" fill="white" stroke="#aac4b8" stroke-width="2"/><text x="48" y="812" font-size="26" font-weight="bold">Check one complete pack at release / recovery</text></g></svg>