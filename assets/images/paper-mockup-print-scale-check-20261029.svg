<svg xmlns="http://www.w3.org/2000/svg" width="500" height="1060" viewBox="0 0 500 1060" role="img" aria-labelledby="t d"><title id="t">Verify mockup print scale before comparing label fit</title><desc id="d">An illustrative 100 millimetre reference printed at 95 millimetres indicates the output is not at the intended scale.</desc><rect width="500" height="1060" fill="#f3f7f7"/><rect width="500" height="145" fill="#173d4a"/><g font-family="Arial" fill="#183f4d"><text x="24" y="38" fill="#a4e9d6" font-size="19">BUYER DECISION / LABEL SIZE</text><text x="24" y="79" fill="white" font-size="27" font-weight="bold">Is the paper mockup</text><text x="24" y="114" fill="white" font-size="27" font-weight="bold">printed at the right scale?</text>
<rect x="20" y="175" width="460" height="325" rx="12" fill="white" stroke="#a9cbd2" stroke-width="2"/><text x="40" y="215" font-size="23" font-weight="bold" fill="#087a78">EXAMPLE REFERENCE</text><text x="40" y="254" font-size="21">Intended line: 100 mm</text><path d="M55 290h390M55 275v30M445 275v30" stroke="#15786f" stroke-width="4"/><text x="40" y="346" font-size="21">Measured print: 95 mm</text><path d="M55 382h370M55 367v30M425 367v30" stroke="#a24229" stroke-width="4"/><text x="40" y="452" font-size="20">Diagram is illustrative, not a ruler.</text>
<rect x="20" y="525" width="460" height="165" rx="12" fill="#fff0eb" stroke="#a9cbd2" stroke-width="2"/><text x="40" y="565" font-size="23" font-weight="bold" fill="#a24229">95 ÷ 100 = 0.95</text><text x="40" y="608" font-size="21">The example print is not at the</text><text x="40" y="642" font-size="21">reference scale. Check print settings.</text>
<rect x="20" y="715" width="460" height="230" rx="12" fill="#e9f5f0" stroke="#a9cbd2" stroke-width="2"/><text x="40" y="755" font-size="23" font-weight="bold" fill="#087a78">THEN CHECK THE PACKAGE</text><text x="40" y="798" font-size="21">Use the identified dieline and jar.</text><text x="40" y="832" font-size="21">Check both axes and actual placement.</text><text x="40" y="866" font-size="21">Paper fit does not approve adhesion</text><text x="40" y="900" font-size="21">or machine application.</text><text x="20" y="1020" font-size="17">Example only • use a suitable ruler and controlled file</text></g></svg>
