<svg xmlns="http://www.w3.org/2000/svg" width="660" height="900" viewBox="0 0 660 900"><title>The FSC artwork handoff</title><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#527c6d"/></marker></defs><rect width="660" height="900" fill="#edf4ef"/><g font-family="Arial, sans-serif" fill="#12304a"><text x="30" y="48" font-size="30" font-weight="bold">The FSC artwork handoff</text><text x="30" y="95" font-size="21">Use the authorized supplier and approval route</text><path d="M330 275L330 315" stroke="#527c6d" stroke-width="4" marker-end="url(#arrow)"/><path d="M330 455L330 495" stroke="#527c6d" stroke-width="4" marker-end="url(#arrow)"/><path d="M330 635L330 675" stroke="#527c6d" stroke-width="4" marker-end="url(#arrow)"/><rect x="30" y="145" width="600" height="130" rx="14" fill="white" stroke="#aac4b8" stroke-width="2"/><text x="48" y="182" font-size="26" font-weight="bold">1. Identify the exact item</text><text x="48" y="220" font-size="24">Label, carton or another defined component.</text><rect x="30" y="325" width="600" height="130" rx="14" fill="white" stroke="#aac4b8" stroke-width="2"/><text x="48" y="362" font-size="26" font-weight="bold">2. Verify the responsible supply</text><text x="48" y="400" font-size="24">Check relevant current certification scope.</text><rect x="30" y="505" width="600" height="130" rx="14" fill="white" stroke="#aac4b8" stroke-width="2"/><text x="48" y="542" font-size="26" font-weight="bold">3. Obtain authorized mark artwork</text><text x="48" y="580" font-size="24">Keep supplier approval linked to the file.</text><rect x="30" y="685" width="600" height="150" rx="14" fill="white" stroke="#aac4b8" stroke-width="2"/><text x="48" y="722" font-size="26" font-weight="bold">4. Match the order to the release</text><text x="48" y="760" font-size="24">Item + supplier + claim + artwork revision.</text><text x="48" y="794" font-size="24">Reopen affected approval when supply changes.</text></g></svg>