<svg xmlns="http://www.w3.org/2000/svg" width="660" height="600" viewBox="0 0 660 600"><title>Give each part of the flap a real job</title><rect width="660" height="600" fill="#edf4ef"/><g font-family="Arial" fill="#12304a"><text x="30" y="48" font-size="29" font-weight="bold">Give each part of the flap a real job</text><rect x="130" y="110" width="400" height="365" rx="18" fill="#cfdfd5" stroke="#527c6d" stroke-width="3"/><rect x="185" y="190" width="280" height="200" rx="12" fill="white" stroke="#527c6d" stroke-width="3"/><rect x="185" y="190" width="55" height="200" fill="#abc6b6"/><rect x="390" y="240" width="100" height="100" rx="10" fill="#d5bb7c"/><text x="50" y="165" font-size="23">Anchor</text><path d="M110 170l85 90" stroke="#527c6d" stroke-width="3"/><text x="275" y="230" font-size="22">Reclosure area</text><text x="405" y="295" font-size="22">Grip</text><text x="55" y="525" font-size="23">Positions and boundaries need the actual proposal.</text><text x="30" y="570" font-size="21">Conceptual functions; not a ready-to-make adhesive pattern.</text></g></svg>