<svg xmlns="http://www.w3.org/2000/svg" width="660" height="900" viewBox="0 0 660 900"><title>Locate cause before choosing a remedy</title><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#527c6d"/></marker></defs><rect width="660" height="900" fill="#edf4ef"/><g font-family="Arial, sans-serif" fill="#12304a"><text x="30" y="48" font-size="30" font-weight="bold">Locate cause before choosing a remedy</text><text x="30" y="95" font-size="21">Do not rasterize the whole label on instinct</text><path d="M330 275L170 315" stroke="#527c6d" stroke-width="4" marker-end="url(#arrow)"/><path d="M330 275L490 315" stroke="#527c6d" stroke-width="4" marker-end="url(#arrow)"/><path d="M170 510L230 565" stroke="#527c6d" stroke-width="4" marker-end="url(#arrow)"/><path d="M490 510L430 565" stroke="#527c6d" stroke-width="4" marker-end="url(#arrow)"/><path d="M330 695L330 745" stroke="#527c6d" stroke-width="4" marker-end="url(#arrow)"/><rect x="30" y="145" width="600" height="130" rx="14" fill="white" stroke="#aac4b8" stroke-width="2"/><text x="48" y="182" font-size="26" font-weight="bold">Retain the exact PDF</text><text x="48" y="220" font-size="24">Record the seam, viewer and output context.</text><rect x="30" y="325" width="280" height="185" rx="14" fill="white" stroke="#aac4b8" stroke-width="2"/><text x="48" y="362" font-size="26" font-weight="bold">Artwork object</text><text x="48" y="400" font-size="24">Design owner</text><text x="48" y="434" font-size="24">corrects the</text><text x="48" y="468" font-size="24">identified object.</text><rect x="350" y="325" width="280" height="185" rx="14" fill="white" stroke="#aac4b8" stroke-width="2"/><text x="368" y="362" font-size="26" font-weight="bold">Processing issue</text><text x="368" y="400" font-size="24">Prepress proposes</text><text x="368" y="434" font-size="24">and checks the</text><text x="368" y="468" font-size="24">output treatment.</text><rect x="30" y="575" width="600" height="120" rx="14" fill="white" stroke="#aac4b8" stroke-width="2"/><text x="48" y="612" font-size="26" font-weight="bold">Physical defect remains?</text><text x="48" y="650" font-size="24">Keep sample and production evidence linked.</text><rect x="30" y="755" width="600" height="90" rx="14" fill="white" stroke="#aac4b8" stroke-width="2"/><text x="48" y="792" font-size="26" font-weight="bold">Recheck the replacement output</text></g></svg>