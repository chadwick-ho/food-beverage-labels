<svg xmlns="http://www.w3.org/2000/svg" width="660" height="900" viewBox="0 0 660 900"><title>Two reviews for one identified material</title><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#527c6d"/></marker></defs><rect width="660" height="900" fill="#edf4ef"/><g font-family="Arial, sans-serif" fill="#12304a"><text x="30" y="48" font-size="30" font-weight="bold">Two reviews for one identified material</text><text x="30" y="95" font-size="21">Keep chemical scope and performance distinct</text><path d="M330 255L170 305" stroke="#527c6d" stroke-width="4" marker-end="url(#arrow)"/><path d="M330 255L490 305" stroke="#527c6d" stroke-width="4" marker-end="url(#arrow)"/><path d="M170 510L230 565" stroke="#527c6d" stroke-width="4" marker-end="url(#arrow)"/><path d="M490 510L430 565" stroke="#527c6d" stroke-width="4" marker-end="url(#arrow)"/><path d="M330 695L330 745" stroke="#527c6d" stroke-width="4" marker-end="url(#arrow)"/><rect x="30" y="145" width="600" height="110" rx="14" fill="white" stroke="#aac4b8" stroke-width="2"/><text x="48" y="182" font-size="26" font-weight="bold">Exact thermal material reference</text><text x="48" y="220" font-size="24">Manufacturer, product and revision</text><rect x="30" y="315" width="280" height="195" rx="14" fill="white" stroke="#aac4b8" stroke-width="2"/><text x="48" y="352" font-size="26" font-weight="bold">Declaration review</text><text x="48" y="390" font-size="24">Wording, issuer,</text><text x="48" y="424" font-size="24">scope, date</text><text x="48" y="458" font-size="24">and stated limits</text><rect x="350" y="315" width="280" height="195" rx="14" fill="white" stroke="#aac4b8" stroke-width="2"/><text x="368" y="352" font-size="26" font-weight="bold">Use qualification</text><text x="368" y="390" font-size="24">Printer, image,</text><text x="368" y="424" font-size="24">handling and</text><text x="368" y="458" font-size="24">application needs</text><rect x="30" y="575" width="600" height="120" rx="14" fill="white" stroke="#aac4b8" stroke-width="2"/><text x="48" y="612" font-size="26" font-weight="bold">Order control</text><text x="48" y="650" font-size="24">Required statement + material identity</text><text x="48" y="684" font-size="24">+ approved substitution procedure</text><rect x="30" y="755" width="600" height="90" rx="14" fill="white" stroke="#aac4b8" stroke-width="2"/><text x="48" y="792" font-size="26" font-weight="bold">A change can reopen either review</text></g></svg>