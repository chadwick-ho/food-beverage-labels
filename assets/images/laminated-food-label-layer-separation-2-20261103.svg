<svg xmlns="http://www.w3.org/2000/svg" width="660" height="900" viewBox="0 0 660 900"><title>Locate the interface before changing glue</title><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#527c6d"/></marker></defs><rect width="660" height="900" fill="#edf4ef"/><g font-family="Arial, sans-serif" fill="#12304a"><text x="30" y="48" font-size="30" font-weight="bold">Locate the interface before changing glue</text><text x="30" y="95" font-size="21">Preserve the evidence on both sides</text><path d="M330 275L170 315" stroke="#527c6d" stroke-width="4" marker-end="url(#arrow)"/><path d="M330 275L490 315" stroke="#527c6d" stroke-width="4" marker-end="url(#arrow)"/><path d="M170 505L230 560" stroke="#527c6d" stroke-width="4" marker-end="url(#arrow)"/><path d="M490 505L430 560" stroke="#527c6d" stroke-width="4" marker-end="url(#arrow)"/><path d="M330 720L330 765" stroke="#527c6d" stroke-width="4" marker-end="url(#arrow)"/><rect x="30" y="145" width="600" height="130" rx="14" fill="white" stroke="#aac4b8" stroke-width="2"/><text x="48" y="182" font-size="26" font-weight="bold">What remains on the bottle?</text><text x="48" y="220" font-size="24">Printed face, part of it, or no label?</text><rect x="30" y="325" width="280" height="180" rx="14" fill="white" stroke="#aac4b8" stroke-width="2"/><text x="48" y="362" font-size="26" font-weight="bold">Face stays</text><text x="48" y="400" font-size="24">Identify top film</text><text x="48" y="434" font-size="24">and the actual</text><text x="48" y="468" font-size="24">interlayer bond.</text><rect x="350" y="325" width="280" height="180" rx="14" fill="white" stroke="#aac4b8" stroke-width="2"/><text x="368" y="362" font-size="26" font-weight="bold">Whole label lifts</text><text x="368" y="400" font-size="24">Identify the</text><text x="368" y="434" font-size="24">package-side</text><text x="368" y="468" font-size="24">separation.</text><rect x="30" y="570" width="600" height="150" rx="14" fill="white" stroke="#aac4b8" stroke-width="2"/><text x="48" y="607" font-size="26" font-weight="bold">Retain sample identity and history</text><text x="48" y="645" font-size="24">Unused strip, failed pack and reference.</text><text x="48" y="679" font-size="24">Do not alter the only evidence to demonstrate it.</text><rect x="30" y="775" width="600" height="90" rx="14" fill="white" stroke="#aac4b8" stroke-width="2"/><text x="48" y="812" font-size="26" font-weight="bold">Review the proposed replacement separately</text></g></svg>