<svg xmlns="http://www.w3.org/2000/svg" width="660" height="600" viewBox="0 0 660 600"><title>Which pouch surfaces were in contact?</title><rect width="660" height="600" fill="#edf4ef"/><g font-family="Arial" fill="#12304a"><text x="30" y="48" font-size="29" font-weight="bold">Which pouch surfaces were in contact?</text><rect x="55" y="130" width="550" height="115" rx="16" fill="#c5d9cd" stroke="#527c6d" stroke-width="3"/><rect x="195" y="245" width="270" height="30" fill="white" stroke="#527c6d" stroke-width="2"/><rect x="55" y="280" width="550" height="115" rx="16" fill="#c5d9cd" stroke="#527c6d" stroke-width="3"/><text x="215" y="190" font-size="25">One pouch exterior</text><text x="195" y="345" font-size="25">Neighboring pack exterior</text><path d="M470 260h110" stroke="#527c6d" stroke-width="3"/><text x="85" y="455" font-size="24">Confirm the label face and the surface it met.</text><text x="85" y="500" font-size="23">A different stack can create a different contact pair.</text><text x="30" y="570" font-size="21">Simplified contact section; no scale or actual defect implied.</text></g></svg>