<svg xmlns="http://www.w3.org/2000/svg" width="640" height="1369" viewBox="0 0 640 1369" role="img" aria-labelledby="title desc"><title id="title">Recover fields, not a convenient guess</title><desc id="desc">A confirmed artwork revision does not automatically recover construction, manufacturing lot, usable count or release status.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10z" fill="#52798c"/></marker></defs><rect width="640" height="1369" fill="#f5f8fa"/><g font-family="Arial,Helvetica,sans-serif"><rect width="640" height="185" fill="#163d4b"/><text x="28" y="33" font-size="18" fill="#9ee2ce" font-weight="700"><tspan x="28" dy="0">ZFU LABELS / BUYER DECISION</tspan></text><text x="28" y="83" font-size="31" fill="#ffffff" font-weight="700"><tspan x="28" dy="0">Recover fields, not a convenient</tspan><tspan x="28" dy="38">guess</tspan></text><rect x="40" y="210" width="560" height="159" rx="15" fill="#ffffff" stroke="#becfd8" stroke-width="2"/><text x="58" y="244" font-size="26" fill="#126d65" font-weight="700"><tspan x="58" dy="0">ORPHAN ROLL</tspan></text><text x="58" y="285" font-size="25" fill="#243b53" font-weight="400"><tspan x="58" dy="0">Temporary hold identity; preserve</tspan><tspan x="58" dy="32">remaining marks.</tspan></text><path d="M320 371 L320 402" fill="none" stroke="#52798c" stroke-width="3" marker-end="url(#arrow)"/><rect x="40" y="413" width="560" height="159" rx="15" fill="#ffffff" stroke="#becfd8" stroke-width="2"/><text x="58" y="447" font-size="26" fill="#126d65" font-weight="700"><tspan x="58" dy="0">RECOVER EACH FIELD</tspan></text><text x="58" y="488" font-size="25" fill="#243b53" font-weight="400"><tspan x="58" dy="0">Controlled artwork comparison +</tspan><tspan x="58" dy="32">traceable supplier/carton evidence</tspan></text><rect x="24" y="616" width="282" height="209" rx="15" fill="#e9f7ee" stroke="#becfd8" stroke-width="2"/><text x="42" y="650" font-size="24" fill="#126d65" font-weight="700"><tspan x="42" dy="0">SUPPORTED</tspan></text><text x="42" y="689" font-size="22" fill="#243b53" font-weight="400"><tspan x="42" dy="0">Revision confirmed</tspan><tspan x="42" dy="29">by actual</tspan><tspan x="42" dy="29">distinguishing</tspan><tspan x="42" dy="29">content</tspan></text><rect x="334" y="616" width="282" height="180" rx="15" fill="#fff0eb" stroke="#becfd8" stroke-width="2"/><text x="352" y="650" font-size="24" fill="#126d65" font-weight="700"><tspan x="352" dy="0">STILL OPEN</tspan></text><text x="352" y="689" font-size="22" fill="#243b53" font-weight="400"><tspan x="352" dy="0">Lot / construction</tspan><tspan x="352" dy="29">not established by</tspan><tspan x="352" dy="29">appearance</tspan></text><rect x="40" y="860" width="560" height="191" rx="15" fill="#ffffff" stroke="#becfd8" stroke-width="2"/><text x="58" y="894" font-size="26" fill="#126d65" font-weight="700"><tspan x="58" dy="0">RESPONSIBLE RELEASE DECISION</tspan></text><text x="58" y="935" font-size="25" fill="#243b53" font-weight="400"><tspan x="58" dy="0">Keep recovered facts and unresolved</tspan><tspan x="58" dy="32">fields separate. A new wrapper does</tspan><tspan x="58" dy="32">not clear the hold.</tspan></text><rect x="24" y="1076" width="592" height="223" rx="15" fill="#f0f4f6" stroke="#becfd8" stroke-width="2"/><text x="42" y="1110" font-size="26" fill="#126d65" font-weight="700"><tspan x="42" dy="0">SCOPE / OPEN CONDITION</tspan></text><text x="42" y="1151" font-size="25" fill="#243b53" font-weight="400"><tspan x="42" dy="0">A confirmed artwork revision does not</tspan><tspan x="42" dy="32">automatically recover construction,</tspan><tspan x="42" dy="32">manufacturing lot, usable count or</tspan><tspan x="42" dy="32">release status.</tspan></text><text x="28" y="1346" font-size="18" fill="#526979" font-weight="400"><tspan x="28" dy="0">Editorial planning aid • use with the article worksheet</tspan></text></g></svg>