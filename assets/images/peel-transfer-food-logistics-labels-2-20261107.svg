<svg xmlns="http://www.w3.org/2000/svg" width="660" height="600" viewBox="0 0 660 600"><title>Approve the second attachment too</title><rect width="660" height="600" fill="#edf4ef"/><g font-family="Arial" fill="#12304a"><text x="28" y="48" font-size="28" font-weight="bold">Approve the second attachment too</text><rect x="35" y="110" width="590" height="115" rx="12" fill="white"/><text x="55" y="153" font-size="27" font-weight="bold">1  Hold on the actual first surface</text><text x="55" y="195" font-size="24">Include the relevant storage and handling.</text><rect x="35" y="265" width="590" height="100" rx="12" fill="white"/><text x="55" y="308" font-size="27" font-weight="bold">2  Release the intended component</text><text x="55" y="345" font-size="24">Readable section; base identity retained.</text><rect x="35" y="405" width="590" height="110" rx="12" fill="white"/><text x="55" y="450" font-size="27" font-weight="bold">3  Bond to the actual destination</text><text x="55" y="490" font-size="24">A clean peel alone does not answer this.</text><text x="28" y="568" font-size="21">Use-sequence map; actual sample acceptance must be agreed.</text></g></svg>