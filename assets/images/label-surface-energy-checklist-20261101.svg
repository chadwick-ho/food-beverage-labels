<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 1040"><title>Surface measurement handoff checklist</title><rect width="760" height="1040" fill="#f2f7f4"/><g font-family="Arial" fill="#12304a"><text x="45" y="70" font-size="36" font-weight="bold">Identify the surface first</text><text x="45" y="110" font-size="22">Editorial checklist · not a test procedure</text><rect x="45" y="145" width="670" height="165" rx="15" fill="#fff"/><text x="68" y="190" font-size="27" font-weight="bold">1 · Name the question</text><text x="68" y="230" font-size="22">Ink on label face or adhesion to package?</text><text x="68" y="270" font-size="22">Do not treat the two as one surface.</text><path d="M380 310v30" stroke="#568374" stroke-width="5"/><rect x="45" y="340" width="670" height="165" rx="15" fill="#fff"/><text x="68" y="385" font-size="27" font-weight="bold">2 · Identify the sample</text><text x="68" y="425" font-size="22">Material, side, lot and preparation.</text><text x="68" y="465" font-size="22">Record treatment history where known.</text><path d="M380 505v30" stroke="#568374" stroke-width="5"/><rect x="45" y="535" width="670" height="165" rx="15" fill="#fff"/><text x="68" y="580" font-size="27" font-weight="bold">3 · Record the measurement</text><text x="68" y="620" font-size="22">Method, location, time and observed result.</text><text x="68" y="660" font-size="22">Preserve its scope and limitations.</text><path d="M380 700v30" stroke="#568374" stroke-width="5"/><rect x="45" y="730" width="670" height="190" rx="15" fill="#fff"/><text x="68" y="775" font-size="27" font-weight="bold">4 · Test the real task</text><text x="68" y="815" font-size="22">Evaluate actual print or applied construction.</text><text x="68" y="855" font-size="22">Agree conditions and evidence with owners.</text><text x="68" y="895" font-size="22">A dyne reading is not a finished-pack approval.</text></g></svg>