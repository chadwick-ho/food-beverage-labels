<svg xmlns="http://www.w3.org/2000/svg" width="660" height="900" viewBox="0 0 660 900"><title>Compare the complete decorative set</title><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#527c6d"/></marker></defs><rect width="660" height="900" fill="#edf4ef"/><g font-family="Arial, sans-serif" fill="#12304a"><text x="30" y="48" font-size="30" font-weight="bold">Compare the complete decorative set</text><text x="30" y="95" font-size="21">Separate physical pieces from printed artwork layers</text><path d="M330 270L170 315" stroke="#527c6d" stroke-width="4" marker-end="url(#arrow)"/><path d="M330 270L490 315" stroke="#527c6d" stroke-width="4" marker-end="url(#arrow)"/><path d="M170 515L230 565" stroke="#527c6d" stroke-width="4" marker-end="url(#arrow)"/><path d="M490 515L430 565" stroke="#527c6d" stroke-width="4" marker-end="url(#arrow)"/><path d="M330 695L330 745" stroke="#527c6d" stroke-width="4" marker-end="url(#arrow)"/><rect x="30" y="145" width="600" height="125" rx="14" fill="white" stroke="#aac4b8" stroke-width="2"/><text x="48" y="182" font-size="26" font-weight="bold">Define the visual deliverable</text><text x="48" y="220" font-size="24">Single construction or separate base and top pieces?</text><rect x="30" y="325" width="280" height="190" rx="14" fill="white" stroke="#aac4b8" stroke-width="2"/><text x="48" y="362" font-size="26" font-weight="bold">Single-label route</text><text x="48" y="400" font-size="24">Identify stock</text><text x="48" y="434" font-size="24">and actual printing</text><text x="48" y="468" font-size="24">or finishing scope.</text><rect x="350" y="325" width="280" height="190" rx="14" fill="white" stroke="#aac4b8" stroke-width="2"/><text x="368" y="362" font-size="26" font-weight="bold">Two-piece route</text><text x="368" y="400" font-size="24">Identify both pieces,</text><text x="368" y="434" font-size="24">landing surface</text><text x="368" y="468" font-size="24">and assembly owner.</text><rect x="30" y="575" width="600" height="120" rx="14" fill="white" stroke="#aac4b8" stroke-width="2"/><text x="48" y="612" font-size="26" font-weight="bold">Compare complete costs and usable sets</text><text x="48" y="650" font-size="24">Include only the actual confirmed supply and work.</text><rect x="30" y="755" width="600" height="105" rx="14" fill="white" stroke="#aac4b8" stroke-width="2"/><text x="48" y="792" font-size="26" font-weight="bold">Approve the representative finished bottle</text><text x="48" y="830" font-size="24">Keep appearance and attachment evidence distinct.</text></g></svg>