<svg xmlns="http://www.w3.org/2000/svg" width="640" height="1205" viewBox="0 0 640 1205" role="img" aria-labelledby="title desc"><title id="title">Can A proceed while B stays open?</title><desc id="desc">Approved copy does not settle a shared cut. Confirm a genuinely separate route before partial release.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10z" fill="#52798c"/></marker></defs><rect width="640" height="1205" fill="#f5f8fa"/><g font-family="Arial,Helvetica,sans-serif"><rect width="640" height="185" fill="#163d4b"/><text x="28" y="33" font-size="18" fill="#9ee2ce" font-weight="700"><tspan x="28" dy="0">ZFU LABELS / BUYER DECISION</tspan></text><text x="28" y="83" font-size="31" fill="#ffffff" font-weight="700"><tspan x="28" dy="0">Can A proceed while B stays open?</tspan></text><rect x="24" y="210" width="282" height="122" rx="15" fill="#ffffff" stroke="#becfd8" stroke-width="2"/><text x="42" y="244" font-size="24" fill="#126d65" font-weight="700"><tspan x="42" dy="0">SKU A</tspan></text><text x="42" y="283" font-size="22" fill="#243b53" font-weight="400"><tspan x="42" dy="0">Copy approved</tspan></text><rect x="334" y="210" width="282" height="122" rx="15" fill="#ffffff" stroke="#becfd8" stroke-width="2"/><text x="352" y="244" font-size="24" fill="#126d65" font-weight="700"><tspan x="352" dy="0">SKU B</tspan></text><text x="352" y="283" font-size="22" fill="#243b53" font-weight="400"><tspan x="352" dy="0">Cut disputed</tspan></text><path d="M165 332 L270 377" fill="none" stroke="#52798c" stroke-width="3" marker-end="url(#arrow)"/><path d="M475 332 L370 377" fill="none" stroke="#52798c" stroke-width="3" marker-end="url(#arrow)"/><rect x="40" y="377" width="560" height="159" rx="15" fill="#e7f2f7" stroke="#becfd8" stroke-width="2"/><text x="58" y="411" font-size="26" fill="#126d65" font-weight="700"><tspan x="58" dy="0">SHARED CUT / TOOL?</tspan></text><text x="58" y="452" font-size="25" fill="#243b53" font-weight="400"><tspan x="58" dy="0">Confirm what the actual proposed</tspan><tspan x="58" dy="32">production route uses.</tspan></text><rect x="40" y="576" width="560" height="159" rx="15" fill="#fff0eb" stroke="#becfd8" stroke-width="2"/><text x="58" y="610" font-size="26" fill="#126d65" font-weight="700"><tspan x="58" dy="0">YES: SHARED OPEN REQUIREMENT</tspan></text><text x="58" y="651" font-size="25" fill="#243b53" font-weight="400"><tspan x="58" dy="0">Resolve it or agree a separately</tspan><tspan x="58" dy="32">reviewed route before A proceeds.</tspan></text><rect x="40" y="760" width="560" height="159" rx="15" fill="#e9f7ee" stroke="#becfd8" stroke-width="2"/><text x="58" y="794" font-size="26" fill="#126d65" font-weight="700"><tspan x="58" dy="0">NO: REVIEW INDEPENDENT SCOPE</tspan></text><text x="58" y="835" font-size="25" fill="#243b53" font-weight="400"><tspan x="58" dy="0">Confirm A’s file, construction, cut,</tspan><tspan x="58" dy="32">price and dispatch identity.</tspan></text><rect x="24" y="944" width="592" height="191" rx="15" fill="#f0f4f6" stroke="#becfd8" stroke-width="2"/><text x="42" y="978" font-size="26" fill="#126d65" font-weight="700"><tspan x="42" dy="0">SCOPE / OPEN CONDITION</tspan></text><text x="42" y="1019" font-size="25" fill="#243b53" font-weight="400"><tspan x="42" dy="0">Approved copy does not settle a shared</tspan><tspan x="42" dy="32">cut. Confirm a genuinely separate route</tspan><tspan x="42" dy="32">before partial release.</tspan></text><text x="28" y="1182" font-size="18" fill="#526979" font-weight="400"><tspan x="28" dy="0">Editorial planning aid • use with the article worksheet</tspan></text></g></svg>