<svg xmlns="http://www.w3.org/2000/svg" width="640" height="1239" viewBox="0 0 640 1239" role="img" aria-labelledby="title desc"><title id="title">Web length and usable pieces are different</title><desc id="desc">No universal leader length or loss allowance. Splitting rolls creates additional start/end events.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10z" fill="#52798c"/></marker></defs><rect width="640" height="1239" fill="#f5f8fa"/><g font-family="Arial,Helvetica,sans-serif"><rect width="640" height="185" fill="#163d4b"/><text x="28" y="33" font-size="18" fill="#9ee2ce" font-weight="700"><tspan x="28" dy="0">ZFU LABELS / BUYER DECISION</tspan></text><text x="28" y="83" font-size="31" fill="#ffffff" font-weight="700"><tspan x="28" dy="0">Web length and usable pieces are</tspan><tspan x="28" dy="38">different</tspan></text><rect x="40" y="210" width="560" height="159" rx="15" fill="#e7f2f7" stroke="#becfd8" stroke-width="2"/><text x="58" y="244" font-size="26" fill="#126d65" font-weight="700"><tspan x="58" dy="0">BLANK LEADER</tspan></text><text x="58" y="285" font-size="25" fill="#243b53" font-weight="400"><tspan x="58" dy="0">Record agreed LENGTH and unit. Not a</tspan><tspan x="58" dy="32">printed piece.</tspan></text><rect x="40" y="394" width="560" height="159" rx="15" fill="#fff0eb" stroke="#becfd8" stroke-width="2"/><text x="58" y="428" font-size="26" fill="#126d65" font-weight="700"><tspan x="58" dy="0">PRINTED LOADING</tspan></text><text x="58" y="469" font-size="25" fill="#243b53" font-weight="400"><tspan x="58" dy="0">Record positions/pieces actually</tspan><tspan x="58" dy="32">inside or outside the declared count.</tspan></text><rect x="40" y="578" width="560" height="191" rx="15" fill="#e9f7ee" stroke="#becfd8" stroke-width="2"/><text x="58" y="612" font-size="26" fill="#126d65" font-weight="700"><tspan x="58" dy="0">PACKING SUPPLY</tspan></text><text x="58" y="653" font-size="25" fill="#243b53" font-weight="400"><tspan x="58" dy="0">Declared pieces minus separately</tspan><tspan x="58" dy="32">established, non-overlapping</tspan><tspan x="58" dy="32">consumption.</tspan></text><rect x="40" y="794" width="560" height="159" rx="15" fill="#e7f2f7" stroke="#becfd8" stroke-width="2"/><text x="58" y="828" font-size="26" fill="#126d65" font-weight="700"><tspan x="58" dy="0">TRAILER / CORE END</tspan></text><text x="58" y="869" font-size="25" fill="#243b53" font-weight="400"><tspan x="58" dy="0">Record LENGTH, attachment and end-</tspan><tspan x="58" dy="32">handling basis.</tspan></text><rect x="24" y="978" width="592" height="191" rx="15" fill="#f0f4f6" stroke="#becfd8" stroke-width="2"/><text x="42" y="1012" font-size="26" fill="#126d65" font-weight="700"><tspan x="42" dy="0">SCOPE / OPEN CONDITION</tspan></text><text x="42" y="1053" font-size="25" fill="#243b53" font-weight="400"><tspan x="42" dy="0">No universal leader length or loss</tspan><tspan x="42" dy="32">allowance. Splitting rolls creates</tspan><tspan x="42" dy="32">additional start/end events.</tspan></text><text x="28" y="1216" font-size="18" fill="#526979" font-weight="400"><tspan x="28" dy="0">Editorial planning aid • use with the article worksheet</tspan></text></g></svg>