<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 940"><title>Packaging odour evidence handoff checklist</title><rect width="640" height="940" fill="#f2f7f4"/><g font-family="Arial" fill="#12304a"><text x="35" y="65" font-size="30" font-weight="bold">Prepare the investigation handoff</text><text x="35" y="105" font-size="21">Editorial aid · follow site quality procedures</text><rect x="30" y="145" width="580" height="150" rx="15" fill="white"/><text x="50" y="187" font-size="26" font-weight="bold">1 · Escalate and preserve identity</text><text x="50" y="230" font-size="23">Notify the responsible quality owner.</text><text x="50" y="266" font-size="23">Record affected stock and observations.</text><rect x="30" y="330" width="580" height="150" rx="15" fill="white"/><text x="50" y="372" font-size="26" font-weight="bold">2 · Link the actual materials</text><text x="50" y="415" font-size="23">Label, container, closure and packed lot.</text><text x="50" y="451" font-size="23">Keep known changes and unknowns.</text><rect x="30" y="515" width="580" height="150" rx="15" fill="white"/><text x="50" y="557" font-size="26" font-weight="bold">3 · Agree sample handling</text><text x="50" y="600" font-size="23">Ask the qualified testing team first.</text><text x="50" y="636" font-size="23">Avoid altering the evidence.</text><rect x="30" y="700" width="580" height="180" rx="15" fill="white"/><text x="50" y="742" font-size="26" font-weight="bold">4 · Record scope and decision</text><text x="50" y="785" font-size="23">Method, result, limitation and owner.</text><text x="50" y="821" font-size="23">Odour alone does not establish safety.</text><text x="50" y="857" font-size="23">Trace any authorized replacement.</text></g></svg>