<svg xmlns="http://www.w3.org/2000/svg" width="640" height="1120" viewBox="0 0 640 1120" role="img" aria-label="Same piece count, different web length"><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8Z" fill="#486e80"/></marker></defs><g font-family="Arial, sans-serif"><rect x="0" y="0" width="640" height="1120" rx="0" fill="#f2f7fa" stroke="#a5becb" stroke-width="2"/><rect x="0" y="0" width="640" height="190" rx="0" fill="#173e4b" stroke="#173e4b" stroke-width="2"/><text x="30" y="35" fill="#a4e1d0" font-size="18" font-weight="700"><tspan x="30" dy="0">ZFU LABELS / PURCHASING DIAGRAM</tspan></text><text x="30" y="88" fill="#fff" font-size="32" font-weight="700"><tspan x="30" dy="0">Same piece count, different web</tspan><tspan x="30" dy="40">length</tspan></text><text x="34" y="237" fill="#213b4c" font-size="25" font-weight="700"><tspan x="34" dy="0">1,200 LABELS / 40 mm REPEAT PITCH</tspan></text><text x="34" y="290" fill="#213b4c" font-size="26" font-weight="700"><tspan x="34" dy="0">ONE LABEL PER REPEAT</tspan></text><rect x="60" y="320" width="165" height="38" rx="4" fill="#c9e8e0" stroke="#a5becb" stroke-width="2"/><rect x="60" y="372" width="165" height="38" rx="4" fill="#c9e8e0" stroke="#a5becb" stroke-width="2"/><rect x="60" y="424" width="165" height="38" rx="4" fill="#c9e8e0" stroke="#a5becb" stroke-width="2"/><path d="M470 323 L470 370" fill="none" stroke="#486e80" stroke-width="3"/><path d="M460 323 L480 323" fill="none" stroke="#486e80" stroke-width="3"/><path d="M460 370 L480 370" fill="none" stroke="#486e80" stroke-width="3"/><text x="492" y="355" fill="#213b4c" font-size="22" font-weight="400"><tspan x="492" dy="0">Pitch</tspan></text><text x="34" y="525" fill="#213b4c" font-size="27" font-weight="700"><tspan x="34" dy="0">1,200 repeats x 40 mm = 48 m</tspan></text><text x="34" y="573" fill="#213b4c" font-size="26" font-weight="700"><tspan x="34" dy="0">TWO LABELS PER REPEAT</tspan></text><rect x="60" y="603" width="165" height="38" rx="4" fill="#c9e8e0" stroke="#a5becb" stroke-width="2"/><rect x="250" y="603" width="165" height="38" rx="4" fill="#c9e8e0" stroke="#a5becb" stroke-width="2"/><rect x="60" y="655" width="165" height="38" rx="4" fill="#c9e8e0" stroke="#a5becb" stroke-width="2"/><rect x="250" y="655" width="165" height="38" rx="4" fill="#c9e8e0" stroke="#a5becb" stroke-width="2"/><rect x="60" y="707" width="165" height="38" rx="4" fill="#c9e8e0" stroke="#a5becb" stroke-width="2"/><rect x="250" y="707" width="165" height="38" rx="4" fill="#c9e8e0" stroke="#a5becb" stroke-width="2"/><path d="M470 606 L470 653" fill="none" stroke="#486e80" stroke-width="3"/><path d="M460 606 L480 606" fill="none" stroke="#486e80" stroke-width="3"/><path d="M460 653 L480 653" fill="none" stroke="#486e80" stroke-width="3"/><text x="492" y="638" fill="#213b4c" font-size="22" font-weight="400"><tspan x="492" dy="0">Pitch</tspan></text><text x="34" y="808" fill="#213b4c" font-size="27" font-weight="700"><tspan x="34" dy="0">600 repeats x 40 mm = 24 m</tspan></text><text x="34" y="925" fill="#213b4c" font-size="27" font-weight="400"><tspan x="34" dy="0">Leader/trailer are separate. This is</tspan><tspan x="34" dy="35">not an outside-diameter calculation.</tspan></text><text x="30" y="1095" fill="#4b6473" font-size="18" font-weight="400"><tspan x="30" dy="0">Planning example / no customer result or acceptance limit</tspan></text></g></svg>