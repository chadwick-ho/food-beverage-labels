<svg xmlns="http://www.w3.org/2000/svg" width="660" height="600" viewBox="0 0 660 600"><title>Approve two different questions</title><rect width="660" height="600" fill="#edf4ef"/><g font-family="Arial" fill="#12304a"><text x="30" y="48" font-size="29" font-weight="bold">Approve two different questions</text><rect x="30" y="115" width="280" height="280" rx="12" fill="white"/><rect x="350" y="115" width="280" height="280" rx="12" fill="white"/><text x="55" y="165" font-size="26" font-weight="bold">Correct information</text><text x="55" y="230" font-size="24">Approved field</text><text x="55" y="280" font-size="24">Authorised value</text><text x="55" y="330" font-size="24">Actual packing job</text><text x="375" y="165" font-size="26" font-weight="bold">Readable writing</text><text x="375" y="230" font-size="24">Exact tool/surface</text><text x="375" y="280" font-size="24">Supported handling</text><text x="375" y="330" font-size="24">Relevant later use</text><text x="45" y="485" font-size="24">A neat mark does not approve its value or date logic.</text><text x="30" y="570" font-size="21">Editorial brief; no shelf-life or writing-performance claim.</text></g></svg>