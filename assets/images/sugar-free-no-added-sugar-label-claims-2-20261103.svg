<svg xmlns="http://www.w3.org/2000/svg" width="660" height="900" viewBox="0 0 660 900"><title>A shorter headline can change the claim</title><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#527c6d"/></marker></defs><rect width="660" height="900" fill="#edf4ef"/><g font-family="Arial, sans-serif" fill="#12304a"><text x="30" y="48" font-size="30" font-weight="bold">A shorter headline can change the claim</text><text x="30" y="95" font-size="21">Review meaning before revising the badge</text><path d="M330 275L330 315" stroke="#527c6d" stroke-width="4" marker-end="url(#arrow)"/><path d="M330 455L170 495" stroke="#527c6d" stroke-width="4" marker-end="url(#arrow)"/><path d="M330 455L490 495" stroke="#527c6d" stroke-width="4" marker-end="url(#arrow)"/><path d="M170 680L230 730" stroke="#527c6d" stroke-width="4" marker-end="url(#arrow)"/><path d="M490 680L430 730" stroke="#527c6d" stroke-width="4" marker-end="url(#arrow)"/><rect x="30" y="145" width="600" height="130" rx="14" fill="white" stroke="#aac4b8" stroke-width="2"/><text x="48" y="182" font-size="26" font-weight="bold">Proposed wording change</text><text x="48" y="220" font-size="24">Identify the old phrase and proposed phrase.</text><rect x="30" y="325" width="600" height="130" rx="14" fill="white" stroke="#aac4b8" stroke-width="2"/><text x="48" y="362" font-size="26" font-weight="bold">Responsible claim reviewer</text><text x="48" y="400" font-size="24">Confirm eligibility and accompanying text.</text><rect x="30" y="505" width="280" height="175" rx="14" fill="white" stroke="#aac4b8" stroke-width="2"/><text x="48" y="542" font-size="26" font-weight="bold">Accepted set fits</text><text x="48" y="580" font-size="24">Place the exact</text><text x="48" y="614" font-size="24">approved set</text><text x="48" y="648" font-size="24">and compare.</text><rect x="350" y="505" width="280" height="175" rx="14" fill="white" stroke="#aac4b8" stroke-width="2"/><text x="368" y="542" font-size="26" font-weight="bold">Set does not fit</text><text x="368" y="580" font-size="24">Return capacity</text><text x="368" y="614" font-size="24">options; do not</text><text x="368" y="648" font-size="24">rewrite to fit.</text><rect x="30" y="740" width="600" height="110" rx="14" fill="white" stroke="#aac4b8" stroke-width="2"/><text x="48" y="777" font-size="26" font-weight="bold">Cross-check every location</text><text x="48" y="815" font-size="24">Front, back, sticker and relevant online copy.</text></g></svg>