<svg xmlns="http://www.w3.org/2000/svg" width="500" height="1100" viewBox="0 0 500 1100" role="img" aria-labelledby="t d"><title id="t">Illustrative comparison of label quotes in different currencies</title><desc id="d">Add comparable goods and freight amounts in their original currencies, then convert at one explicitly assumed rate and preserve unknown costs.</desc><rect width="500" height="1100" fill="#f3f7f7"/><rect width="500" height="145" fill="#173d4a"/><g font-family="Arial" fill="#183f4d"><text x="24" y="38" fill="#a4e9d6" font-size="19">BUYER DECISION / QUOTES</text><text x="24" y="79" fill="white" font-size="27" font-weight="bold">Compare the same scope</text><text x="24" y="114" fill="white" font-size="27" font-weight="bold">across currencies</text>
<rect x="20" y="175" width="460" height="175" rx="12" fill="white" stroke="#a9cbd2" stroke-width="2"/><text x="40" y="214" font-size="23" font-weight="bold" fill="#087a78">ILLUSTRATIVE OFFER A</text><text x="40" y="258" font-size="21">Goods $950 + freight $50</text><text x="40" y="300" font-size="23" font-weight="bold">= $1,000</text>
<rect x="20" y="375" width="460" height="245" rx="12" fill="#e9f5f0" stroke="#a9cbd2" stroke-width="2"/><text x="40" y="414" font-size="23" font-weight="bold" fill="#087a78">ILLUSTRATIVE OFFER B</text><text x="40" y="458" font-size="21">Goods €800 + freight €40 = €840</text><text x="40" y="500" font-size="21">Assumed rate: $1.20 per €1</text><text x="40" y="542" font-size="23" font-weight="bold">€840 × 1.20 = $1,008</text><text x="40" y="584" font-size="19">Amounts and rate are invented examples.</text>
<rect x="20" y="645" width="460" height="330" rx="12" fill="#fff0eb" stroke="#a9cbd2" stroke-width="2"/><text x="40" y="684" font-size="23" font-weight="bold" fill="#a24229">BEFORE RANKING OFFERS</text><text x="40" y="728" font-size="21">Same quantity and delivery scope?</text><text x="40" y="762" font-size="21">Are freight and charges already included?</text><text x="40" y="796" font-size="21">Which taxes or fees remain unknown?</text><text x="40" y="830" font-size="21">What rate source and time were used?</text><text x="40" y="864" font-size="21">What currency will actually be paid?</text><text x="40" y="916" font-size="20">A planning rate is not the bank's</text><text x="40" y="947" font-size="20">eventual settlement rate.</text><text x="20" y="1058" font-size="17">Example only • use current scoped offers and actual terms</text></g></svg>
