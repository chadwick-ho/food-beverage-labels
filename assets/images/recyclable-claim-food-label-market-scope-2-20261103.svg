<svg xmlns="http://www.w3.org/2000/svg" width="660" height="900" viewBox="0 0 660 900"><title>Approve the actual environmental copy</title><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#527c6d"/></marker></defs><rect width="660" height="900" fill="#edf4ef"/><g font-family="Arial, sans-serif" fill="#12304a"><text x="30" y="48" font-size="30" font-weight="bold">Approve the actual environmental copy</text><text x="30" y="95" font-size="21">Keep the necessary qualification visible</text><path d="M330 275L330 315" stroke="#527c6d" stroke-width="4" marker-end="url(#arrow)"/><path d="M330 455L170 495" stroke="#527c6d" stroke-width="4" marker-end="url(#arrow)"/><path d="M330 455L490 495" stroke="#527c6d" stroke-width="4" marker-end="url(#arrow)"/><path d="M170 680L230 730" stroke="#527c6d" stroke-width="4" marker-end="url(#arrow)"/><path d="M490 680L430 730" stroke="#527c6d" stroke-width="4" marker-end="url(#arrow)"/><rect x="30" y="145" width="600" height="130" rx="14" fill="white" stroke="#aac4b8" stroke-width="2"/><text x="48" y="182" font-size="26" font-weight="bold">Define the exact proposition</text><text x="48" y="220" font-size="24">What component and which attribute?</text><rect x="30" y="325" width="600" height="130" rx="14" fill="white" stroke="#aac4b8" stroke-width="2"/><text x="48" y="362" font-size="26" font-weight="bold">Review the supporting evidence</text><text x="48" y="400" font-size="24">Construction + actual sales-market route.</text><rect x="30" y="505" width="280" height="175" rx="14" fill="white" stroke="#aac4b8" stroke-width="2"/><text x="48" y="542" font-size="26" font-weight="bold">Supported scope</text><text x="48" y="580" font-size="24">Use reviewer-</text><text x="48" y="614" font-size="24">accepted wording</text><text x="48" y="648" font-size="24">and conditions.</text><rect x="350" y="505" width="280" height="175" rx="14" fill="white" stroke="#aac4b8" stroke-width="2"/><text x="368" y="542" font-size="26" font-weight="bold">Unresolved scope</text><text x="368" y="580" font-size="24">Keep the claim</text><text x="368" y="614" font-size="24">pending; obtain</text><text x="368" y="648" font-size="24">missing evidence.</text><rect x="30" y="740" width="600" height="110" rx="14" fill="white" stroke="#aac4b8" stroke-width="2"/><text x="48" y="777" font-size="26" font-weight="bold">Check the printed presentation</text><text x="48" y="815" font-size="24">Symbols and shortened copy must not expand it.</text></g></svg>