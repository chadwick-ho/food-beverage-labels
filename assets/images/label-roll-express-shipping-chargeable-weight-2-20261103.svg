<svg xmlns="http://www.w3.org/2000/svg" width="660" height="900" viewBox="0 0 660 900"><title>A weight basis is not a freight price</title><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#527c6d"/></marker></defs><rect width="660" height="900" fill="#edf4ef"/><g font-family="Arial, sans-serif" fill="#12304a"><text x="30" y="48" font-size="30" font-weight="bold">A weight basis is not a freight price</text><text x="30" y="95" font-size="21">Illustrative arithmetic using one stated service rule</text><path d="M170 320L230 380" stroke="#527c6d" stroke-width="4" marker-end="url(#arrow)"/><path d="M490 320L430 380" stroke="#527c6d" stroke-width="4" marker-end="url(#arrow)"/><path d="M330 530L330 590" stroke="#527c6d" stroke-width="4" marker-end="url(#arrow)"/><rect x="30" y="145" width="280" height="175" rx="14" fill="white" stroke="#aac4b8" stroke-width="2"/><text x="48" y="182" font-size="26" font-weight="bold">Actual gross</text><text x="48" y="220" font-size="24">Packed carton</text><text x="48" y="254" font-size="24">8 kg</text><text x="48" y="288" font-size="24">Invented example</text><rect x="350" y="145" width="280" height="175" rx="14" fill="white" stroke="#aac4b8" stroke-width="2"/><text x="368" y="182" font-size="26" font-weight="bold">Volumetric</text><text x="368" y="220" font-size="24">60 × 40 × 30</text><text x="368" y="254" font-size="24">÷ 5,000</text><text x="368" y="288" font-size="24">= 14.4 kg</text><rect x="30" y="390" width="600" height="140" rx="14" fill="white" stroke="#aac4b8" stroke-width="2"/><text x="48" y="427" font-size="26" font-weight="bold">Compare under the applicable rule</text><text x="48" y="465" font-size="24">Larger example figure: 14.4 kg.</text><text x="48" y="499" font-size="24">Confirm service rounding and other charges.</text><rect x="30" y="600" width="600" height="170" rx="14" fill="white" stroke="#aac4b8" stroke-width="2"/><text x="48" y="637" font-size="26" font-weight="bold">Before accepting the freight offer</text><text x="48" y="675" font-size="24">Use actual final cartons and current terms.</text><text x="48" y="709" font-size="24">Preserve protection, roll identity and line fit.</text><text x="48" y="743" font-size="24">No rate or saving is demonstrated here.</text></g></svg>