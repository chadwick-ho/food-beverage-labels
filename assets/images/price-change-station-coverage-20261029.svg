<svg xmlns="http://www.w3.org/2000/svg" width="500" height="1010" viewBox="0 0 500 1010" role="img" aria-labelledby="t d"><title id="t">Check a price update at every labeling station</title><desc id="d">A hypothetical approved price revision reaches one station while another remains unknown, requiring separate confirmation before use.</desc><rect width="500" height="1010" fill="#f3f7f7"/><rect width="500" height="145" fill="#173d4a"/><g font-family="Arial" fill="#183f4d"><text x="24" y="38" fill="#a4e9d6" font-size="19">BUYER DECISION / PRICE DATA</text><text x="24" y="79" fill="white" font-size="27" font-weight="bold">Did every station receive</text><text x="24" y="114" fill="white" font-size="27" font-weight="bold">the approved price change?</text>
<rect x="25" y="175" width="450" height="110" rx="12" fill="white" stroke="#a9cbd2" stroke-width="2"/><text x="45" y="215" font-size="23" font-weight="bold" fill="#087a78">AUTHORIZED REVISION: P2</text><text x="45" y="253" font-size="20">Illustrative ID; pricing owner sets the boundary.</text><path d="M250 285v30M250 315H132v35M250 315h118v35" fill="none" stroke="#688e9a" stroke-width="3"/>
<rect x="20" y="350" width="225" height="245" rx="12" fill="#e9f5f0" stroke="#a9cbd2" stroke-width="2"/><text x="35" y="390" font-size="21" font-weight="bold" fill="#087a78">STATION A</text><text x="35" y="432" font-size="20">P2 confirmed for</text><text x="35" y="462" font-size="20">the named job.</text><text x="35" y="502" font-size="20">Test input, output</text><text x="35" y="532" font-size="20">and scope recorded.</text>
<rect x="255" y="350" width="225" height="245" rx="12" fill="#fff0eb" stroke="#c88c7b" stroke-width="2"/><text x="270" y="390" font-size="21" font-weight="bold" fill="#a24229">STATION B</text><text x="270" y="432" font-size="20">Offline; active</text><text x="270" y="462" font-size="20">version unknown.</text><text x="270" y="502" font-size="20">Keep it open for</text><text x="270" y="532" font-size="20">the system owner.</text>
<rect x="20" y="635" width="460" height="225" rx="12" fill="white" stroke="#a9cbd2" stroke-width="2"/><text x="40" y="675" font-size="23" font-weight="bold" fill="#087a78">TRANSITION STOCK</text><text x="40" y="719" font-size="21">Identify packs around the change.</text><text x="40" y="753" font-size="21">The responsible owner decides their</text><text x="40" y="787" font-size="21">actual treatment under applicable rules.</text><text x="40" y="830" font-size="20">A's result does not approve B.</text><text x="20" y="970" font-size="17">Illustration only • no price or metrology rule implied</text></g></svg>
