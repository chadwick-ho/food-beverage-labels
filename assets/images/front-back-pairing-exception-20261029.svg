<svg xmlns="http://www.w3.org/2000/svg" width="500" height="1070" viewBox="0 0 500 1070" role="img" aria-labelledby="t d"><title id="t">Wrong front and back label pair: separate line recovery from stock review</title><desc id="d">Trace an observed mismatch backward to known evidence and forward to line recovery, while the responsible owner separately reviews affected stock.</desc><rect width="500" height="1070" fill="#f3f7f7"/><rect width="500" height="145" fill="#173d4a"/><g font-family="Arial" fill="#183f4d"><text x="24" y="38" fill="#a4e9d6" font-size="19">BUYER DECISION / LABEL PAIRS</text><text x="24" y="79" fill="white" font-size="27" font-weight="bold">Wrong pair found:</text><text x="24" y="114" fill="white" font-size="27" font-weight="bold">what remains uncertain?</text>
<rect x="20" y="178" width="460" height="115" rx="12" fill="#fff0eb" stroke="#c88c7b" stroke-width="2"/><text x="40" y="219" font-size="23" font-weight="bold" fill="#a24229">OBSERVED MISMATCH</text><text x="40" y="259" font-size="21">Record the pack and component IDs.</text><path d="M250 293v35M250 328H130v35M250 328h120v35" fill="none" stroke="#688e9a" stroke-width="3"/>
<rect x="20" y="363" width="225" height="250" rx="12" fill="#e9f5f0" stroke="#a9cbd2" stroke-width="2"/><text x="35" y="402" font-size="21" font-weight="bold" fill="#087a78">LOOK BACK</text><text x="35" y="445" font-size="20">Last confirmed</text><text x="35" y="475" font-size="20">correct set?</text><text x="35" y="515" font-size="20">Roll and case</text><text x="35" y="545" font-size="20">movement records?</text><text x="35" y="585" font-size="19">Mark unknowns.</text>
<rect x="255" y="363" width="225" height="250" rx="12" fill="#edf4fa" stroke="#a9cbd2" stroke-width="2"/><text x="270" y="402" font-size="21" font-weight="bold" fill="#087a78">LINE RECOVERY</text><text x="270" y="445" font-size="20">Correct staged</text><text x="270" y="475" font-size="20">components?</text><text x="270" y="515" font-size="20">Who checks the</text><text x="270" y="545" font-size="20">next finished pair?</text><text x="270" y="585" font-size="19">Record that check.</text>
<rect x="20" y="650" width="460" height="225" rx="12" fill="white" stroke="#a9cbd2" stroke-width="2"/><text x="40" y="690" font-size="23" font-weight="bold" fill="#087a78">STOCK DECISION IS SEPARATE</text><text x="40" y="734" font-size="21">Identify held, reviewed and unknown</text><text x="40" y="768" font-size="21">finished stock and its location.</text><text x="40" y="802" font-size="21">The responsible quality owner sets</text><text x="40" y="836" font-size="21">the review boundary and disposition.</text><text x="20" y="945" font-size="20" fill="#a24229">A corrected first pack does not prove</text><text x="20" y="978" font-size="20" fill="#a24229">earlier cases were correctly paired.</text><text x="20" y="1038" font-size="17">Planning aid • no recall or automatic release rule</text></g></svg>
