<svg xmlns="http://www.w3.org/2000/svg" width="660" height="900" viewBox="0 0 660 900"><title>Match the evidence to the event</title><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#527c6d"/></marker></defs><rect width="660" height="900" fill="#edf4ef"/><g font-family="Arial, sans-serif" fill="#12304a"><text x="30" y="48" font-size="30" font-weight="bold">Match the evidence to the event</text><text x="30" y="95" font-size="21">Do not rank unlike adhesive properties as one score</text><path d="M330 275L170 315" stroke="#527c6d" stroke-width="4" marker-end="url(#arrow)"/><path d="M330 275L490 315" stroke="#527c6d" stroke-width="4" marker-end="url(#arrow)"/><path d="M170 500L230 555" stroke="#527c6d" stroke-width="4" marker-end="url(#arrow)"/><path d="M490 500L430 555" stroke="#527c6d" stroke-width="4" marker-end="url(#arrow)"/><path d="M330 715L330 765" stroke="#527c6d" stroke-width="4" marker-end="url(#arrow)"/><rect x="30" y="145" width="600" height="130" rx="14" fill="white" stroke="#aac4b8" stroke-width="2"/><text x="48" y="182" font-size="26" font-weight="bold">Observe the same identified jar</text><text x="48" y="220" font-size="24">Movement, edge lift or change of shape?</text><rect x="30" y="325" width="280" height="175" rx="14" fill="white" stroke="#aac4b8" stroke-width="2"/><text x="48" y="362" font-size="26" font-weight="bold">Along the bond</text><text x="48" y="400" font-size="24">Ask about relevant</text><text x="48" y="434" font-size="24">shear evidence</text><text x="48" y="468" font-size="24">and actual load.</text><rect x="350" y="325" width="280" height="175" rx="14" fill="white" stroke="#aac4b8" stroke-width="2"/><text x="368" y="362" font-size="26" font-weight="bold">Away from it</text><text x="368" y="400" font-size="24">Ask about relevant</text><text x="368" y="434" font-size="24">peel evidence</text><text x="368" y="468" font-size="24">and geometry.</text><rect x="30" y="565" width="600" height="150" rx="14" fill="white" stroke="#aac4b8" stroke-width="2"/><text x="48" y="602" font-size="26" font-weight="bold">Keep the conditions visible</text><text x="48" y="640" font-size="24">Construction, surface, time and temperature.</text><text x="48" y="674" font-size="24">Standard-panel and actual-pack evidence differ.</text><rect x="30" y="775" width="600" height="90" rx="14" fill="white" stroke="#aac4b8" stroke-width="2"/><text x="48" y="812" font-size="26" font-weight="bold">Agree the decision before ranking samples</text></g></svg>