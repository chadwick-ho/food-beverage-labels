<svg xmlns="http://www.w3.org/2000/svg" width="500" height="1010" viewBox="0 0 500 1010" role="img" aria-labelledby="t d"><title id="t">Trace a printed lot-value mismatch</title><desc id="d">Compare the authorized source, coding configuration and printed output; investigate the mismatch while separately controlling affected stock.</desc><rect width="500" height="1010" fill="#f3f7f7"/><rect width="500" height="145" fill="#173d4a"/><g font-family="Arial" fill="#183f4d"><text x="24" y="38" fill="#a4e9d6" font-size="19">BUYER DECISION / VARIABLE DATA</text><text x="24" y="79" fill="white" font-size="27" font-weight="bold">Readable code, wrong value:</text><text x="24" y="114" fill="white" font-size="27" font-weight="bold">where should the review start?</text>
<rect x="20" y="180" width="460" height="170" rx="12" fill="white" stroke="#a9cbd2" stroke-width="2"/><text x="40" y="220" font-size="23" font-weight="bold" fill="#087a78">COMPARE THREE RECORDS</text><text x="40" y="264" font-size="21">1. Authorized source for the job</text><text x="40" y="298" font-size="21">2. Selected template and system state</text><text x="40" y="332" font-size="21">3. Actual output on the identified pack</text>
<path d="M250 350v35" stroke="#688e9a" stroke-width="3"/><path d="M242 374l8 13 8-13" fill="#688e9a"/><rect x="20" y="390" width="460" height="200" rx="12" fill="#e9f5f0" stroke="#a9cbd2" stroke-width="2"/><text x="40" y="430" font-size="23" font-weight="bold" fill="#087a78">ASK THE RIGHT OWNER</text><text x="40" y="474" font-size="21">Source incorrect? Ask the data owner.</text><text x="40" y="508" font-size="21">Template or selection differs? Ask</text><text x="40" y="542" font-size="21">the system and line owner.</text><text x="40" y="576" font-size="21">Incomplete mark? Review print output.</text>
<rect x="20" y="620" width="460" height="235" rx="12" fill="#fff0eb" stroke="#a9cbd2" stroke-width="2"/><text x="40" y="660" font-size="23" font-weight="bold" fill="#a24229">STOCK REVIEW IS SEPARATE</text><text x="40" y="704" font-size="21">Record last supported correct output,</text><text x="40" y="738" font-size="21">stock movement and unknown interval.</text><text x="40" y="772" font-size="21">A correct restart sample does not</text><text x="40" y="806" font-size="21">automatically release earlier stock.</text><text x="20" y="965" font-size="17">Planning aid • no date logic or disposition is prescribed</text></g></svg>
