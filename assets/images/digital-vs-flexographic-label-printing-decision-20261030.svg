<svg xmlns="http://www.w3.org/2000/svg" width="640" height="1120" viewBox="0 0 640 1120" role="img" aria-label="An equal-scope cost crossing is conditional"><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8Z" fill="#486e80"/></marker></defs><g font-family="Arial, sans-serif"><rect x="0" y="0" width="640" height="1120" rx="0" fill="#f2f7fa" stroke="#a5becb" stroke-width="2"/><rect x="0" y="0" width="640" height="190" rx="0" fill="#173e4b" stroke="#173e4b" stroke-width="2"/><text x="30" y="35" fill="#a4e1d0" font-size="18" font-weight="700"><tspan x="30" dy="0">ZFU LABELS / PURCHASING DIAGRAM</tspan></text><text x="30" y="88" fill="#fff" font-size="32" font-weight="700"><tspan x="30" dy="0">An equal-scope cost crossing is</tspan><tspan x="30" dy="40">conditional</tspan></text><text x="34" y="238" fill="#213b4c" font-size="25" font-weight="700"><tspan x="34" dy="0">FICTIONAL EQUAL-SCOPE OFFERS</tspan></text><text x="34" y="285" fill="#087e7c" font-size="28" font-weight="700"><tspan x="34" dy="0">A = 60 + 0.20Q</tspan></text><text x="34" y="331" fill="#ae7200" font-size="28" font-weight="700"><tspan x="34" dy="0">B = 260 + 0.10Q</tspan></text><path d="M80 805 L585 805" fill="none" stroke="#486e80" stroke-width="3"/><path d="M80 805 L80 407" fill="none" stroke="#486e80" stroke-width="3"/><path d="M80.0 772.4285714285714 L580.0 446.7142857142857" fill="none" stroke="#087e7c" stroke-width="3"/><path d="M80.0 663.8571428571429 L580.0 501.0" fill="none" stroke="#ae7200" stroke-width="3"/><path d="M413.3333333333333 555.2857142857142 L413.3333333333333 805" fill="none" stroke="#486e80" stroke-width="3"/><circle cx="413.3333333333333" cy="555.2857142857142" r="8" fill="#173e4b"/><text x="585" y="453.7142857142857" fill="#087e7c" font-size="22" font-weight="700"><tspan x="585" dy="0">A</tspan></text><text x="585" y="508.0" fill="#ae7200" font-size="22" font-weight="700"><tspan x="585" dy="0">B</tspan></text><text x="100" y="414" fill="#213b4c" font-size="22" font-weight="400"><tspan x="100" dy="0">Total cost: fictional units</tspan></text><text x="40" y="845" fill="#213b4c" font-size="22" font-weight="400"><tspan x="40" dy="0">0</tspan></text><text x="385" y="845" fill="#213b4c" font-size="22" font-weight="400"><tspan x="385" dy="0">2,000</tspan></text><text x="517" y="845" fill="#213b4c" font-size="22" font-weight="400"><tspan x="517" dy="0">3,000</tspan></text><text x="210" y="887" fill="#213b4c" font-size="24" font-weight="400"><tspan x="210" dy="0">Quantity Q</tspan></text><text x="34" y="952" fill="#213b4c" font-size="27" font-weight="400"><tspan x="34" dy="0">Both total 460 at Q = 2,000. Not a</tspan><tspan x="34" dy="35">process threshold or actual price.</tspan></text><text x="30" y="1095" fill="#4b6473" font-size="18" font-weight="400"><tspan x="30" dy="0">Planning example / no customer result or acceptance limit</tspan></text></g></svg>