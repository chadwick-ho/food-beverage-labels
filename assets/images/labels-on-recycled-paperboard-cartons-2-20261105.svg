<svg xmlns="http://www.w3.org/2000/svg" width="660" height="600" viewBox="0 0 660 600"><title>Match the observation to the job</title><rect width="660" height="600" fill="#edf4ef"/><g font-family="Arial" fill="#12304a"><text x="30" y="48" font-size="29" font-weight="bold">Match the observation to the job</text><rect x="30" y="105" width="600" height="110" rx="10" fill="white"/><text x="55" y="147" font-size="26" font-weight="bold">Clean-removal requirement</text><text x="55" y="187" font-size="24">Fibre damage leaves that outcome unresolved.</text><rect x="30" y="260" width="600" height="110" rx="10" fill="white"/><text x="55" y="302" font-size="26" font-weight="bold">Stay-on through ordinary handling</text><text x="55" y="342" font-size="24">Locate when and where the surfaces changed.</text><rect x="30" y="415" width="600" height="110" rx="10" fill="white"/><text x="55" y="457" font-size="26" font-weight="bold">Opening-evidence requirement</text><text x="55" y="497" font-size="24">Inspect the full opening path, not paper tear alone.</text><text x="30" y="570" font-size="21">Purchasing questions, not pass criteria or a security claim.</text></g></svg>