<svg xmlns="http://www.w3.org/2000/svg" width="760" height="600" viewBox="0 0 760 600"><title>Label rolls crossing a delivery and import boundary</title><rect width="760" height="600" fill="#eff5f1"/><g font-family="Arial" fill="#12304a"><text x="35" y="55" font-size="30" font-weight="bold">Name the place and the import responsibilities</text><rect x="45" y="180" width="180" height="170" rx="15" fill="white" stroke="#416c5b"/><text x="75" y="230" font-size="28">Supplier</text><text x="65" y="280" font-size="23">Packed rolls</text><path d="M245 265H345 M435 265H525" stroke="#416c5b" stroke-width="6"/><rect x="355" y="145" width="70" height="240" fill="#d1e3d8"/><text x="302" y="440" font-size="24">Import clearance</text><rect x="545" y="180" width="175" height="170" rx="15" fill="white" stroke="#416c5b"/><text x="570" y="230" font-size="27">Co-packer</text><text x="570" y="280" font-size="23">Named place</text><text x="45" y="520" font-size="24">Door delivery wording does not identify every obligation.</text><text x="45" y="565" font-size="21">Conceptual route · no freight service or delivery promise</text></g></svg>