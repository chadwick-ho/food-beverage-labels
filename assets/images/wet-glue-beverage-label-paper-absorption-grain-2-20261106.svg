<svg xmlns="http://www.w3.org/2000/svg" width="660" height="600" viewBox="0 0 660 600"><title>Keep three evidence questions separate</title><rect width="660" height="600" fill="#edf4ef"/><g font-family="Arial" fill="#12304a"><text x="30" y="48" font-size="29" font-weight="bold">Keep three evidence questions separate</text><rect x="30" y="105" width="600" height="110" rx="12" fill="white"/><text x="55" y="148" font-size="27" font-weight="bold">Absorption at the reverse</text><text x="55" y="190" font-size="24">Does the record represent this supplied paper side?</text><rect x="30" y="260" width="600" height="110" rx="12" fill="white"/><text x="55" y="303" font-size="27" font-weight="bold">Grain within the physical label</text><text x="55" y="345" font-size="24">Does the supplied orientation match the proposal?</text><rect x="30" y="415" width="600" height="110" rx="12" fill="white"/><text x="55" y="458" font-size="27" font-weight="bold">Later wet use on the bottle</text><text x="55" y="500" font-size="24">Does the finished sample cover that actual route?</text><text x="30" y="570" font-size="21">No universal paper value, glue recipe or pass limit supplied.</text></g></svg>