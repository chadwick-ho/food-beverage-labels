<svg xmlns="http://www.w3.org/2000/svg" width="500" height="970" viewBox="0 0 500 970" role="img" aria-labelledby="t d"><title id="t">Which inkjet change needs review?</title><desc id="d">Map a changed workflow element to the evidence it affects, then resolve exceptions with the relevant owner.</desc><rect width="500" height="970" fill="#f3f7f7"/><rect width="500" height="145" fill="#173d4a"/><g font-family="Arial" fill="#183f4d"><text x="24" y="38" fill="#a4e9d6" font-size="19">BUYER DECISION / INKJET</text><text x="24" y="79" fill="white" font-size="27" font-weight="bold">Map the change to the</text><text x="24" y="114" fill="white" font-size="27" font-weight="bold">evidence it affects</text>
<text x="25" y="195" font-size="22" font-weight="bold" fill="#087a78">WHAT CHANGED?</text><text x="280" y="195" font-size="22" font-weight="bold" fill="#087a78">ASK ABOUT</text>
<g font-size="21"><rect x="20" y="220" width="200" height="90" rx="10" fill="#e9f5f0"/><text x="40" y="273">Printer or ink</text><text x="236" y="273" font-size="25">→</text><rect x="270" y="220" width="210" height="90" rx="10" fill="white"/><text x="288" y="256">Supported</text><text x="288" y="284">combination</text>
<rect x="20" y="325" width="200" height="90" rx="10" fill="#e9f5f0"/><text x="40" y="378">Media or finish</text><text x="236" y="378" font-size="25">→</text><rect x="270" y="325" width="210" height="90" rx="10" fill="white"/><text x="288" y="361">Printed surface</text><text x="288" y="389">and handling</text>
<rect x="20" y="430" width="200" height="90" rx="10" fill="#e9f5f0"/><text x="40" y="483">Pack or use</text><text x="236" y="483" font-size="25">→</text><rect x="270" y="430" width="210" height="90" rx="10" fill="white"/><text x="288" y="466">Application and</text><text x="288" y="494">exposure</text>
<rect x="20" y="535" width="200" height="90" rx="10" fill="#e9f5f0"/><text x="40" y="588">Artwork or data</text><text x="236" y="588" font-size="25">→</text><rect x="270" y="535" width="210" height="90" rx="10" fill="white"/><text x="288" y="571">Content and</text><text x="288" y="599">code approval</text></g>
<rect x="20" y="655" width="460" height="210" rx="12" fill="#fff0eb" stroke="#a9cbd2" stroke-width="2"/><text x="40" y="695" font-size="23" font-weight="bold" fill="#087a78">EVIDENCE MISSING?</text><text x="40" y="739" font-size="21">Keep the affected scope open.</text><text x="40" y="773" font-size="21">Name the owner and the next review.</text><text x="40" y="807" font-size="21">Update production instructions only</text><text x="40" y="841" font-size="21">after the actual decision is recorded.</text><text x="20" y="930" font-size="17">Planning aid • no compatibility or test result claimed</text></g></svg>
