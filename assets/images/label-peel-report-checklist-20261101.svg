<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 1040"><title>Peel report comparison checklist</title><rect width="760" height="1040" fill="#f2f7f4"/><g font-family="Arial" fill="#12304a"><text x="45" y="70" font-size="36" font-weight="bold">Compare peel reports</text><text x="45" y="110" font-size="22">Editorial checklist · not a test method</text><rect x="45" y="145" width="670" height="165" rx="15" fill="#fff"/><text x="68" y="190" font-size="27" font-weight="bold">1 · Identify the sample</text><text x="68" y="230" font-size="22">Construction, width and lot or sample ID.</text><text x="68" y="270" font-size="22">Record whether it matches the ordered label.</text><path d="M380 310v30" stroke="#568374" stroke-width="5"/><rect x="45" y="340" width="670" height="165" rx="15" fill="#fff"/><text x="68" y="385" font-size="27" font-weight="bold">2 · Check the surface</text><text x="68" y="425" font-size="22">Material, preparation and application conditions.</text><text x="68" y="465" font-size="22">Panel and actual package are different evidence.</text><path d="M380 505v30" stroke="#568374" stroke-width="5"/><rect x="45" y="535" width="670" height="165" rx="15" fill="#fff"/><text x="68" y="580" font-size="27" font-weight="bold">3 · Compare the method</text><text x="68" y="620" font-size="22">Angle, speed, dwell, environment and units.</text><text x="68" y="660" font-size="22">Do not convert unmatched conditions by guess.</text><path d="M380 700v30" stroke="#568374" stroke-width="5"/><rect x="45" y="730" width="670" height="190" rx="15" fill="#fff"/><text x="68" y="775" font-size="27" font-weight="bold">4 · Agree the next trial</text><text x="68" y="815" font-size="22">Define the package and acceptance question.</text><text x="68" y="855" font-size="22">Retain raw results and limitations.</text><text x="68" y="895" font-size="22">A single number is not line approval.</text></g></svg>