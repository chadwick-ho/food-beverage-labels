<svg xmlns="http://www.w3.org/2000/svg" width="640" height="1120" viewBox="0 0 640 1120" role="img" aria-label="Normalize the display, not the test method"><g font-family="Arial, sans-serif"><rect x="0" y="0" width="640" height="1120" fill="#f2f7fa" stroke="#a5becb" stroke-width="2"/><rect x="0" y="0" width="640" height="190" fill="#173e4b" stroke="#a5becb" stroke-width="2"/><text x="30" y="35" font-size="18" font-weight="700" fill="#a4e1d0"><tspan x="30" dy="0">ZFU LABELS / PURCHASING DIAGRAM</tspan></text><text x="30" y="88" font-size="32" font-weight="700" fill="#fff"><tspan x="30" dy="0">Normalize the display, not the</tspan><tspan x="30" dy="40">test method</tspan></text><rect x="34" y="250" width="572" height="220" fill="#fff" stroke="#a5becb" stroke-width="2"/><text x="54" y="298" font-size="30" font-weight="700" fill="#213b4c"><tspan x="54" dy="0">A: 0.20 N per 25 mm</tspan></text><text x="54" y="362" font-size="27" font-weight="400" fill="#213b4c"><tspan x="54" dy="0">200 mN / 25 mm = 8 mN/mm</tspan></text><text x="54" y="426" font-size="23" font-weight="400" fill="#213b4c"><tspan x="54" dy="0">Native value and basis stay attached.</tspan></text><rect x="34" y="530" width="572" height="220" fill="#fff" stroke="#a5becb" stroke-width="2"/><text x="54" y="578" font-size="30" font-weight="700" fill="#213b4c"><tspan x="54" dy="0">B: 0.30 N per 50 mm</tspan></text><text x="54" y="642" font-size="27" font-weight="400" fill="#213b4c"><tspan x="54" dy="0">300 mN / 50 mm = 6 mN/mm</tspan></text><text x="54" y="706" font-size="23" font-weight="400" fill="#213b4c"><tspan x="54" dy="0">Native value and basis stay attached.</tspan></text><text x="34" y="836" font-size="28" font-weight="700" fill="#213b4c"><tspan x="34" dy="0">This numerical crosswalk does not</tspan><tspan x="34" dy="36">make different specimens or test</tspan><tspan x="34" dy="36">methods equivalent.</tspan></text><text x="34" y="978" font-size="25" font-weight="400" fill="#213b4c"><tspan x="34" dy="0">Clarify ambiguous units before converting.</tspan></text><text x="30" y="1095" font-size="18" font-weight="400" fill="#4b6473"><tspan x="30" dy="0">Planning example / no customer result or acceptance limit</tspan></text></g></svg>