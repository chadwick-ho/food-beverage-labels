<svg xmlns="http://www.w3.org/2000/svg" width="660" height="900" viewBox="0 0 660 900"><title>Do not let one result approve all interfaces</title><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#527c6d"/></marker></defs><rect width="660" height="900" fill="#edf4ef"/><g font-family="Arial, sans-serif" fill="#12304a"><text x="30" y="48" font-size="30" font-weight="bold">Do not let one result approve all interfaces</text><text x="30" y="95" font-size="21">Use the material specialist’s comparison</text><path d="M330 275L170 315" stroke="#527c6d" stroke-width="4" marker-end="url(#arrow)"/><path d="M330 275L490 315" stroke="#527c6d" stroke-width="4" marker-end="url(#arrow)"/><path d="M170 505L230 560" stroke="#527c6d" stroke-width="4" marker-end="url(#arrow)"/><path d="M490 505L430 560" stroke="#527c6d" stroke-width="4" marker-end="url(#arrow)"/><path d="M330 720L330 765" stroke="#527c6d" stroke-width="4" marker-end="url(#arrow)"/><rect x="30" y="145" width="600" height="130" rx="14" fill="white" stroke="#aac4b8" stroke-width="2"/><text x="48" y="182" font-size="26" font-weight="bold">Identify the affected complete stock</text><text x="48" y="220" font-size="24">Face, adhesive, liner, lot and history.</text><rect x="30" y="325" width="280" height="180" rx="14" fill="white" stroke="#aac4b8" stroke-width="2"/><text x="48" y="362" font-size="26" font-weight="bold">Release evidence</text><text x="48" y="400" font-size="24">Named method</text><text x="48" y="434" font-size="24">and observed</text><text x="48" y="468" font-size="24">dispensing scope.</text><rect x="350" y="325" width="280" height="180" rx="14" fill="white" stroke="#aac4b8" stroke-width="2"/><text x="368" y="362" font-size="26" font-weight="bold">Later adhesion</text><text x="368" y="400" font-size="24">Reference and</text><text x="368" y="434" font-size="24">conditioning</text><text x="368" y="468" font-size="24">clearly identified.</text><rect x="30" y="570" width="600" height="150" rx="14" fill="white" stroke="#aac4b8" stroke-width="2"/><text x="48" y="607" font-size="26" font-weight="bold">Return to the actual container</text><text x="48" y="645" font-size="24">Keep surface and application conditions visible.</text><text x="48" y="679" font-size="24">Do not isolate a cause from a mixed comparison.</text><rect x="30" y="775" width="600" height="90" rx="14" fill="white" stroke="#aac4b8" stroke-width="2"/><text x="48" y="812" font-size="26" font-weight="bold">Keep each decision separate</text></g></svg>