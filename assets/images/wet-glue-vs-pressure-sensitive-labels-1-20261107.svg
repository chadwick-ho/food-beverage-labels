<svg xmlns="http://www.w3.org/2000/svg" width="660" height="600" viewBox="0 0 660 600"><title>A plain stack is not the decorated stack</title><rect width="660" height="600" fill="#edf4ef"/><g font-family="Arial" fill="#12304a"><text x="28" y="48" font-size="28" font-weight="bold">A plain stack is not the decorated stack</text><g fill="white" stroke="#527c6d" stroke-width="3"><path d="M45 195h230v30H45zM45 240h230v30H45zM45 285h230v30H45z"/><path d="M375 195h65q25-35 50 0h115v30H375zM375 255h65q25-35 50 0h115v30H375zM375 315h65q25-35 50 0h115v30H375z"/></g><text x="55" y="140" font-size="26">Plain reference</text><text x="370" y="140" font-size="26">Raised feature</text><text x="45" y="410" font-size="25">Compare the actual delivered presentation.</text><text x="45" y="465" font-size="24">A relief feature is not a diagnosed feeding defect.</text><text x="28" y="568" font-size="21">Enlarged conceptual sections; no stack-height prediction.</text></g></svg>