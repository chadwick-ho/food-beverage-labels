<svg xmlns="http://www.w3.org/2000/svg" width="500" height="1100" viewBox="0 0 500 1100" role="img" aria-labelledby="t d"><title id="t">Give each cut-and-stack label an orientation reference</title><desc id="d">Define the component, viewing direction, printed face and top edge, then confirm the first picked piece with the station owner.</desc><rect width="500" height="1100" fill="#f3f7f7"/><rect width="500" height="145" fill="#173d4a"/><g font-family="Arial" fill="#183f4d"><text x="24" y="38" fill="#a4e9d6" font-size="19">BUYER DECISION / STACK LABELS</text><text x="24" y="79" fill="white" font-size="27" font-weight="bold">Define the stack view</text><text x="24" y="114" fill="white" font-size="27" font-weight="bold">before ordering</text>
<rect x="20" y="175" width="460" height="405" rx="12" fill="white" stroke="#a9cbd2" stroke-width="2"/><text x="40" y="215" font-size="23" font-weight="bold" fill="#087a78">IDENTIFY THE COMPONENT</text><rect x="132" y="272" width="270" height="190" rx="8" fill="#d5e9e3" stroke="#89ada5" stroke-width="2"/><rect x="123" y="263" width="270" height="190" rx="8" fill="#deeee8" stroke="#89ada5" stroke-width="2"/><rect x="115" y="255" width="270" height="190" rx="8" fill="#e9f5f0" stroke="#39958b" stroke-width="3"/><path d="M250 415v-110m0 0-18 18m18-18 18 18" stroke="#15786f" stroke-width="6" fill="none"/><text x="105" y="485" font-size="21">Example face; pick side unconfirmed</text><text x="40" y="535" font-size="21">Mark artwork top in the stated view.</text>
<rect x="20" y="610" width="460" height="190" rx="12" fill="#edf4fa" stroke="#a9cbd2" stroke-width="2"/><text x="40" y="650" font-size="23" font-weight="bold" fill="#087a78">CONFIRM THE STATION</text><text x="40" y="692" font-size="21">Which magazine and component?</text><text x="40" y="726" font-size="21">Which piece and edge is picked first?</text><text x="40" y="760" font-size="21">The equipment owner confirms it.</text>
<rect x="20" y="830" width="460" height="175" rx="12" fill="#fff0eb" stroke="#a9cbd2" stroke-width="2"/><text x="40" y="870" font-size="23" font-weight="bold" fill="#087a78">NO STATION REFERENCE?</text><text x="40" y="912" font-size="21">Keep orientation open; do not invent</text><text x="40" y="946" font-size="21">a universal face-up or top-first rule.</text><text x="20" y="1068" font-size="17">Illustration only • not a machine loading instruction</text></g></svg>
